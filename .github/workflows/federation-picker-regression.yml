name: Federation picker regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/regression_federation_picker_release.js'
      - 'tests/browser_federation_picker.js'
      - 'tests/browser_opponent_approval.js'
      - 'tests/browser_opponent_review_inbox.js'
      - 'tests/regression_opponent_review_inbox.js'
      - 'js/opponent-review-inbox.js'
      - 'tests/regression_federation_match_save_contract.js'
      - 'tests/regression_opponents_settings.js'
      - '.github/workflows/federation-picker-regression.yml'
      - 'supabase/migrations/20261106*.sql'
      - 'supabase/migrations/20261107*.sql'
      - 'tests/sql/federation_*.sql'
      - 'tests/sql/opponent_review_*.sql'
      - 'tests/sql/opponent_deletion_*.sql'
      - 'tests/sql/opponent_notification_*.sql'
  workflow_dispatch:
jobs:
  picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/regression_federation_picker_release.js
      - run: node tests/regression_federation_match_save_contract.js
      - run: node tests/regression_opponents_settings.js
      - run: node tests/regression_opponent_review_inbox.js
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser federation picker acceptance
        run: node tests/browser_federation_picker.js
      - name: Browser opponent approval acceptance
        run: node tests/browser_opponent_approval.js
      - name: Browser review inbox adapter acceptance
        run: node tests/browser_opponent_review_inbox.js
      - name: Verify federation SQL test fixtures and migrations are tracked
        run: |
          test -s tests/sql/federation_link_negative_isolated.sql
          test -s tests/sql/federation_link_rls_matrix_isolated.sql
          test -s tests/sql/opponent_review_nonadmin_rls_isolated.sql
          test -s tests/sql/opponent_deletion_completion_notifications_isolated.sql
          test -s tests/sql/opponent_notification_integrity_rls_isolated.sql
          test -s tests/sql/federation_alias_soft_delete_survival_isolated.sql
          test -s tests/sql/federation_reviewed_alias_identity_guard_isolated.sql
          test -s tests/sql/federation_historical_alias_resolution_isolated.sql
          test -s supabase/migrations/20261106200000_game_opponent_federation_links.sql
          test -s supabase/migrations/20261106203000_backfill_verified_game_federation_links.sql
          test -s supabase/migrations/20261107021000_opponent_historical_aliases.sql
          test -s supabase/migrations/20261107023000_resolve_historical_opponent_alias.sql
          test -s supabase/migrations/20261107024500_preserve_soft_deleted_historical_alias.sql
          test -s supabase/migrations/20261107030000_guard_reviewed_alias_identity.sql
