<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Team Season</title>
<meta name="robots" content="noindex, nofollow">
<!-- PWA: lets a parent "Add to Home Screen" for a real app icon. The
     manifest href below is a static fallback; loadTeamPage() swaps it
     for a per-family version (same content, start_url carries their own
     ?token=) as soon as the token is known — see setupPwaManifest(). -->
<link rel="manifest" id="webAppManifest" href="team-manifest.json">
<meta name="theme-color" content="#0F1E2E">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NextEleven">
<meta name="mobile-web-app-capable" content="yes">
<!-- Dark mode (Claro/Escuro/Automático): set the data-theme attribute
     before the <style> block below parses/paints, so the correct theme
     renders on first paint with no flash of the wrong one. Automático's
     live reaction to OS changes needs no script at all — it's handled by
     the @media(prefers-color-scheme) rules in that block. -->
<script>
(function(){
  try{
    var v = localStorage.getItem('ne_theme');
    document.documentElement.setAttribute('data-theme', (v==='light'||v==='dark') ? v : 'auto');
  }catch(e){
    document.documentElement.setAttribute('data-theme','auto');
  }
})();
</script>
<style>
  :root{
    --black:#B23333;
    --dark:#333333;
    --muted:#6f6f6f;
    --border:#dddddd;
    --bg:#F2F4F7;
    --surface:#ffffff;
    --radius:3px;
    --green:#2a7a4e;
    --green-bg:#e6f4ea;
    --amber:#7a5f18;
    --amber-bg:#fbf3d9;
    --red:#b03030;
    --red-bg:#fbe9e9;
    --gray:#5a5f66;
    --gray-bg:#eceef1;
    /* Dark-mode additions below — each light-mode default exactly matches
       the hardcoded value it replaces, so Claro stays pixel-identical. */
    --tile-bg:#f5f6f8;         /* .stat-grid.boxed tile, distinct from the card */
    --navy-text:#0F1E2E;       /* navy used as plain text on a dynamic surface
                                   (League Leader Spotlight) — kept separate from
                                   the --black/navy brand accents that sit on
                                   their own fixed-colour backgrounds, which are
                                   left unchanged by design */
    --skel-a:#eee;             /* skeleton shimmer gradient stops */
    --skel-b:#f5f5f5;
    /* "-accent" variables: the SAME green/red/amber/brand-red used as plain
       TEXT or a decorative border directly on a dynamic surface (--surface
       / --bg / the page), as opposed to --green/--red/--amber/--black
       themselves, which stay exactly as-is when paired with their own
       matching pale -bg chip (badges, date chips) — that pairing is
       self-contained and already reads fine regardless of the page theme,
       so it is deliberately left untouched. Victor, 2026-11-02 (readability
       follow-up): "Keep the green, red and amber colour coding, but use
       brighter, accessible variants in dark mode." Light-mode default is
       identical to the base colour, so Claro is unaffected. */
    --green-accent:#2a7a4e;
    --red-accent:#b03030;
    --amber-accent:#7a5f18;
    --black-accent:#B23333;
    /* Club-crest watermarks (background + classification-card corner mark)
       — unchanged asset, only their opacity is themed: a pale logo at the
       same opacity reads noticeably stronger against a dark page, so dark
       mode dims it further to stay "subtle and decorative". */
    --watermark-opacity:0.06;
    --watermark-opacity-card:0.12;
  }
  /* Dark theme (Escuro, forced) — see NEXT ELEVEN dark-mode spec. Values
     from the spec: bg #111827, surface #1F2937, elevated #253247,
     primary text #F9FAFB, secondary text #B6C3D6, borders #374151.
     --black/--green/--red/--amber (+ their -bg pairs) and the navy used as
     a background are intentionally NOT overridden here — they are the
     NextEleven brand accents and self-contained chip/pill pairings the
     spec asks to preserve rather than invert. */
  :root[data-theme="dark"]{
    --bg:#111827;
    --surface:#1F2937;
    --dark:#F9FAFB;
    --muted:#B6C3D6;
    --border:#374151;
    --gray-bg:#2b3544;
    --tile-bg:#253247;
    --navy-text:#C7D6EC;
    --skel-a:#2b3544;
    --skel-b:#374151;
    /* Brightened, WCAG AA-checked against both --bg #111827 and --surface
       #1F2937 (≥4.5:1 for normal text in every case below). */
    --green-accent:#4ADE80;
    --red-accent:#F87171;
    --amber-accent:#FBBF24;
    --black-accent:#F87171;
    --watermark-opacity:0.035;
    --watermark-opacity-card:0.07;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-theme="dark"]){
      --bg:#111827;
      --surface:#1F2937;
      --dark:#F9FAFB;
      --muted:#B6C3D6;
      --border:#374151;
      --gray-bg:#2b3544;
      --tile-bg:#253247;
      --navy-text:#C7D6EC;
      --skel-a:#2b3544;
      --skel-b:#374151;
      --green-accent:#4ADE80;
      --red-accent:#F87171;
      --amber-accent:#FBBF24;
      --black-accent:#F87171;
      --watermark-opacity:0.035;
      --watermark-opacity-card:0.07;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;font-family:'Montserrat',Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--dark);margin:0;overscroll-behavior-x:none}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
  .app-header{background:#0F1E2E;display:flex;align-items:center;gap:10px;padding:12px 16px}
  .app-header .brand-mark{width:32px;height:32px;border:1.5px solid var(--black);border-radius:6px;background:linear-gradient(135deg,#0F1E2E,#1a2f45);display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;color:#fff;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
  .app-header .brand-name{font-weight:800;font-size:16px;color:#fff}
  .app-header .brand-name b{color:var(--black)}
  .team-header{margin-bottom:16px}
  .team-header h1{font-size:22px;margin:0 0 2px;font-weight:800}
  .team-header .sub{font-size:13px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
  /* Season/previous achievements — a deliberately warm, pale-cream
     call-out card (not the plain --surface), same idea as a -bg chip:
     self-contained and fixed in both themes, so its own text needs its
     own fixed, always-readable colours rather than following --dark/
     --muted, which would turn light in Escuro and vanish against this
     pale background. */
  .highlight-card{background:#faf7f0;border-color:#e2d9c4}
  .highlight-card .row-name{color:#3a3326}
  .highlight-card .row-meta{color:#8a7a52}
  .highlight-card .card-title{color:#8a7a52}
  /* Club-crest watermarks — same unchanged logo asset in both themes,
     only the opacity is themed (dimmer in Escuro, see --watermark-opacity*
     above): a pale crest at a fixed opacity reads noticeably stronger
     against a dark page than it does on the original white one. */
  .club-watermark-bg{opacity:var(--watermark-opacity)}
  .club-watermark-card{opacity:var(--watermark-opacity-card)}
  /* Birthday call-out — same fixed, self-contained pale-yellow pattern as
     .highlight-card above: the card's own colour (inherited by the plain
     message/name text that sets none of its own) plus explicit overrides
     for .row-meta and .birthday-card-sub, which otherwise set their own
     --muted and would turn light in Escuro. */
  .birthday-card{background:#fef6e0;border-color:#f0d98a;color:#4a3d05}
  .birthday-card .row-name{color:#4a3d05}
  .birthday-card .row-meta,
  .birthday-card .birthday-card-sub{color:#8a7020}
  .card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .stat-value{font-size:20px;font-weight:800;margin-top:2px}
  /* "Boxed" variant — scoped to this modifier rather than every .stat-grid
     (several existing ones sit on a dark background or are loading
     skeletons, where a light tile would look wrong) — tiles with a light
     background and rounded corners, matching the reference screenshot
     Victor shared. box-green highlights the "best of" achievement tiles
     the same way that reference highlighted its best-streak tiles. */
  .stat-grid.boxed > div{background:var(--tile-bg);border-radius:8px;padding:10px 8px;text-align:center}
  /* Achievement highlight tile — pale green stays the highlight (and the
     bg/text pairing is already proven to work, since it's the same one
     .badge-W etc. use elsewhere), explicit here only because .stat-value/
     .stat-label set no colour of their own and would otherwise inherit
     --dark, which turns light in Escuro and goes invisible against this
     fixed pale background. Victor, 2026-11-02 (readability follow-up):
     "pale green statistic tiles where white text is almost invisible". */
  .stat-grid.boxed > div.box-green{background:var(--green-bg)}
  .stat-grid.boxed > div.box-green .stat-label,
  .stat-grid.boxed > div.box-green .stat-value{color:var(--green)}
  .stat-grid.boxed .stat-value{font-size:18px}
  /* Season Calendar — same light-tile "boxed" look as .stat-grid.boxed
     above (reused colour/radius), one tile per calendar item instead of
     a plain divider row, so breaks/Folgas/milestones read as distinct
     entries at a glance rather than blending into a dense list. The
     coloured date chip (see .match-card-date/.cal-box below) is the
     shared visual language across both .cal-box tiles and .match-card
     rows — green/red/amber tell home/away/pause apart without relying on
     colour alone, since the icon and text label next to it say the same
     thing (Victor, 2026-11-01 mockup spec: "Do not rely on colour alone.
     The icon and text must clearly identify home versus away."). */
  .cal-box-list{display:flex;flex-direction:column;gap:10px}
  /* Legend (Victor, 2026-11-01: "the key — plane is away, house is home
     and calendar of days — put it at the top"), one line of icon+label
     pairs sitting above the list, in the same colours the cards below
     use, so the icons/colours are explained before parents meet them. */
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;font-weight:700;margin:2px 0 10px}
  .cal-legend-item{display:inline-flex;align-items:center;gap:4px}
  .cal-legend-item.is-home{color:var(--green-accent)}
  .cal-legend-item.is-away{color:var(--red-accent)}
  .cal-legend-item.is-pause{color:var(--amber-accent)}
  /* display:flex so the tile can carry the same .match-card-date column
     as match cards (Victor, 2026-11-01: "the folga dates are not the
     same as the others") — .cal-box-body holds the title/meta/note that
     used to sit directly in .cal-box.
     Dual colouring + visible rectangle (Victor, 2026-11-01 mockup: "a
     color for the date and another for the content... the rectangle was
     visible with a slight drop shadow or line") — the whole tile used to
     share one flat background with no border; now the date column and
     the content get their own distinct fill (reusing .match-card-date
     below for the colour split) and the outer tile gets a real border +
     soft shadow so it reads as a distinct card, not a flat row.
     overflow:hidden clips both children to the shared border-radius. */
  .cal-box{background:var(--surface);border-radius:10px;padding:0;border:1px solid var(--border);border-left:4px solid #c7cbd1;box-shadow:0 1px 3px rgba(16,24,40,.08);display:flex;gap:0;align-items:stretch;overflow:hidden}
  .cal-box-body{flex:1;min-width:0;padding:10px 12px 10px 10px}
  .cal-box-title{font-weight:700;font-size:13px}
  .cal-box-meta{font-size:11px;color:var(--muted);margin-top:2px}
  /* Tournaments (no cal-pause/cal-milestone class) get a neutral grey
     date chip — still its own distinct colour from the white content
     area, just not a semantic one. */
  .cal-box .match-card-date{background:#eef0f3;color:#333}
  /* Pauses (Folga/Christmas/Easter) and milestones get their own colour so
     they stand out from ordinary fixtures/tournaments in the merged list,
     reusing the existing badge palette (same amber/green used for W/D/L
     and status badges elsewhere) rather than introducing new colours. The
     colour lives on the date chip (dual-colour per tile) AND, per
     Victor's follow-up (2026-11-01: "put back that little border... with
     this dark color"), on a 4px left border in that same solid accent
     colour — the chip is the pale tint, the border is the full-strength
     colour, same pairing .badge-W/.match-card-ha already use elsewhere. */
  .cal-box.cal-pause{border-left-color:var(--amber-accent)}
  .cal-box.cal-pause .match-card-date{background:var(--amber-bg);color:var(--amber)}
  .cal-box.cal-pause .cal-box-title{color:var(--amber-accent)}
  .cal-box.cal-pause .cal-box-meta{color:var(--amber-accent)}
  .cal-box.cal-milestone{border-left-color:var(--green-accent)}
  .cal-box.cal-milestone .match-card-date{background:var(--green-bg);color:var(--green)}
  .cal-box.cal-milestone .cal-box-title{color:var(--green-accent)}
  .cal-box.cal-milestone .cal-box-meta{color:var(--green-accent)}
  /* Month grouping (Victor, 2026-11-01 mockup): a dark-navy header per
     month — same navy already used for .app-header/.summary-card
     elsewhere on this page, not a new colour — with a dynamically
     computed event count, so a long scroll reads as clearly separated
     monthly blocks instead of one flat list. Replaces the old plain-text
     .cal-section-label. */
  .cal-month-group{margin-bottom:16px}
  .cal-month-group:last-child{margin-bottom:0}
  .cal-month-header{background:#0F1E2E;color:#fff;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:12px;margin-bottom:8px}
  .cal-month-header .cal-month-count{font-weight:600;font-size:10.5px;opacity:.8;white-space:nowrap}
  .cal-month-items{display:flex;flex-direction:column;gap:8px}
  /* Match card — two-column layout (date/time left, opponent/home-away/
     venue/directions right), per the mockup. Each card carries its own
     colour AND icon AND text label for home/away, never colour alone.
     Opponent/venue text wraps rather than truncates — long names (a
     validation requirement) must stay fully readable on mobile. */
  .match-card{display:flex;gap:0;background:var(--surface);border-radius:10px;padding:0;border:1px solid var(--border);border-left:4px solid var(--green-accent);box-shadow:0 1px 3px rgba(16,24,40,.08);position:relative;overflow:hidden}
  .match-card.is-away{border-left-color:var(--red-accent)}
  /* Dual colouring (Victor, 2026-11-01 mockup: "a color for the date and
     another for the content") — the date chip carries the home/away
     colour (green/red) as its own background; the content area stays a
     plain, neutral white/surface so the two zones read as distinct
     blocks within one bordered, shadowed card, not one flat tint. The
     4px left border above repeats the same colour at full strength
     (Victor's follow-up, 2026-11-01: "put back that little border...
     with this dark color of each rectangle") — pale chip + solid border,
     same pairing as .badge-W/.match-card-ha elsewhere. */
  .match-card-date{flex:0 0 50px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:10px 4px;background:var(--green-bg);color:var(--green)}
  .match-card.is-away .match-card-date{background:var(--red-bg);color:var(--red)}
  .match-card-dow{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.85}
  .match-card-daynum{font-size:17px;font-weight:800;line-height:1.1}
  .match-card-mon{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.85}
  .match-card-time{font-size:10px;margin-top:4px;font-weight:600;opacity:.85}
  .match-card-body{flex:1;min-width:0;padding:10px 12px 10px 10px;padding-right:40px;background:var(--surface)}
  .match-card-opponent-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .match-card-opponent{font-weight:700;font-size:13px;overflow-wrap:anywhere}
  .match-card-ha{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:11px;margin-top:4px;color:var(--dark)}
  .match-card-ha-pill{display:inline-flex;align-items:center;gap:3px;font-weight:700}
  .match-card-ha.is-home .match-card-ha-pill{color:var(--green-accent)}
  .match-card-ha.is-away .match-card-ha-pill{color:var(--red-accent)}
  .match-card-venue{color:var(--muted);overflow-wrap:anywhere}
  .match-card-dir{margin-top:5px;font-size:11px}
  /* Jornada/round — "discreet", so it sits tucked in the card's own
     corner at small, muted size rather than competing with the opponent
     name for attention (Victor, 2026-11-01: "displayed discreetly
     without cluttering the card"). */
  .match-card-round{position:absolute;top:9px;right:12px;font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .pct-bar-row{margin-bottom:9px}
  .pct-bar-row:last-child{margin-bottom:0}
  .pct-bar-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .pct-bar-head .pct-bar-label{font-weight:700}
  .pct-bar-head .pct-bar-pct{color:var(--muted)}
  .pct-bar-track{height:8px;background:var(--gray-bg);border-radius:4px;overflow:hidden}
  .pct-bar-fill{height:100%;border-radius:4px}
  .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  /* Card-events strip sits directly under a Recent Results .row (same
     parent, not wrapped) so the existing `.row:last-child` border logic
     keeps working for rows with no cards. When a strip follows a row,
     the border moves onto the strip instead, so the visual rhythm (one
     border per result item) stays the same whichever one is actually last. */
  .row:has(+ .card-events-line){border-bottom:none}
  .card-events-line{font-size:11px;color:var(--muted);padding:0 0 9px 0;border-bottom:1px solid var(--border);line-height:1.5}
  .card-events-line:last-child{border-bottom:none}
  .row-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .row-meta{font-size:11px;color:var(--muted);flex-shrink:0}
  .pill{background:#eee;color:#333;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;flex-shrink:0}
  .badge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;flex-shrink:0}
  .badge-W{background:var(--green-bg);color:var(--green)}
  .badge-D{background:var(--amber-bg);color:var(--amber)}
  .badge-L{background:var(--red-bg);color:var(--red)}
  .score{font-size:13px;font-weight:700;flex-shrink:0}
  .leader-row{align-items:flex-start}
  .leader-row .row-name{flex:0 0 auto;white-space:normal}
  .leader-row .row-meta{flex:1;min-width:0;text-align:right;white-space:normal;overflow-wrap:anywhere}
  .scorer-group-label{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);padding:9px 0 2px}
  .scorer-row-top{background:linear-gradient(90deg,#fdf3d9,var(--amber-bg));margin:0 -16px;padding:9px 16px;border-radius:6px;border-bottom:none}
  .scorer-row-top .row-name{font-size:14px;font-weight:800;color:#8a6d1f}
  .scorer-row-top .row-meta{font-weight:700;color:#8a6d1f}
  .comp-tag{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0}
  .live-card{border-color:var(--black);border-width:2px;padding:22px 18px 20px;text-align:center;box-shadow:0 2px 10px rgba(178,51,51,.18)}
  .live-flag{display:inline-flex;align-items:center;gap:7px;color:#fff;background:var(--black);border-radius:20px;padding:5px 14px;font-weight:800;font-size:12px;letter-spacing:1px}
  .live-flag .dot{width:9px;height:9px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
  .live-fixture{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .live-team{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
  .live-score{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px;flex-shrink:0}
  .live-meta{font-size:12px;color:var(--muted);margin-top:6px}
  .live-note{font-size:11px;color:var(--muted);margin-top:12px}
  .summary-card{border-color:#0F1E2E;border-width:2px;padding:22px 18px 20px;text-align:center}
  .summary-flag{display:inline-flex;align-items:center;color:#fff;background:#0F1E2E;border-radius:20px;padding:5px 14px;font-weight:800;font-size:12px;letter-spacing:1px}
  .summary-card .live-score{font-size:30px;font-weight:700}
  .summary-card .live-team{font-size:13px;font-weight:700}
  .scorer-cols{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);line-height:1.8;font-size:13px}
  .scorer-col{flex:1;min-width:0}
  .scorer-col .who{font-weight:600}
  .scorer-col.opponent-scorers .who{font-weight:600;color:var(--muted)}
  .split-note{font-size:12px;color:var(--muted);margin:0 0 8px}
  .split-line{font-size:11px;color:var(--muted);padding:0 0 9px;margin-top:-4px}
  /* Card badges (🟨/🟥) for a player-stats row live on their own line,
     right-aligned, instead of inline after the GP/G/A pills. Inline, a
     variable 4th/5th pill shifted the GP/G/A pills left on any row with a
     card, breaking column alignment against rows with none. */
  .card-line{display:flex;justify-content:flex-end;gap:8px;padding:0 0 9px;margin-top:-4px}
  .outcome-banner{text-align:center;padding:18px 16px}
  .outcome-banner .name{font-weight:700;font-size:14px}
  .outcome-banner .label{font-size:19px;font-weight:800;margin-top:4px}
  .squad-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#eee;color:#333;font-size:11px;font-weight:700;flex-shrink:0}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty .icon{font-size:32px;margin-bottom:10px}
  .loading{text-align:center;padding:60px 16px;color:var(--muted)}

<script>
// ── THEME (Claro / Escuro / Automático) ─────────────────────────────────────
// Dark-mode controller. Preference saved in localStorage only — no login
// required on this public page. Automático's live reaction to OS changes
// is handled entirely by the @media(prefers-color-scheme) rules in the
// <style> block above; this object only persists the manual choice and
// keeps the compact header toggle's icon in sync with it. The <head>
// inline script (before <style>) applies the saved choice before first
// paint to avoid a flash of the wrong theme. Deliberately duplicated from
// index.html rather than factored into a shared file — two independent,
// standalone pages.
const NeTheme = {
  KEY: 'ne_theme',
  get() { try { const v = localStorage.getItem(this.KEY); return (v === 'light' || v === 'dark') ? v : 'auto'; } catch(e) { return 'auto'; } },
  icon(theme) { return theme === 'light' ? '☀️' : theme === 'dark' ? '🌙' : '🌓'; },
  apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('[data-theme-toggle]').forEach(btn => { btn.textContent = this.icon(theme); });
  },
  set(theme) { try { localStorage.setItem(this.KEY, theme); } catch(e) {} this.apply(theme); },
  cycle() {
    const order = ['auto', 'light', 'dark'];
    this.set(order[(order.indexOf(this.get()) + 1) % order.length]);
  },
};
document.addEventListener('DOMContentLoaded', () => NeTheme.apply(NeTheme.get()));

// ── CONFIG ───────────────────────────────────────────────────────────────────
// Pre-configured so this page works with zero setup for whoever opens the
// link — same reasoning as the main app's own DEFAULTS: these values are
// meant to be public-facing (Supabase's anon key carries no special
// privileges by itself), and the actual security boundary is entirely
// inside the get_public_team_data RPC and this feature's RLS policy, not
// secrecy of the project URL.
const SUPABASE_URL = 'https://wicydcvdakqopodbxtrl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpY3lkY3ZkYWtxb3BvZGJ4dHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDA5NTUsImV4cCI6MjA5NzE3Njk1NX0._sIaztNAGi9ffuL8qz84G-q_h5TIKTYbyjcnD9VwbE0';

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Mirrors Classification.cleanTeamName() in the admin app (index.html).
// Some sources copy their standings table as plain text with the team
// name effectively doubled — "Palmense Palmense", "SL Olivais SL Olivais
// B" — e.g. a crest/short-code shown next to the full name gets copied
// along with it. This collapses an exact, consecutive repeat of the
// leading phrase; a genuinely distinct name is left untouched. Duplicated
// here (not imported) because team.html is a standalone, dependency-free
// page — applied only at display time, so it also cleans up a snapshot
// that was already published before this fix, without needing a re-import.
function cleanTeamName(name) {
  const s = String(name || '').trim().replace(/\s+/g, ' ');
  const m = s.match(/^(.+?) \1(?: (.+))?$/);
  if (m) return m[2] ? `${m[1]} ${m[2]}` : m[1];
  return s;
}
function fmtDate(d) {
  if (!d) return '—';
  const parts = String(d).split('-');
  if (parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}
// Local HH:MM for an ISO timestamp (actualKickoffAt), matching the
// locale convention already used for the admin app's own kickoff-time
// display (index.html, startGameNow/undoGameStart button).
function fmtTimeHM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString(getLang()==='pt'?'pt-PT':'en-GB', {hour:'2-digit',minute:'2-digit'});
}
function roundLabel(game) {
  return game && game.round ? tr('round_label', { n: game.round }) : '';
}
function shortName(fullName) {
  if (!fullName) return '';
  const parts = String(fullName).trim().split(/\s+/);
  if (parts.length <= 2) return fullName;
  return parts[0] + ' ' + parts[parts.length - 1];
}

// Ordering — date, then kick-off time, everywhere a game list appears on
// this page. public-stats-core.js (loaded above) defines its own
// gameSortKey; this one is declared after it, so it takes over the name
// for every caller, including any sort done internally by that file's own
// stats functions (a plain function name is one shared slot, resolved at
// call time — the later declaration wins regardless of who calls it).
// A round number breaks a genuine tie (two games at the same kick-off,
// e.g. two tournament groups playing simultaneously) so the order is
// always the same rather than depending on whatever order the data
// happened to arrive in.
function gameSortKey(game) {
  if (!game || !game.date) return 0;
  const ms = new Date(`${game.date}T${game.gameTime || '00:00'}`).getTime();
  if (isNaN(ms)) return 0;
  const roundFrac = Number.isFinite(game.round) ? Math.min(game.round, 999) / 1000 : 0;
  return ms + roundFrac; // sub-millisecond nudge — never changes the date/time order, only breaks exact ties
}

// ── SAME RULES AS THE MAIN APP ─────────────────────────────────────────
// Completion: kick-off + match duration + 15 min buffer (the app's
// isGameResultVisible). No kick-off time: counts once the day has ended.
// actualKickoffAt — set in the admin app via the "Game Starting Now"
// button when the real kickoff runs late — is the true start time when
// present, kept in sync with isGameResultVisible/isGameLive in index.html
// by hand (this file shares no module system with that one).
function isGameFinished(g, season) {
  if (!g || !g.date) return false;
  const now = new Date();
  if (!g.gameTime && !g.actualKickoffAt) return now > new Date(`${g.date}T23:59:59`);
  const kickoff = g.actualKickoffAt ? new Date(g.actualKickoffAt) : new Date(`${g.date}T${g.gameTime}`);
  if (isNaN(kickoff)) return false;
  const mins = (parseInt(g.matchDurationMins) || parseInt(season && season.defaultMatchDurationMins) || 90) + 15;
  return now >= new Date(kickoff.getTime() + mins * 60000);
}
// Kicked off but not finished yet — shown live, never counted in any record.
// Same grouping as the main app's Squad/Convocados/Starting XI screens —
// kept identical by hand, since this file and index.html share no
// module system. The 10 input values match CONFIG.POSITIONS there.
const POSITION_GROUP_ORDER = ['goalkeeper','defender','midfielder','striker','other'];
const POSITION_TO_GROUP = {
  'Goalkeeper': 'goalkeeper',
  'Centre Back': 'defender', 'Right Back': 'defender', 'Left Back': 'defender',
  'Defensive Midfielder': 'midfielder', 'Central Midfielder': 'midfielder', 'Attacking Midfielder': 'midfielder',
  'Right Winger': 'striker', 'Left Winger': 'striker', 'Striker': 'striker',
};
function getPositionGroup(position) {
  return POSITION_TO_GROUP[position] || 'other';
}
function groupPlayersByPosition(players, getPosition) {
  const groups = { goalkeeper: [], defender: [], midfielder: [], striker: [], other: [] };
  (players || []).forEach(p => groups[getPositionGroup(getPosition(p))].push(p));
  const byShirt = (a, b) => {
    const na = a.shirtNumber, nb = b.shirtNumber;
    const hasA = na !== null && na !== undefined && na !== '';
    const hasB = nb !== null && nb !== undefined && nb !== '';
    if (hasA && hasB) return parseInt(na) - parseInt(nb);
    if (hasA) return -1;
    if (hasB) return 1;
    return 0;
  };
  POSITION_GROUP_ORDER.forEach(g => groups[g].sort(byShirt));
  return groups;
}
function renderPositionGroupedRows(players, renderRow) {
  const groups = groupPlayersByPosition(players, p => p.primaryPosition);
  return POSITION_GROUP_ORDER
    .filter(g => groups[g].length)
    .map(g => `

// Shared by the live card and the finished-match summary card, so a goal

// minute shown when it's known (derived from the goal event's scoredAt
// vs. kickoff — see buildMatchGoalSummary/minuteFromScoredAt), a generic
// placeholder with no name for the opponent's side since we only know
// their running score, not who scored. Previously the live card had its
// own separate, simpler rendering — a flat, unlabeled list of scorer
// names with no minute and no left/right side at all, which from the
// opponent-first "Away" scoreline (opponent listed first/left, since
// score headers always read Home — Away) could misread as if our own
// scorer belonged to the opponent shown right above it. Also, unlike this
// shared helper, it recomputed scorers from the season-stats-gated

function renderScorerColumns(g, season, players, gamePlayers, tempPlayers) {

  const summary = buildMatchGoalSummary(g, gps, players, tempPlayers || [], g.goalEvents || []);
  const usHome = g.homeAway === 'Home' || (g.homeAway === 'Neutral' && g.neutralSide === 'home');
  const goalLine = (who, minute) => `<div><span aria-hidden="true">⚽</span> <span class="who">${who}</span>${minute != null ? ` ${minute}&#39;` : ''}</div>`;
  const ourLines = summary.ourGoals.map(x => goalLine(esc(x.isOwnGoal ? tr('own_goal') : (x.name ? shortName(x.name) : 'Unknown')), x.minute)).join('');
  const theirLines = summary.opponentGoals.map(x => goalLine(esc(tr('opponent_goal')), x.minute)).join('');

  const theirCol = `<div class="scorer-col opponent-scorers" style="text-align:${usHome ? 'right' : 'left'}">${theirLines}</div>`;
  return { html: usHome ? (ourCol + theirCol) : (theirCol + ourCol), hasAny: !!(ourLines || theirLines) };
}

// Factored out so the same live card can render both at the top of the

function renderLiveCard(g, season, players, gamePlayers) {

// Match summary — final score, kickoff time, and the per-goal breakdown

function renderCardEventsStrip(g, players) {

// Large, faded club identity, fixed to the viewport — stays in place

function isGameLive(g, season) {
  if (!g || !g.date) return false;

  // isGameFinished above. A game with neither has no live window at all.
  const kickoff = g.actualKickoffAt ? new Date(g.actualKickoffAt) : (g.gameTime ? new Date(`${g.date}T${g.gameTime}`) : null);
  if (!kickoff || isNaN(kickoff)) return false;
  return new Date() >= kickoff && !isGameFinished(g, season);
}
// Competition split: official = League/Cup (and untyped), friendly =
// Friendly/Trial, tournament = linked to a tournament or typed Tournament.
function gameCategory(g) {
  if (!g) return 'official';
  if (g.tournamentId || g.competitionType === 'Tournament') return 'tournament';
  if (g.competitionType === 'Friendly' || g.competitionType === 'Trial') return 'friendly';
  return 'official';
}
function splitGames(games) {
  const out = { official: [], friendly: [], tournament: [] };
  (games || []).forEach(g => out[gameCategory(g)].push(g));
  return out;
}
// Further splits the 'official' bucket by the actual competitionType
// field — structured data, not name-guessing. An untyped official game
// (no competitionType at all) defaults to league, preserving how it
// was already being treated before this split existed.
function splitOfficialByType(officialGames) {
  const out = { league: [], cup: [] };
  (officialGames || []).forEach(g => out[g.competitionType === 'Cup' ? 'cup' : 'league'].push(g));
  return out;
}

// ── SEASON CALENDAR — chronological merge of fixtures + tournaments +
// confirmed calendar events (Folga/breaks/milestones from data.calendarEvents,
// the RPC already filters out anything not status:'confirmed' and any
// Folga whose date now has a real League fixture on it, so every entry
// here is meant to be shown). COPIED VERBATIM from index.html's admin
// calendar preview (calBuildTimeline/calFmtRange) — this codebase has no
// shared module team.html and index.html both load, so logic that must
// behave identically in both places is duplicated rather than
// centralized. Multi-day events (tournaments, breaks) appear ONCE as a
// range, never once per day — "support multi-week breaks without
// unnecessary duplicate entries" (spec §5). ─────────────────────────────
function calFmtRange(e) {
  return (!e.endDate || e.startDate === e.endDate) ? fmtDate(e.startDate) : `${fmtDate(e.startDate)} → ${fmtDate(e.endDate)}`;
}
// "Novembro 2026" / "November 2026" — a month+year header for the season
// calendar so games/events read as blocks per month instead of one long
// flat list (Victor, 2026-11-01: "group by month... so it's easier to see
// by block"). dateStr is any 'YYYY-MM-...' date; only the year/month are
// used. Intl lowercases PT month names ("novembro de 2026"), so the first
// letter is capitalised for a header.
function calMonthLabel(dateStr) {
  const [y, m] = dateStr.split('-');
  const d = new Date(Number(y), Number(m) - 1, 1);
  const label = d.toLocaleDateString(getLang() === 'pt' ? 'pt-PT' : 'en-GB', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}
// Weekday/day/month-abbrev for the match card's left-hand date column
// ("Sáb / 07 / NOV"), per the mockup. dateStr is 'YYYY-MM-DD'. Built from
// y/m/d parts (not `new Date(dateStr)`) to avoid UTC-vs-local parsing
// drift — same convention calMonthLabel already uses. Intl gives PT a
// trailing period on short weekday/month names ("sáb.", "nov."); stripped
// so the card shows "Sáb"/"NOV" cleanly, matching the mockup.
// Hardcoded short weekday/month labels rather than Intl's
// toLocaleDateString({weekday:'short'}/{month:'short'}) — verified this
// ICU's 'pt-PT' short-weekday data falls back to the FULL name ("sábado",
// not "sáb."), which would overflow the card's fixed-width date column
// and isn't guaranteed consistent across the different browsers/OSes
// parents actually open this page on. Same reasoning as this file's
// existing MONTHS_BY_LANG (full month names) — a fixed lookup table next
// to getLang() is the only reliable way to get a short label every time.
const WEEKDAYS_SHORT_BY_LANG = {
  en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  pt: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
};
const MONTHS_SHORT_BY_LANG = {
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  pt: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
};
function calDayParts(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const lang = getLang();
  const dow = (WEEKDAYS_SHORT_BY_LANG[lang] || WEEKDAYS_SHORT_BY_LANG.en)[dt.getDay()];
  const mon = (MONTHS_SHORT_BY_LANG[lang] || MONTHS_SHORT_BY_LANG.en)[dt.getMonth()];
  return { dow, day: String(d).padStart(2, '0'), mon: mon.toUpperCase() };
}
// Renders a chronologically-sorted list of calendar items grouped into one
// block per month, each under a dark-navy header carrying the month/year
// label and a dynamically-computed event count (Victor, 2026-11-01
// mockup: "Show the number of events in each month" + "Add clear spacing
// between monthly groups"). Items are already in date order
// (calBuildTimeline sorts by sortDate), so bucketing is a single pass —
// start a new group whenever the YYYY-MM changes.
function calRenderByMonth(itemsArr, boxFn) {
  const groups = [];
  (itemsArr || []).forEach(it => {
    const monthKey = it.sortDate.slice(0, 7);
    let g = groups[groups.length - 1];
    if (!g || g.key !== monthKey) {
      g = { key: monthKey, label: calMonthLabel(it.sortDate), items: [] };
      groups.push(g);
    }
    g.items.push(it);
  });
  return groups.map(g => {
    const count = g.items.length;
    const countLabel = `${count} ${plWord(count, 'word_event', 'word_events')}`;
    return `<div class="cal-month-group">
      <div class="cal-month-header"><span>${esc(g.label)}</span><span class="cal-month-count">${esc(countLabel)}</span></div>
      <div class="cal-month-items">${g.items.map(boxFn).join('')}</div>
    </div>`;
  }).join('');
}
function calBuildTimeline(confirmedEvents, games, tournaments) {
  const items = [];
  (games || []).forEach(g => {
    if (!g.date) return;
    // 'game' items carry the raw game object, not a flattened title —
    // the calendar renders these with the same rich row (opponent, time,
    // home/away, venue, directions) as the old standalone "Próximos
    // Jogos" section used, via renderUpcomingMatchRow (spec: Jogos tab UX
    // Improvements §3/§7 — reuse renderUpcomingMatchRow(), don't
    // duplicate its logic).
    items.push({ sortDate: g.date, kind: 'game', game: g });
  });
  (tournaments || []).forEach(t => {
    if (!t.startDate) return;
    items.push({ sortDate: t.startDate, title: t.name || tr('tournament'), rangeLabel: calFmtRange({ startDate: t.startDate, endDate: t.endDate || t.startDate }), kind: 'tournament' });
  });
  // A Folga whose date already falls inside a confirmed break (Pausa de
  // Natal/Páscoa) adds nothing — the break tile already says "no football"
  // for that whole stretch, so a separate Folga on a day it already covers
  // is pure duplication, not a second distinct event (Victor, 2026-11-01:
  // "If a Folga is within a break, it's not a Folga, it's a break").
  const breaks = (confirmedEvents || []).filter(e => e.type === 'break' && e.startDate);
  const isFolgaInsideBreak = e => breaks.some(b => e.startDate >= b.startDate && (e.endDate || e.startDate) <= (b.endDate || b.startDate));
  (confirmedEvents || []).forEach(e => {
    if (!e.startDate) return;
    if (e.type === 'folga' && isFolgaInsideBreak(e)) return;
    // 'folga'/'break' are both "no football this period" markers — styled
    // the same (amber) so parents can tell a pause apart from a fixture
    // at a glance. 'milestone' (season end, etc.) gets its own treatment.
    // eventType is kept (not just the amber 'pause' kind) so the renderer
    // can attach the right disclaimer below: a Folga may still get a
    // friendly arranged on it, a longer break may still have a tournament
    // slotted into it — both need a "wait for the coach's confirmation"
    // note so parents don't read the tile as a guaranteed empty date
    // (Victor, 2026-11-01).
    items.push({ sortDate: e.startDate, title: e.title, rangeLabel: calFmtRange(e), kind: (e.type === 'milestone') ? 'milestone' : 'pause', eventType: e.type });
  });
  items.sort((a, b) => a.sortDate.localeCompare(b.sortDate));
  return items;
}
function toggleSeasonCalendar() {
  const rest = document.getElementById('season-calendar-rest');
  const btn = document.getElementById('season-calendar-toggle');
  if (!rest || !btn) return;
  const opening = rest.style.display === 'none';
  rest.style.display = opening ? '' : 'none';
  btn.textContent = opening ? tr('show_less') : tr('view_full_calendar');
}
function renderSeasonCalendar(games, tournaments, calendarEvents) {
  // games here is the UPCOMING list only (not-yet-played, passed in by the
  // caller) — completed matches live solely in Últimos Resultados now, so
  // the calendar never repeats a result it already showed (spec §2/§3:
  // "Do not duplicate completed matches in the upcoming calendar").
  const items = calBuildTimeline(calendarEvents, games, tournaments);
  if (!items.length) return '';
  // idx is continuous across every 'game' row actually rendered (upcoming
  // list first, then the folded "past" list, matching reading order) —
  // renderUpcomingMatchRow's zebra-stripe only looks right if row 2
  // continues the alternation from row 1 instead of restarting per bucket.
  let gameIdx = 0;
  const box = it => {
    if (it.kind === 'game') return renderUpcomingMatchRow(it.game, gameIdx++);
    const cls = it.kind === 'pause' ? ' cal-pause' : it.kind === 'milestone' ? ' cal-milestone' : '';
    // A Folga might still get a friendly arranged on it, and a longer
    // break (Pausa de Natal/Páscoa) might still have a tournament slotted
    // into it — the tile's own date range never changes to reflect that,
    // so a short note below it tells parents to wait for the coach's
    // confirmation instead of assuming the date is guaranteed free.

    // tiles (season end, etc.) keep their plain title, unchanged, since
    // the spec's icon requirement is specifically "Folgas and holiday
    // periods", not every pause-style tile.
    const icon = it.kind === 'pause' ? '📅 ' : '';

    // folga dates are not the same as the others") — these tiles were
    // still showing the plain DD/MM/YYYY rangeLabel while match cards had
    // already moved to the weekday/day/month-abbrev column, so the two
    // tile types read inconsistently in the same list. Reusing
    // .match-card-date/-dow/-daynum/-mon verbatim guarantees the date
    // actually looks identical, not just similarly formatted.
    // The column anchors to the item's start date; for a genuine
    // multi-day range (a tournament or Pausa de Natal/Páscoa) the full
    // range stays as explicit text below the title so the end date is
    // never lost — a single date column can't represent a span on its
    // own.
    const dp = calDayParts(it.sortDate);
    const isRange = it.rangeLabel && it.rangeLabel.includes('→');

      <div class="match-card-date">
        <div class="match-card-dow">${esc(dp.dow)}</div>
        <div class="match-card-daynum">${esc(dp.day)}</div>
        <div class="match-card-mon">${esc(dp.mon)}</div>
      </div>
      <div class="cal-box-body">
        <div class="cal-box-title">${icon}${esc(it.title)}</div>
        ${isRange ? `<div class="cal-box-meta">${esc(it.rangeLabel)}</div>` : ''}
        ${note ? `<div class="cal-box-meta" style="margin-top:2px">${esc(note)}</div>` : ''}
      </div>
    </div>`;
  };
  // Anchored at today, not at a fixed count: a chronological list starting
  // from the season's first friendly reads as a wall of old fixtures with
  // no sense of "where are we now". Everything from today onward is shown
  // by default; everything before today — already-played matches, past
  // breaks — is still there, just folded away a tap behind "View past
  // events", so the full-season record spec still asked for isn't lost.
  const today = todayLocalDateStr();
  const upcoming = items.filter(it => it.sortDate >= today);
  const past = items.filter(it => it.sortDate < today);
  const hasUpcomingGame = upcoming.some(it => it.kind === 'game');

    <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_calendar_title')}</h2>
    <div class="cal-legend">
      <span class="cal-legend-item is-home"><span aria-hidden="true">🏠</span> ${esc(tr('home'))}</span>
      <span class="cal-legend-item is-away"><span aria-hidden="true">✈️</span> ${esc(tr('away'))}</span>
      <span class="cal-legend-item is-pause"><span aria-hidden="true">📅</span> ${esc(tr('cal_legend_pause'))}</span>
    </div>
    <div class="cal-box-list" id="season-calendar-list">${upcoming.length ? calRenderByMonth(upcoming, box) : `<p class="row-meta" style="padding:4px 0">${tr('cal_no_upcoming')}</p>`}</div>
    ${past.length ? `
    <div class="cal-box-list" id="season-calendar-rest" style="display:none;margin-top:8px">${calRenderByMonth(past, box)}</div>
    <button type="button" id="season-calendar-toggle" class="link-button"
            style="background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0;display:block"
            onclick="toggleSeasonCalendar()">${tr('view_full_calendar')}</button>
    ` : ''}
    ${hasUpcomingGame ? `<p class="row-meta" style="margin-top:8px;font-size:10px;color:var(--muted)">${tr('upcoming_note')}</p>` : ''}
  </div>`;
}
// Pre/in/post-season boundary for friendlies, per the defined rule:

    if (!officialDates.length || !g.date) { out.inSeason.push(g); return; }

}
// No longer a static object — official/friendly/tournament map to the

function categoryLabel(k) {

}
// One row per finished match — factored out so the first-5 and the

// ── DIRECTIONS / NAVIGATION APP CHOOSER ─────────────────────────────────
// A single Google Maps link is stored per opponent/game, usually a
// short maps.app.goo.gl link. That link's real destination can't be
// read from here (cross-origin redirect), so Waze — which has no way to
// resolve a Google Maps link itself — previously got a bare venue-name
// text search instead (`?q=<name>&navigate=yes`). For a venue not well
// indexed in Waze's own places database, that search doesn't resolve to
// an exact point, so Waze opens with no route set.
//
// Two improvements:
// 1. If mapUrl is a FULL (already-expanded) Google Maps URL — not a
//    short link — it often has the coordinates embedded directly
//    (`@lat,lng`, `!3dlat!4dlng`, or `destination=lat,lng`). When found,
//    Waze gets `ll=<lat>,<lng>` instead of a text search — a precise
//    point, not a guess.
// 2. A per-game/opponent `mapAddress` (a precise street address, set
//    once it's known — e.g. resolved from a short link) is used ahead
//    of the bare venue/opponent name for both Waze's and Google Maps'
//    text search, since a full address geocodes far more reliably than
//    a facility name alone.
let _dirTargets = [];
function registerDirectionsTarget(mapUrl, name, address) {
  _dirTargets.push({ mapUrl: mapUrl || null, name: name || '', address: address || '' });
  return _dirTargets.length - 1;
}
function directionsLinkHtml(mapUrl, name, address) {
  if (!mapUrl && !name && !address) return '';
  const idx = registerDirectionsTarget(mapUrl, name, address);
  return `<a href="#" onclick="openDirectionsChooser(${idx});return false;" style="color:var(--black-accent);font-weight:700;text-decoration:none;white-space:nowrap">${esc(tr('get_directions'))} &#8594;</a>`;
}
// Pulls lat/lng out of a FULL Google Maps URL when present. Short links
// (maps.app.goo.gl/...) never match — their path carries no coordinates,
// only an opaque redirect token — so this quietly returns null for them
// and the caller falls back to a text search.
function extractLatLngFromMapUrl(url) {
  if (!url) return null;
  let m = url.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
  if (!m) m = url.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/);
  if (!m) m = url.match(/[?&]destination=(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
  if (!m) return null;
  return { lat: m[1], lng: m[2] };
}
function openDirectionsChooser(idx) {
  const t = _dirTargets[idx];
  if (!t) return;
  const searchText = t.address || t.name;
  const query = searchText ? encodeURIComponent(searchText) : '';
  const latlng = extractLatLngFromMapUrl(t.mapUrl);
  // Google's own documented "universal" maps link
  // (maps.google.com/maps/search/?api=1&query=...) resolves a known
  // address or coordinate pair reliably on web and in the native app
  // alike. A curated mapUrl — especially a short maps.app.goo.gl link —
  // depends on the OS's own app-link handoff instead, which has shown
  // itself unreliable in practice: it can open the Maps app with a
  // garbled, unresolved token in the search box rather than the real
  // place. So a known address/coordinate now wins over the raw link;
  // the link itself is only used when neither is available.
  const googleUrl = latlng
    ? `https://www.google.com/maps/search/?api=1&query=${latlng.lat},${latlng.lng}`
    : (t.address
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.address)}`
        : (t.mapUrl || (query ? `https://www.google.com/maps/search/?api=1&query=${query}` : '')));
  const wazeUrl = latlng
    ? `https://waze.com/ul?ll=${latlng.lat},${latlng.lng}&navigate=yes`
    : (query ? `https://waze.com/ul?q=${query}&navigate=yes` : '');
  if (!googleUrl && !wazeUrl) return;
  // Only one real option (e.g. a name with no plausible Waze match) —
  // skip the chooser and just go straight there.
  if (googleUrl && !wazeUrl) { window.open(googleUrl, '_blank', 'noopener'); return; }
  if (!googleUrl && wazeUrl) { window.open(wazeUrl, '_blank', 'noopener'); return; }
  showDirectionsSheet(googleUrl, wazeUrl);
}
function closeDirectionsSheet() {
  const el = document.getElementById('dirSheet');
  if (el) el.remove();
}
function showDirectionsSheet(googleUrl, wazeUrl) {
  closeDirectionsSheet();
  const wrap = document.createElement('div');
  wrap.id = 'dirSheet';

  const backdrop = document.createElement('div');
  backdrop.className = 'dir-sheet-backdrop';
  backdrop.addEventListener('click', closeDirectionsSheet);
  wrap.appendChild(backdrop);

  const sheet = document.createElement('div');
  sheet.className = 'dir-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');

  const title = document.createElement('div');
  title.className = 'dir-sheet-title';
  title.textContent = tr('choose_nav_app');
  sheet.appendChild(title);

  function addBtn(url, emoji, label) {
    if (!url) return;
    const btn = document.createElement('button');

    btn.className = 'dir-sheet-btn';
    btn.textContent = `${emoji} ${label}`;

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'dir-sheet-btn dir-sheet-cancel';

  document.body.appendChild(wrap);
}

function toggleRecentResults() {

function compTypeTag(type) {
  if (type === 'Friendly') return tr('comp_tag_friendly');
  if (type === 'Trial') return tr('comp_tag_trial');
  if (type === 'Tournament') return tr('tournament');
  if (type === 'Cup') return tr('comp_tag_cup');
  if (type === 'League') return tr('comp_tag_league');
  return '';
}

// One row per game. The same game can arrive more than once (a device
// that re-created a row instead of updating it), and the copies can hold
// different scores, which showed the same match as two live cards. Keep
// the most recently updated copy of each gameUuid, falling back to gameId.
// Visible behaviour is unchanged: same key (gameUuid, or gameId as a
// fallback), same "keep the most recently updated copy" rule. The only
// addition is a console.warn when a discarded copy actually DISAGREES
// with the one kept (different score, date, opponent, etc.) rather than
// being a harmless exact duplicate — that distinction matters, since a
// genuine disagreement is exactly what a future database-level
// regression would look like, and this function was previously silent
// either way. This never changes what a parent sees; it only makes a
// real conflict checkable (via the browser console) instead of invisible.
function dedupeGames(games) {
  const CONFLICT_FIELDS = ['date','gameTime','opponent','homeAway','opponentScore','ownGoalsForUs','competitionType'];
  const best = new Map();
  (games || []).forEach(g => {
    const key = g.gameUuid || ('gid:' + g.gameId);
    const prev = best.get(key);
    if (!prev) { best.set(key, g); return; }
    const newer = new Date(g.updatedAt || 0) > new Date(prev.updatedAt || 0) ? g : prev;
    const older = newer === g ? prev : g;
    const conflict = CONFLICT_FIELDS.some(f => String(older[f] ?? '') !== String(newer[f] ?? ''));
    if (conflict) {
      console.warn('[dedupeGames] duplicate game records disagree with each other — showing the most recently updated one. This may indicate a data-integrity issue.', { key, kept: newer, discarded: older });
    }
    best.set(key, newer);
  });
  return [...best.values()];
}
// One row per person: the public data can carry more than one row for
// the same player, which listed Lorenzo twice in Season Leaders.
// Birthdays and the availability list arrive as their own arrays, so they
// need the same de-duplication as the squad list — a duplicated player row
// otherwise appears two or three times here.
function dedupePlayerRows(rows) {
  const seen = new Set();
  return (rows || []).filter(r => {
    const key = r.careerPlayerId || ('pid:' + r.playerId) || ('n:' + r.fullName);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function dedupePlayers(players) {
  const seen = new Set();
  return (players || []).filter(p => {
    const key = p.careerPlayerId || ('pid:' + p.playerId);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
// Leader names: list up to 3, otherwise say how many are tied.
function leaderNames(names) {
  return names.length > 3 ? tr('players_tied', {n: names.length}) : names.join(', ');
}

// Compact breakdown by competition, shown inside Season Summary so

// League and Cup shown separately (structured competitionType, not

// A row only appears when it actually has finished games — a team

function renderCompetitionBreakdown(split, allGames, gamePlayers) {

// Record card for Friendlies / Tournaments; nothing if none played.

// ══════════════════════════════════════════════════════════════════════════
// PHASE 3 — LIVE REFRESH ENGINE
// ══════════════════════════════════════════════════════════════════════════
let _teamPageToken = null;
let _lastGoodData = null;
let _refreshInFlight = false;
let _pollTimer = null;
let _lastSuccessfulRefresh = null;
// While a game is being played the page refreshes every 15s instead of
// every 60s, so parents watching the live card see goals within seconds of
// them being recorded. render() sets this each time it runs.
let _liveGameOnPage = false;
const POLL_LIVE_MS = 15000;
const POLL_IDLE_MS = 60000;

// ── PWA: "Add to Home Screen" ───────────────────────────────────────────
// Entirely optional for the person reading this page — nothing here
// changes what they see if they never tap it. Two pieces:
//
// 1. A per-family manifest. The static team-manifest.json in <head> is
//    just a fallback (no token, so start_url alone would land on the
//    "No link provided" screen). Once this family's real ?token= is
//    known, swap the manifest for a Blob built with the SAME content but
//    a start_url that carries their token, so installing actually opens
//    their team's data, not an empty error page.
// 2. A service worker that caches only the static app shell (this file,
//    the icons, the manifest) — never Supabase responses. A cached score
//    would be worse than no offline support at all, so every live-data
//    fetch bypasses it entirely (see sw.js).
function setupPwaManifest() {
  try {
    const link = document.getElementById('webAppManifest');
    if (!link) return;
    const manifest = {
      name: 'NextEleven — Parents Page',
      short_name: 'NextEleven',
      description: 'Live team schedule, results and stats for parents — read-only.',
      start_url: window.location.pathname + window.location.search,
      scope: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#F2F4F7',
      theme_color: '#0F1E2E',
      icons: [
        { src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: 'icons/icon-maskable-192.png', sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: 'icons/icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    link.href = URL.createObjectURL(blob);
  } catch (e) { /* not fatal — the page works fine without an install prompt */ }
}
function registerServiceWorker() {
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) { /* not fatal */ }
}

async function loadTeamPage() {
  const contentEl = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  _teamPageToken = params.get('token');

  if (!_teamPageToken) {
    contentEl.innerHTML = `<div class="empty"><div class="icon">🔗</div><strong>${tr('no_link')}</strong><p>${tr('no_link_body')}</p></div>`;
    return;
  }

  setupPwaManifest();
  registerServiceWorker();

  document.documentElement.lang = getLang();
  paintLangSwitch();
  const skip = document.getElementById('skipLink');
  if (skip) skip.textContent = tr('skip');
  await refreshTeamData(true); // true = this is the initial load, allowed to replace the skeleton with an error state if it fails
  startPolling();
  bindVisibilityAndReconnectRefresh();
}

// The actual fetch + render step, reused by initial load, the 60s poll,
// visibility-change, reconnect, and the manual Refresh button — all of
// them funnel through this one function, which guarantees at most one
// request in flight at a time (per the approved spec) and never wipes a
// previously-successful render just because a later background refresh
// failed.
async function refreshTeamData(isInitialLoad) {
  if (_refreshInFlight) return; // never overlap two refreshes
  _refreshInFlight = true;
  const contentEl = document.getElementById('content');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_public_team_data`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ p_token: _teamPageToken }),
    });
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    if (!data) {
      // A genuinely revoked/disabled token — this is a real, permanent
      // state, not a transient failure, so it's correct to replace the
      // page even on a background refresh (per spec: disabled/revoked
      // tokens must show nothing).
      contentEl.innerHTML = `<div class="empty"><div class="icon">🔒</div><strong>${tr('unavailable_title')}</strong><p>${tr('unavailable_body_long')}</p></div>`;
      stopPolling();
      return;
    }

    _lastGoodData = data;
    _lastSuccessfulRefresh = new Date();
    // A background refresh rebuilds the page, which would otherwise throw
    // the reader back to the top mid-scroll — especially noticeable at the
    // 15-second live cadence. Put them back where they were.
    const keepScroll = isInitialLoad ? null : window.scrollY;
    render(contentEl, data);
    if (keepScroll != null) window.scrollTo(0, keepScroll);
    updateFooterRefreshStatus(null);
  } catch (err) {
    if (isInitialLoad && !_lastGoodData) {
      // Only the very first load, with nothing successful yet to fall
      // back on, shows the scary full-page error — every later failure
      // (a background poll, a flaky reconnect) keeps whatever was last
      // successfully shown, per "keep last successful data visible if
      // refresh fails."
      contentEl.innerHTML = `<div class="empty"><div class="icon">⚠️</div><strong>${tr('error_title')}</strong><p>${tr('error_body')}</p></div>`;
    } else {
      updateFooterRefreshStatus(tr('refresh_failed'));
    }
  } finally {
    _refreshInFlight = false;
  }
}

// Self-rescheduling rather than a fixed interval, so the gap can change
// between passes when a game kicks off or ends.
function startPolling() {
  if (_pollTimer) return; // never start twice
  const tick = async () => {
    if (document.visibilityState === 'visible' && navigator.onLine) {
      await refreshTeamData(false);
    }
    if (_pollTimer !== null) {
      _pollTimer = setTimeout(tick, _liveGameOnPage ? POLL_LIVE_MS : POLL_IDLE_MS);
    }
  };
  _pollTimer = setTimeout(tick, _liveGameOnPage ? POLL_LIVE_MS : POLL_IDLE_MS);
}

function stopPolling() {
  if (_pollTimer) { clearTimeout(_pollTimer); _pollTimer = null; }
}

function bindVisibilityAndReconnectRefresh() {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshTeamData(false);
  });
  window.addEventListener('online', () => refreshTeamData(false));
}

// Manual Refresh button handler — always allowed regardless of the
// in-flight guard's timing, since a real user tap should never feel
// ignored; refreshTeamData's own guard still prevents a true overlap if
// one happens to already be running.
function handleManualRefresh() {
  refreshTeamData(false);
}

function updateFooterRefreshStatus(errorMessage) {
  const el = document.getElementById('footerRefreshStatus');
  if (!el) return;
  if (errorMessage) {
    el.textContent = errorMessage;
    return;
  }
  if (_lastSuccessfulRefresh) {
    const hh = String(_lastSuccessfulRefresh.getHours()).padStart(2,'0');
    const mm = String(_lastSuccessfulRefresh.getMinutes()).padStart(2,'0');
    el.textContent = tr('last_updated', {time: `${hh}:${mm}`});
  }
}


function renderSeasonLeaders(players, finishedGames, gamePlayers, guestPlayers) {
  // finishedGames here = official (League & Cup) games only
  players = dedupePlayers(players);
  if (!players.length || !finishedGames.length) return '';

  const pStats = players.map(p => ({
    ...p,
    stats: playerPublicStats(p.playerId, finishedGames, gamePlayers)
  }));
  // Guests counted on exactly the same terms as permanent players, mirroring
  // the admin app's own established precedent (Calc.playerSeasonStats with
  // a tempPlayerId): their goals/assists/starts already count toward the
  // team's season totals regardless (teamGoals doesn't filter to roster-only)
  // — without this they just never showed up on these per-player
  // leaderboards even when they led them (Victor, 2026-11-01: "If we scored
  // 26 why the total of the scorer is not 26?").
  const guestStats = (guestPlayers || []).map(tp => ({
    ...tp, fullName: tp.name,
    stats: playerPublicStats(null, finishedGames, gamePlayers, tp.tempPlayerId)
  }));
  const withStats = [...pStats, ...guestStats];

  function leaderRow(label, statKey) {
    const maxVal = Math.max(...withStats.map(p => p.stats[statKey] || 0));
    if (maxVal === 0) return ''; // hide categories with no meaningful data
    const leaders = withStats.filter(p => (p.stats[statKey] || 0) === maxVal);
    const names = leaderNames(leaders.map(p => shortName(p.fullName)));
    return `<div class="row leader-row">
      <span class="row-name">${label}</span>
      <span class="row-meta">${esc(names)} (${maxVal})</span>
    </div>`;
  }

  const rows = [
    // Ranked by starts, not call-ups — being named in the squad (bench
    // included) isn't "having played"; only starting the match counts
    // towards this leaderboard, matching the main app's own 'started' stat.
    // Label goes through tr('most_apps') — this card previously hardcoded
    // the English string here even in PT mode; the recap view below
    // already used tr() for the same stat, so this just closes that gap.
    leaderRow(tr('most_apps'), 'started'),
    renderRankedStatList(withStats, 'goals', 'goalscorers_label', 'word_goal', 'word_goals'),
    renderRankedStatList(withStats, 'assists', 'assisters_label', 'word_assist', 'word_assists'),
  ].filter(r => r);

  if (!rows.length) return '';

  return `
  <div class="card">
    <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_leaders')}</h2>
    ${rows.join('')}
  </div>`;
}

// Full ranked list for a given stat (goals, assists, …) — not just the
// single leader (Most Starts above still collapses to "who's #1"; a full
// ranking there isn't what parents asked for — goals and assists are the
// stats people actually want to see everyone's tally for). Ties for the
// top spot all get the #1 highlight — a tie for the lead is still the
// lead, not a reason to pick one name over the other.
function renderRankedStatList(withStats, statKey, labelKey, wordSingularKey, wordPluralKey) {
  const ranked = withStats
    .map(p => ({ name: shortName(p.fullName), value: p.stats[statKey] || 0 }))
    .filter(p => p.value > 0)
    .sort((a, b) => b.value - a.value || a.name.localeCompare(b.name));
  if (!ranked.length) return '';
  const topVal = ranked[0].value;
  const rowsHtml = ranked.map(s => {
    const isTop = s.value === topVal;
    return `<div class="row scorer-row${isTop ? ' scorer-row-top' : ''}">
      <span class="row-name">${isTop ? '<span aria-hidden="true">🥇</span> ' : ''}${esc(s.name)}</span>
      <span class="row-meta">${s.value} ${esc(plWord(s.value, wordSingularKey, wordPluralKey))}</span>
    </div>`;
  }).join('');
  return `
    <div class="scorer-group-label">${esc(tr(labelKey))}</div>
    ${rowsHtml}`;
}

const LANG_KEY = 'nexteleven_team_lang';
const LANGS = ['pt', 'en'];
function getLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch (e) { /* private mode — fall through to the default */ }
  return 'pt';
}
function setLang(lang) {
  if (!LANGS.includes(lang)) return;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* not fatal */ }
  document.documentElement.lang = lang;
  paintLangSwitch();
  if (_lastGoodData) {
    const el = document.getElementById('content');
    if (el) render(el, _lastGoodData);
  }
}

function langSwitcherHtml() {
  const cur = getLang();
  return `<div class="lang-switch" role="group" aria-label="${tr('lang_label')}">

  </div>`;
}

function tr(key, vars) {
  const lang = getLang();
  let out = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { out = out.split('{' + k + '}').join(vars[k]); });
  return out;
}

  'forward':'Avançado',
  'goalkeeper':'Guarda-redes',
  'keeper':'Guarda-redes',
  'defender':'Defesa',
};
const POSITION_MODIFIERS_PT = {
  'left':'esquerdo',
  'right':'direito',
  'centre':'central',
  'center':'central',
  'central':'centro',
  'defensive':'defensivo',
  'attacking':'ofensivo',
  'deep':'recuado',
  'wide':'aberto',
  'false':'falso',
  'second':'segundo',
  'inverted':'invertido',
};
function posName(v) {
  if (!v) return '';
  if (getLang() !== 'pt') return v;
  const key = String(v).trim().toLowerCase();
  if (POSITION_PHRASES_PT[key]) return POSITION_PHRASES_PT[key];
  const words = key.split(/\s+/);
  const role = POSITION_ROLES_PT[words[words.length - 1]];
  if (!role) return v; // unknown role — show it as stored rather than guess
  const mods = words.slice(0, -1).map(w => POSITION_MODIFIERS_PT[w]).filter(Boolean);
  if (mods.length !== words.length - 1) return v; // a word we don't know
  return [role, ...mods].join(' ');
}

function monthName(n) { return (MONTHS_BY_LANG[getLang()] || MONTHS_BY_LANG.en)[n]; }
// Deterministic pick from a pool — same (date, key) always picks the
// same index, so a birthday message stays stable across refreshes
// within the day, while different birthdays/players naturally vary.
function stableHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function pickStable(pool, seed) {
  return pool[stableHash(seed) % pool.length];
}
// "João", "João e Miguel", "João, Miguel e Pedro" — language-aware,
// works for any number of names, via the browser's own Intl.ListFormat
// rather than hand-written joining logic.
function formatNameList(names) {
  const lang = getLang();
  try {
    return new Intl.ListFormat(lang === 'en' ? 'en' : 'pt', {style:'long', type:'conjunction'}).format(names);
  } catch (e) {
    // Fallback for an environment without Intl.ListFormat.
    if (names.length <= 1) return names[0] || '';
    return names.slice(0,-1).join(', ') + (lang === 'en' ? ' and ' : ' e ') + names[names.length-1];
  }
}
// Replaces external teamSeasonStats() for the purpose of this page —
// that function depends on gamePlayers (privacy-gated) to compute
// goals, which silently breaks GF/GA whenever show_player_stats is
// off. This computes the same shape (played/wins/draws/losses/
// goalsFor/goalsAgainst/goalDiff) directly from each finished game's
// authoritative ourScore/opponentScore — no snapshot, no separate
// stored result: called fresh against whatever data is current, so a
// later score correction is reflected automatically on the next
// render, same as everything else on this page.
// W/D/L classification still goes through the existing external
// result() helper (which only needs two numbers, not gamePlayers) —
// the same function Current Form and Recent Results already use, so
// this can never disagree with them about what counts as a win.
function computeTeamStats(games) {
  const s = {
    played: 0, wins: 0, draws: 0, losses: 0,
    goalsFor: 0, goalsAgainst: 0,
    homeW: 0, homeD: 0, homeL: 0, awayW: 0, awayD: 0, awayL: 0,
    cleanSheets: 0, failedToScore: 0,
    biggestWin: null, biggestLoss: null,
    bestStreak: 0, bestUnbeaten: 0,
  };
  // Sorted chronologically so streaks are computed in the order the games
  // were actually played, not whatever order the RPC happened to return —
  // same gameSortKey already used everywhere else on this page that needs
  // chronological order (the summary-card window check, upcoming/finished
  // splits, etc.).
  const sorted = [...(games || [])].sort((a, b) => gameSortKey(a) - gameSortKey(b));
  let streak = 0, unbeaten = 0;
  sorted.forEach(g => {
    const our = parseInt(g.ourScore) || 0;
    const their = parseInt(g.opponentScore) || 0;
    const res = result(our, their, g);
    const gd = our - their;

    s.played++;
    s.goalsFor += our;
    s.goalsAgainst += their;

    if (res === 'W') { s.wins++; streak++; unbeaten++; if (streak > s.bestStreak) s.bestStreak = streak; if (unbeaten > s.bestUnbeaten) s.bestUnbeaten = unbeaten; }
    else if (res === 'D') { s.draws++; streak = 0; unbeaten++; if (unbeaten > s.bestUnbeaten) s.bestUnbeaten = unbeaten; }
    else { s.losses++; streak = 0; unbeaten = 0; }

    if (g.homeAway === 'Home') { if (res === 'W') s.homeW++; else if (res === 'D') s.homeD++; else s.homeL++; }
    else if (g.homeAway === 'Away') { if (res === 'W') s.awayW++; else if (res === 'D') s.awayD++; else s.awayL++; }

    if (their === 0) s.cleanSheets++;
    if (our === 0) s.failedToScore++;

    const haScore = homeAwayScore(g.homeAway, our, their, g.neutralSide);
    const haScoreStr = `${haScore.home}-${haScore.away}`;
    if (res === 'W' && (!s.biggestWin || gd > s.biggestWin.gd)) s.biggestWin = { score: haScoreStr, opp: g.opponent, gd };
    if (res === 'L' && (!s.biggestLoss || gd < s.biggestLoss.gd)) s.biggestLoss = { score: haScoreStr, opp: g.opponent, gd };
  });
  s.goalDiff = s.goalsFor - s.goalsAgainst;
  return s;
}

// Linear per-channel interpolation between a pale tint (0%) and the full
// saturated color (100%) — Victor, 2026-10-26: "the closer to 100% the
// stronger the color", so a 10% loss rate reads as barely-there pale red
// and a 90% one reads as a strong, alarming red, rather than every
// non-zero bar showing the same fixed color regardless of how big it is.
function interpolateHexColor(lightHex, strongHex, pct) {
  const t = Math.max(0, Math.min(100, pct)) / 100;
  const toRgb = hex => {
    const h = hex.replace('#', '');
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  };
  const [lr, lg, lb] = toRgb(lightHex);
  const [sr, sg, sb] = toRgb(strongHex);
  const mix = (a, b) => Math.round(a + (b - a) * t);
  return `rgb(${mix(lr, sr)},${mix(lg, sg)},${mix(lb, sb)})`;
}

// One row of the Win/Draw/Loss percentage-bar breakdown — label + count on
// the left, percentage on the right, a proportional colored bar underneath.
// lightHex/strongHex are the pale-tint/full-strength pair for this row's
// color family (green for wins, gray for draws, red for losses — same
// color meaning a parent already learned from Current Form's W/D/L
// badges), interpolated by this row's own percentage, not a fixed shade.
function renderPctBarRow(label, count, total, lightHex, strongHex) {
  const pct = total > 0 ? Math.round(count / total * 100) : 0;
  const fillColor = interpolateHexColor(lightHex, strongHex, pct);
  return `
    <div class="pct-bar-row">
      <div class="pct-bar-head">
        <span class="pct-bar-label">${esc(label)} ${count}</span>
        <span class="pct-bar-pct">${pct}%</span>
      </div>
      <div class="pct-bar-track"><div class="pct-bar-fill" style="width:${pct}%;background:${fillColor}"></div></div>
    </div>`;
}

function fmtBirthday(b) {
  if (!b.birthdayMonth || !b.birthdayDay) return '';
  return b.birthdayDay + ' ' + monthName(b.birthdayMonth - 1);
}

// Pinned above the tabs: only a birthday today (prominent) or one within
// the week (compact). Anything further out lives in the Squad tab.
// ONE consolidated birthday card, used as a single carousel slide —
// replaces the two previous functions (a standalone card plus a
// separate carousel card) that could both render for the same
// birthday at once. There is now exactly one birthday rendering path,
// so the same birthday structurally cannot appear twice.
// A stable per-player short name. esc() applied by the caller where
// used directly in HTML.
function todayLocalDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Whole calendar days between two 'YYYY-MM-DD' dates (b - a), ignoring
// time-of-day. Drives the carousel's dynamic lead-slide choice below —
// game-relative, not a fixed weekday, so it keeps working whatever day a
// given week's match actually falls on (rescheduled games, midweek cup
// ties, bye weeks).
function calendarDaysDiff(dateStrA, dateStrB) {
  const a = new Date(`${dateStrA}T00:00:00`);
  const b = new Date(`${dateStrB}T00:00:00`);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}

// The celebration slide — only ever rendered when one or more
// birthdays fall on the actual current day. Single-player and
// shared-birthday cases use separate message pools (shared pools are
// written for multiple people, not just names inserted into a
// single-player template). Selection is deterministic per day, so a
// refresh never changes the message, but different birthdays and
// different players naturally vary.
function renderHappyBirthdaySlide(todayBirthdays) {
  if (!todayBirthdays.length) return '';
  const lang = getLang();
  const T = STRINGS[lang] || STRINGS.en;
  const todayStr = todayLocalDateStr();

  if (todayBirthdays.length === 1) {
    const b = todayBirthdays[0];
    const pool = T.birthday_msg_pool || STRINGS.en.birthday_msg_pool;
    const template = pickStable(pool, `${todayStr}-${b.playerId}`);
    const message = template.split('{name}').join(esc(shortName(b.fullName)));
    return `
    <div class="card birthday-card" style="text-align:center">
      <div style="font-size:28px" aria-hidden="true">🎂</div>
      <div style="font-size:13px;white-space:pre-line;overflow-wrap:anywhere;margin-top:6px;line-height:1.5">${message}</div>
      <div style="font-size:11px;margin-top:8px" class="birthday-card-sub">${tr('turns_today', {n: b.turningAge})}${b.shirtNumber ? ' · #' + esc(b.shirtNumber) : ''}</div>
    </div>`;
  }

  // Multiple players sharing the day — its own pool, its own seed
  // (sorted player IDs, so the group's identity — and its message
  // selection — correctly changes if who's included changes).
  const sortedIds = todayBirthdays.map(b => b.playerId).sort();
  const pool = T.birthday_msg_pool_shared || STRINGS.en.birthday_msg_pool_shared;
  const template = pickStable(pool, `${todayStr}-${sortedIds.join(',')}`);
  const names = formatNameList(todayBirthdays.map(b => shortName(b.fullName)));
  const opener0 = todayBirthdays.length === 2
    ? (T.birthday_msg_pool_shared_opener0_pair || STRINGS.en.birthday_msg_pool_shared_opener0_pair)
    : (T.birthday_msg_pool_shared_opener0_many || STRINGS.en.birthday_msg_pool_shared_opener0_many);
  const message = template.split('{names}').join(esc(names)).split('{opener0}').join(opener0);
  return `
    <div class="card birthday-card" style="text-align:center">
      <div style="font-size:28px" aria-hidden="true">🎂</div>
      <div style="font-size:13px;white-space:pre-line;overflow-wrap:anywhere;margin-top:6px;line-height:1.5">${message}</div>
    </div>`;
}

// This week (not today) or the next upcoming birthday otherwise —
// the plain informational slide, distinct from the celebration slide

function renderBirthdayInfoSlide(birthdays) {

// Squad tab: the next few birthdays that aren't already pinned above.

  const tournaments = data.tournaments || [];
  const season = data.season || {};
  _liveGameOnPage = false; // the recap view has no live card
  const finishedGames = games.filter(g => isGameFinished(g, season));
  const split = splitGames(finishedGames);

  const stats = computeTeamStats(split.official);
  const withStats = dedupePlayers(players).map(p => ({ ...p, stats: playerPublicStats(p.playerId, split.official, gamePlayers) }));

  function leader(statKey) {
    const maxVal = Math.max(...withStats.map(p => p.stats[statKey] || 0));
    if (maxVal === 0) return null;
    const names = withStats.filter(p => (p.stats[statKey]||0) === maxVal).map(p => shortName(p.fullName));

  el.innerHTML = `

        <div><div class="stat-label">${tr('goal_diff')}</div><div class="stat-value">${stats.goalDiff>0?'+':''}${stats.goalDiff}</div></div>
        <div><div class="stat-label">${tr('goals_for')}</div><div class="stat-value">${stats.goalsFor}</div></div>
        <div><div class="stat-label">${tr('goals_against')}</div><div class="stat-value">${stats.goalsAgainst}</div></div>
