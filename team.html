<style>
  :root{
    --black:#B23333;
    --dark:#333333;
    --muted:#6f6f6f;
    --border:#dddddd;
    --bg:#F2F4F7;
    --surface:#ffffff;
    --radius:3px;
    --green:#2a7a4e;
    --green-bg:#e6f4ea;
    --amber:#7a5f18;
    --amber-bg:#fbf3d9;
    --red:#b03030;
    --red-bg:#fbe9e9;
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;font-family:'Montserrat',Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--dark);margin:0;overscroll-behavior-x:none}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
  .app-header{background:#0F1E2E;display:flex;align-items:center;gap:10px;padding:12px 16px}
  .app-header .brand-mark{width:32px;height:32px;border:1.5px solid var(--black);border-radius:6px;background:linear-gradient(135deg,#0F1E2E,#1a2f45);display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;color:#fff;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
  .app-header .brand-name{font-weight:800;font-size:16px;color:#fff}
  .app-header .brand-name b{color:var(--black)}
  .team-header{margin-bottom:16px}
  .team-header h1{font-size:22px;margin:0 0 2px;font-weight:800}
  .team-header .sub{font-size:13px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
  .card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .stat-value{font-size:20px;font-weight:800;margin-top:2px}
  /* "Boxed" variant — scoped to this modifier rather than every .stat-grid
     (several existing ones sit on a dark background or are loading
     skeletons, where a light tile would look wrong) — tiles with a light
     background and rounded corners, matching the reference screenshot
     Victor shared. box-green highlights the "best of" achievement tiles
     the same way that reference highlighted its best-streak tiles. */
  .stat-grid.boxed > div{background:#f5f6f8;border-radius:8px;padding:10px 8px;text-align:center}
  .stat-grid.boxed > div.box-green{background:var(--green-bg)}
  .stat-grid.boxed .stat-value{font-size:18px}
  .pct-bar-row{margin-bottom:9px}
  .pct-bar-row:last-child{margin-bottom:0}
  .pct-bar-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .pct-bar-head .pct-bar-label{font-weight:700}
  .pct-bar-head .pct-bar-pct{color:var(--muted)}
  .pct-bar-track{height:8px;background:#eceef1;border-radius:4px;overflow:hidden}
  .pct-bar-fill{height:100%;border-radius:4px}
  .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .row-meta{font-size:11px;color:var(--muted);flex-shrink:0}
  .pill{background:#eee;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;flex-shrink:0}
  .badge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;flex-shrink:0}
  .badge-W{background:var(--green-bg);color:var(--green)}
  .badge-D{background:var(--amber-bg);color:var(--amber)}
  .badge-L{background:var(--red-bg);color:var(--red)}
  .score{font-size:13px;font-weight:700;flex-shrink:0}
  .leader-row{align-items:flex-start}
  .leader-row .row-name{flex:0 0 auto;white-space:normal}
  .leader-row .row-meta{flex:1;min-width:0;text-align:right;white-space:normal;overflow-wrap:anywhere}
  .comp-tag{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0}
  .live-card{border-color:var(--black);border-width:2px;padding:22px 18px 20px;text-align:center;box-shadow:0 2px 10px rgba(178,51,51,.18)}
  .live-flag{display:inline-flex;align-items:center;gap:7px;color:#fff;background:var(--black);border-radius:20px;padding:5px 14px;font-weight:800;font-size:12px;letter-spacing:1px}
  .live-flag .dot{width:9px;height:9px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
  .live-fixture{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .live-team{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
  .live-score{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px;flex-shrink:0}
  .live-meta{font-size:12px;color:var(--muted);margin-top:6px}
  .live-scorers{font-size:15px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);line-height:1.8;text-align:left}
  .live-scorers .who{font-weight:700}
  .live-note{font-size:11px;color:var(--muted);margin-top:12px}
  .summary-card{border-color:#0F1E2E;border-width:2px;padding:22px 18px 20px;text-align:center}
  .summary-flag{display:inline-flex;align-items:center;color:#fff;background:#0F1E2E;border-radius:20px;padding:5px 14px;font-weight:800;font-size:12px;letter-spacing:1px}
  .summary-card .live-score{font-size:30px;font-weight:700}
  .summary-card .live-team{font-size:13px;font-weight:700}
  .scorer-cols{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);line-height:1.8;font-size:13px}
  .scorer-col{flex:1;min-width:0}
  .scorer-col .who{font-weight:600}
  .scorer-col.opponent-scorers .who{font-weight:600;color:var(--muted)}
  .live-scorers.opponent-scorers .who{font-weight:700;color:var(--muted)}
  .split-note{font-size:12px;color:var(--muted);margin:0 0 8px}
  .split-line{font-size:11px;color:var(--muted);padding:0 0 9px;margin-top:-4px}
  .outcome-banner{text-align:center;padding:18px 16px}
  .outcome-banner .name{font-weight:700;font-size:14px}
  .outcome-banner .label{font-size:19px;font-weight:800;margin-top:4px}
  .squad-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#eee;font-size:11px;font-weight:700;flex-shrink:0}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty .icon{font-size:32px;margin-bottom:10px}
  .loading{text-align:center;padding:60px 16px;color:var(--muted)}
  /* the wrapper is the flex item in .app-header — it carries the auto
     margin, which is what actually pushes the pair to the far right */
  #langSwitch{margin-left:auto;flex-shrink:0}
  .lang-switch{display:flex;gap:2px;align-items:center}
  .lang-btn{min-width:30px;min-height:30px;padding:0 5px;border:none;background:none;font-family:inherit;font-size:11px;font-weight:600;color:#fff;opacity:.45;cursor:pointer}
  .lang-btn[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:3px}
  .footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:skeleton-shimmer 1.4s ease-in-out infinite;border-radius:4px}
  @keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skeleton-line{height:14px;margin-bottom:8px}
  .skeleton-title{height:22px;width:60%;margin-bottom:4px}
  @media (prefers-reduced-motion: reduce){.skeleton{animation:none;background:#eee}}
  .sticky-header{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;transform:translateY(-100%);transition:transform .2s ease;z-index:100}
  .sticky-header.visible{transform:translateY(0)}
  .sticky-header .name{font-weight:800;font-size:14px}
  .sticky-header .season{font-size:11px;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){.sticky-header{transition:none}}
  .tabs{display:flex;gap:4px;position:sticky;top:0;z-index:900;background:var(--bg,#f2f4f7);padding:8px 0 10px;margin-bottom:4px}
  body.live-bar-on .tabs{top:39px}
  body.sticky-on .tabs{top:44px}
  body.sticky-on.live-bar-on .tabs{top:83px}
  .tab-btn{flex:1;min-width:0;padding:9px 4px;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .tab-btn[aria-selected="true"]{background:var(--black);border-color:var(--black);color:#fff}
  .pane[hidden]{display:none}
  .carousel{position:relative;overflow:hidden}
  .carousel-track{display:flex;align-items:flex-start;transition:transform .3s ease,height .25s ease}
  .carousel-slide{flex:0 0 100%;min-width:100%;box-sizing:border-box}
  .carousel-slide .card{margin-bottom:0}
  .carousel-dots{display:flex;justify-content:center;gap:6px;margin:8px 0 14px}
  .carousel-dot{width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;line-height:0}
  .carousel-dot span{display:block;width:7px;height:7px;margin:0 auto;border-radius:50%;background:var(--border)}
  .carousel-dot[aria-selected="true"] span{background:var(--black)}
  @media (prefers-reduced-motion: reduce){.carousel-track{transition:none}}
  .bday-count{font-size:12px;font-weight:700;color:#7a5f18;margin-top:6px}
  .comp-table{width:100%;border-collapse:collapse;font-size:12px}
  .comp-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:right;padding:3px 0}
  .comp-table th:first-child,.comp-table .comp-name{text-align:left}
  .comp-table td{padding:5px 0;text-align:right;border-top:1px solid var(--border)}
  .comp-table .comp-name{font-weight:700}
  .pane[data-tab="history"] .card{padding:12px 14px}
  .pane[data-tab="history"] .row{padding:6px 0;font-size:12px}
  .live-bar{position:fixed;top:0;left:0;right:0;transform:translateY(-100%);transition:transform .2s ease;z-index:1200;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;border:none;width:100%;font-family:inherit;text-align:center}
  .live-bar .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite;flex-shrink:0}
  .live-bar .bar-label{letter-spacing:1px;font-size:12px}
  .live-bar .bar-score{font-size:16px;font-weight:800;flex-shrink:0}
  .live-bar.visible{transform:translateY(0)}
  body.live-bar-on .sticky-header{top:39px}
  @media (prefers-reduced-motion: reduce){.live-bar{transition:none}}
  @media (prefers-reduced-motion: reduce){.live-bar .dot{animation:none}}
  .live-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;font-weight:700;font-family:inherit;border:none;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;display:flex;align-items:center;gap:8px;cursor:pointer}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .skip-link{position:absolute;top:-40px;left:8px;background:var(--dark);color:#fff;padding:8px 14px;border-radius:4px;z-index:1000;text-decoration:none;font-size:13px;font-weight:700}
  .skip-link:focus{top:8px}
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, [role="button"]:focus-visible {
    outline:3px solid #1a56c4; outline-offset:2px;
  }
  /* No focus outline is ever removed without this visible replacement —
     every interactive element in this file relies on the browser's
     default focus behavior plus this enhanced visible ring, never
     outline:none on its own. */
  .live-banner .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
  @keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){.live-banner .dot{animation:none}}
  /* League Classification — read-only table inside the Team tab (section 11
     of the classification ticket). Horizontally scrollable so every column
     stays reachable on a narrow phone without shrinking text below legible
     size; the own-team row is tinted instead of bordered so it reads clearly
     at small sizes without adding visual noise. */
  .cls-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
  .classification-table{width:100%;border-collapse:collapse;font-size:11px;min-width:460px}
  .classification-table th{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;padding:6px 4px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
  .classification-table th:nth-child(2){text-align:left}
  .classification-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
  .classification-table td:nth-child(2){text-align:left;font-weight:600;white-space:normal}
  .classification-table .cls-pos{font-weight:700;color:var(--muted)}
  .classification-table .cls-pts{font-weight:800}
  .classification-table tr.cls-own td{background:var(--amber-bg)}
  /* Position and Team stay pinned while the rest of the table scrolls
     horizontally, so a name never disappears off-screen on a narrow
     phone. Both columns get a fixed width so the second column's `left`
     offset lines up exactly with the first column's width; the border
     on the second column marks the seam with the scrolling columns. */
  .classification-table th:nth-child(1), .classification-table td:nth-child(1){position:sticky;left:0;z-index:2;width:30px;min-width:30px;max-width:30px}
  .classification-table th:nth-child(2), .classification-table td:nth-child(2){position:sticky;left:30px;z-index:2;width:112px;min-width:112px;max-width:112px;border-right:1px solid var(--border)}
  .cls-meta{font-size:11px;color:var(--muted);margin:0 0 6px}
  .cls-warning{font-size:11px;color:var(--amber);background:var(--amber-bg);padding:7px 10px;border-radius:6px;margin-bottom:8px}
  /* Venue list zebra-striping (parents' "hard to tell rows apart" fix) —
     scoped to .venue-row specifically, never to the plain .row class
     shared by birthdays/unavailable-players/etc elsewhere on this page.
     Horizontal padding applies to every row, striped or not, so the text
     sits the same distance in either way — only the background changes. */
  .venue-row{border-radius:4px;padding:9px 10px}
  .venue-row.venue-row-alt{background:var(--red-bg)}
  /* Directions app-chooser — a small bottom sheet, not a full dialog,
     since there are only ever 2-3 choices (Google Maps, Waze, Cancel). */
  .dir-sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1300}
  .dir-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:1301;box-shadow:0 -4px 20px rgba(0,0,0,.18);max-width:520px;margin:0 auto}
  .dir-sheet-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;text-align:center}
  .dir-sheet-btn{display:block;width:100%;padding:13px;margin-bottom:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:14px;font-weight:700;color:var(--dark);cursor:pointer}
  .dir-sheet-btn:last-child{margin-bottom:0}
  .dir-sheet-cancel{background:var(--bg);color:var(--muted);font-weight:600}
</style>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
// Pre-configured so this page works with zero setup for whoever opens the
// link — same reasoning as the main app's own DEFAULTS: these values are
// meant to be public-facing (Supabase's anon key carries no special
// privileges by itself), and the actual security boundary is entirely
// inside the get_public_team_data RPC and this feature's RLS policy, not
// secrecy of the project URL.
const SUPABASE_URL = 'https://wicydcvdakqopodbxtrl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpY3lkY3ZkYWtxb3BvZGJ4dHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDA5NTUsImV4cCI6MjA5NzE3Njk1NX0._sIaztNAGi9ffuL8qz84G-q_h5TIKTYbyjcnD9VwbE0';

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Mirrors Classification.cleanTeamName() in the admin app (index.html).
// Some sources copy their standings table as plain text with the team
// name effectively doubled — "Palmense Palmense", "SL Olivais SL Olivais
// B" — e.g. a crest/short-code shown next to the full name gets copied
// along with it. This collapses an exact, consecutive repeat of the
// leading phrase; a genuinely distinct name is left untouched. Duplicated
// here (not imported) because team.html is a standalone, dependency-free
// page — applied only at display time, so it also cleans up a snapshot
// that was already published before this fix, without needing a re-import.
function cleanTeamName(name) {
  const s = String(name || '').trim().replace(/\s+/g, ' ');
  const m = s.match(/^(.+?) \1(?: (.+))?$/);
  if (m) return m[2] ? `${m[1]} ${m[2]}` : m[1];
  return s;
}
function fmtDate(d) {
  if (!d) return '—';
  const parts = String(d).split('-');
  if (parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}
// Local HH:MM for an ISO timestamp (actualKickoffAt), matching the
// locale convention already used for the admin app's own kickoff-time
// display (index.html, startGameNow/undoGameStart button).
function fmtTimeHM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString(getLang()==='pt'?'pt-PT':'en-GB', {hour:'2-digit',minute:'2-digit'});
}
function roundLabel(game) {
  return game && game.round ? tr('round_label', { n: game.round }) : '';
}
function shortName(fullName) {
  if (!fullName) return '';
  const parts = String(fullName).trim().split(/\s+/);
  if (parts.length <= 2) return fullName;
  return parts[0] + ' ' + parts[parts.length - 1];
}

// Ordering — date, then kick-off time, everywhere a game list appears on
// this page. public-stats-core.js (loaded above) defines its own
// gameSortKey; this one is declared after it, so it takes over the name
// for every caller, including any sort done internally by that file's own
// stats functions (a plain function name is one shared slot, resolved at
// call time — the later declaration wins regardless of who calls it).
// A round number breaks a genuine tie (two games at the same kick-off,
// e.g. two tournament groups playing simultaneously) so the order is
// always the same rather than depending on whatever order the data
// happened to arrive in.
function gameSortKey(game) {
  if (!game || !game.date) return 0;
  const ms = new Date(`${game.date}T${game.gameTime || '00:00'}`).getTime();
  if (isNaN(ms)) return 0;
  const roundFrac = Number.isFinite(game.round) ? Math.min(game.round, 999) / 1000 : 0;
  return ms + roundFrac; // sub-millisecond nudge — never changes the date/time order, only breaks exact ties
}

// ── SAME RULES AS THE MAIN APP ─────────────────────────────────────────
// Completion: kick-off + match duration + 15 min buffer (the app's
// isGameResultVisible). No kick-off time: counts once the day has ended.
// actualKickoffAt — set in the admin app via the "Game Starting Now"
// button when the real kickoff runs late — is the true start time when
// present, kept in sync with isGameResultVisible/isGameLive in index.html
// by hand (this file shares no module system with that one).
function isGameFinished(g, season) {
  if (!g || !g.date) return false;
  const now = new Date();
  if (!g.gameTime && !g.actualKickoffAt) return now > new Date(`${g.date}T23:59:59`);
  const kickoff = g.actualKickoffAt ? new Date(g.actualKickoffAt) : new Date(`${g.date}T${g.gameTime}`);
  if (isNaN(kickoff)) return false;
  const mins = (parseInt(g.matchDurationMins) || parseInt(season && season.defaultMatchDurationMins) || 90) + 15;

    const endOfDay = new Date(`${g.date}T23:59:59`);
    return now < new Date(endOfDay.getTime() + MATCH_SUMMARY_WINDOW_HOURS * 3600000);

  const kickoff = g.actualKickoffAt ? new Date(g.actualKickoffAt) : new Date(`${g.date}T${g.gameTime}`);

// Competition split: official = League/Cup (and untyped), friendly =

// ── DIRECTIONS / NAVIGATION APP CHOOSER ─────────────────────────────────
// A single Google Maps link is stored per opponent/game, usually a
// short maps.app.goo.gl link. That link's real destination can't be
// read from here (cross-origin redirect), so Waze — which has no way to
// resolve a Google Maps link itself — previously got a bare venue-name

//    Waze gets `ll=<lat>,<lng>` instead of a text search — a precise
//    point, not a guess.
// 2. A per-game/opponent `mapAddress` (a precise street address, set
//    once it's known — e.g. resolved from a short link) is used ahead

// Pulls lat/lng out of a FULL Google Maps URL when present. Short links

// One row per game. The same game can arrive more than once (a device
// that re-created a row instead of updating it), and the copies can hold
// different scores, which showed the same match as two live cards. Keep
// the most recently updated copy of each gameUuid, falling back to gameId.
// Visible behaviour is unchanged: same key (gameUuid, or gameId as a
// fallback), same "keep the most recently updated copy" rule. The only
// addition is a console.warn when a discarded copy actually DISAGREES
// with the one kept (different score, date, opponent, etc.) rather than
// being a harmless exact duplicate — that distinction matters, since a
// genuine disagreement is exactly what a future database-level
// regression would look like, and this function was previously silent
// either way. This never changes what a parent sees; it only makes a
// real conflict checkable (via the browser console) instead of invisible.
function dedupeGames(games) {
  const CONFLICT_FIELDS = ['date','gameTime','opponent','homeAway','opponentScore','ownGoalsForUs','competitionType'];
  const best = new Map();
  (games || []).forEach(g => {
    const key = g.gameUuid || ('gid:' + g.gameId);
    const prev = best.get(key);
    if (!prev) { best.set(key, g); return; }
    const newer = new Date(g.updatedAt || 0) > new Date(prev.updatedAt || 0) ? g : prev;
    const older = newer === g ? prev : g;
    const conflict = CONFLICT_FIELDS.some(f => String(older[f] ?? '') !== String(newer[f] ?? ''));
    if (conflict) {
      console.warn('[dedupeGames] duplicate game records disagree with each other — showing the most recently updated one. This may indicate a data-integrity issue.', { key, kept: newer, discarded: older });
    }
    best.set(key, newer);
  });
  return [...best.values()];
}

  const seen = new Set();
  return (rows || []).filter(r => {
    const key = r.careerPlayerId || ('pid:' + r.playerId) || ('n:' + r.fullName);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

function dedupePlayers(players) {
  const seen = new Set();
  return (players || []).filter(p => {
    const key = p.careerPlayerId || ('pid:' + p.playerId);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
// Leader names: list up to 3, otherwise say how many are tied.
function leaderNames(names) {
  return names.length > 3 ? tr('players_tied', {n: names.length}) : names.join(', ');
}

// Compact breakdown by competition, shown inside Season Summary so
// friendlies and tournaments no longer need cards of their own. A row
// appears only for a competition that has actually been played.
// League and Cup shown separately (structured competitionType, not
// name-guessing); Friendlies further split into Pre/In/Post-season.
// A row only appears when it actually has finished games — a team
// that's never played a Cup fixture gets no empty Cup row, keeping
// this compact rather than padding every season with blank rows.
function renderCompetitionBreakdown(split, allGames, gamePlayers) {
  const officialByType = splitOfficialByType(split.official);
  const friendliesByPhase = splitFriendliesByPhase(split.friendly, allGames);
  const rows = [
    [tr('league'), officialByType.league],
    [tr('cup'), officialByType.cup],
    [tr('pre_season_friendlies'), friendliesByPhase.preSeason],
    [tr('in_season_friendlies'), friendliesByPhase.inSeason],
    [tr('post_season_friendlies'), friendliesByPhase.postSeason],
    [tr('tournaments'), split.tournament],
  ].filter(([, list]) => list.length);
  if (!rows.length) return '';
  return `
  <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
    <div class="stat-label" style="margin-bottom:6px">${tr('by_competition')}</div>
    <table class="comp-table">
      <thead><tr><th>&nbsp;</th><th>P</th><th>W-D-L</th><th>GF-GA</th></tr></thead>
      <tbody>
        ${rows.map(([label, list]) => {
          const t = computeTeamStats(list);
          return `<tr>
            <td class="comp-name">${label}</td>
            <td>${t.played}</td>
            <td>${t.wins}${tr('w_short')}-${t.draws}${tr('d_short')}-${t.losses}${tr('l_short')}</td>
            <td>${t.goalsFor}-${t.goalsAgainst}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

// Record card for Friendlies / Tournaments; nothing if none played.
function renderRecordCard(title, list, gamePlayers) {
  if (!list.length) return '';
  const t = computeTeamStats(list);
  return `
  <div class="card">
    <h2 class="card-title" style="margin-top:0;font-size:11px">${title}</h2>
    <div class="stat-grid">
      <div><div class="stat-label">${tr('record')}</div><div class="stat-value">${t.wins}${tr('w_short')}-${t.draws}${tr('d_short')}-${t.losses}${tr('l_short')}</div></div>
      <div><div class="stat-label">${tr('goal_diff')}</div><div class="stat-value">${t.goalDiff>0?'+':''}${t.goalDiff}</div></div>
      <div><div class="stat-label">${tr('goals_for')}</div><div class="stat-value">${t.goalsFor}</div></div>
      <div><div class="stat-label">${tr('goals_against')}</div><div class="stat-value">${t.goalsAgainst}</div></div>
    </div>

}

// PHASE 3 — LIVE REFRESH ENGINE
// ══════════════════════════════════════════════════════════════════════════
let _teamPageToken = null;
let _lastGoodData = null;
let _refreshInFlight = false;
let _pollTimer = null;
let _lastSuccessfulRefresh = null;
// While a game is being played the page refreshes every 15s instead of
// every 60s, so parents watching the live card see goals within seconds of
// them being recorded. render() sets this each time it runs.
let _liveGameOnPage = false;
const POLL_LIVE_MS = 15000;
const POLL_IDLE_MS = 60000;

// ── PWA: "Add to Home Screen" ───────────────────────────────────────────
// Entirely optional for the person reading this page — nothing here
// changes what they see if they never tap it. Two pieces:
//
// 1. A per-family manifest. The static team-manifest.json in <head> is
//    just a fallback (no token, so start_url alone would land on the
//    "No link provided" screen). Once this family's real ?token= is
//    known, swap the manifest for a Blob built with the SAME content but
//    a start_url that carries their token, so installing actually opens
//    their team's data, not an empty error page.
// 2. A service worker that caches only the static app shell (this file,
//    the icons, the manifest) — never Supabase responses. A cached score
//    would be worse than no offline support at all, so every live-data
//    fetch bypasses it entirely (see sw.js).
function setupPwaManifest() {
  try {
    const link = document.getElementById('webAppManifest');
    if (!link) return;
    const manifest = {
      name: 'NextEleven — Parents Page',
      short_name: 'NextEleven',
      description: 'Live team schedule, results and stats for parents — read-only.',
      start_url: window.location.pathname + window.location.search,
      scope: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#F2F4F7',
      theme_color: '#0F1E2E',
      icons: [
        { src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: 'icons/icon-maskable-192.png', sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: 'icons/icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    link.href = URL.createObjectURL(blob);
  } catch (e) { /* not fatal — the page works fine without an install prompt */ }
}
function registerServiceWorker() {
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) { /* not fatal */ }
}

async function loadTeamPage() {
  const contentEl = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  _teamPageToken = params.get('token');

  if (!_teamPageToken) {
    contentEl.innerHTML = `<div class="empty"><div class="icon">🔗</div><strong>${tr('no_link')}</strong><p>${tr('no_link_body')}</p></div>`;
    return;
  }

  setupPwaManifest();
  registerServiceWorker();

  document.documentElement.lang = getLang();
  paintLangSwitch();
  const skip = document.getElementById('skipLink');
  if (skip) skip.textContent = tr('skip');
  await refreshTeamData(true); // true = this is the initial load, allowed to replace the skeleton with an error state if it fails
  startPolling();
  bindVisibilityAndReconnectRefresh();
}

// The actual fetch + render step, reused by initial load, the 60s poll,
// visibility-change, reconnect, and the manual Refresh button — all of
// them funnel through this one function, which guarantees at most one
// request in flight at a time (per the approved spec) and never wipes a
// previously-successful render just because a later background refresh
// failed.
async function refreshTeamData(isInitialLoad) {
  if (_refreshInFlight) return; // never overlap two refreshes
  _refreshInFlight = true;
  const contentEl = document.getElementById('content');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_public_team_data`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ p_token: _teamPageToken }),
    });
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    if (!data) {
      // A genuinely revoked/disabled token — this is a real, permanent
      // state, not a transient failure, so it's correct to replace the
      // page even on a background refresh (per spec: disabled/revoked
      // tokens must show nothing).
      contentEl.innerHTML = `<div class="empty"><div class="icon">🔒</div><strong>${tr('unavailable_title')}</strong><p>${tr('unavailable_body_long')}</p></div>`;
      stopPolling();
      return;
    }

    _lastGoodData = data;
    _lastSuccessfulRefresh = new Date();
    // A background refresh rebuilds the page, which would otherwise throw
    // the reader back to the top mid-scroll — especially noticeable at the
    // 15-second live cadence. Put them back where they were.
    const keepScroll = isInitialLoad ? null : window.scrollY;
    render(contentEl, data);
    if (keepScroll != null) window.scrollTo(0, keepScroll);
    updateFooterRefreshStatus(null);
  } catch (err) {
    if (isInitialLoad && !_lastGoodData) {
      // Only the very first load, with nothing successful yet to fall
      // back on, shows the scary full-page error — every later failure
      // (a background poll, a flaky reconnect) keeps whatever was last
      // successfully shown, per "keep last successful data visible if
      // refresh fails."
      contentEl.innerHTML = `<div class="empty"><div class="icon">⚠️</div><strong>${tr('error_title')}</strong><p>${tr('error_body')}</p></div>`;
    } else {
      updateFooterRefreshStatus(tr('refresh_failed'));
    }
  } finally {
    _refreshInFlight = false;
  }
}

// Self-rescheduling rather than a fixed interval, so the gap can change
// between passes when a game kicks off or ends.
function startPolling() {
  if (_pollTimer) return; // never start twice
  const tick = async () => {
    if (document.visibilityState === 'visible' && navigator.onLine) {
      await refreshTeamData(false);
    }
    if (_pollTimer !== null) {
      _pollTimer = setTimeout(tick, _liveGameOnPage ? POLL_LIVE_MS : POLL_IDLE_MS);
    }
  };
  _pollTimer = setTimeout(tick, _liveGameOnPage ? POLL_LIVE_MS : POLL_IDLE_MS);
}

function stopPolling() {
  if (_pollTimer) { clearTimeout(_pollTimer); _pollTimer = null; }
}

function bindVisibilityAndReconnectRefresh() {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshTeamData(false);
  });
  window.addEventListener('online', () => refreshTeamData(false));
}

// Manual Refresh button handler — always allowed regardless of the
// in-flight guard's timing, since a real user tap should never feel
// ignored; refreshTeamData's own guard still prevents a true overlap if
// one happens to already be running.
function handleManualRefresh() {
  refreshTeamData(false);
}

function updateFooterRefreshStatus(errorMessage) {
  const el = document.getElementById('footerRefreshStatus');
  if (!el) return;
  if (errorMessage) {
    el.textContent = errorMessage;
    return;
  }
  if (_lastSuccessfulRefresh) {
    const hh = String(_lastSuccessfulRefresh.getHours()).padStart(2,'0');
    const mm = String(_lastSuccessfulRefresh.getMinutes()).padStart(2,'0');
    el.textContent = tr('last_updated', {time: `${hh}:${mm}`});
  }
}


function renderSeasonLeaders(players, finishedGames, gamePlayers) {
  // finishedGames here = official (League & Cup) games only
  players = dedupePlayers(players);
  if (!players.length || !finishedGames.length) return '';

  const withStats = players.map(p => ({
    ...p,
    stats: playerPublicStats(p.playerId, finishedGames, gamePlayers)
  }));

  function leaderRow(label, statKey) {
    const maxVal = Math.max(...withStats.map(p => p.stats[statKey] || 0));
    if (maxVal === 0) return ''; // hide categories with no meaningful data
    const leaders = withStats.filter(p => (p.stats[statKey] || 0) === maxVal);
    const names = leaderNames(leaders.map(p => shortName(p.fullName)));
    return `<div class="row leader-row">
      <span class="row-name">${label}</span>
      <span class="row-meta">${esc(names)} (${maxVal})</span>
    </div>`;
  }

  const rows = [
    // Ranked by starts, not call-ups — being named in the squad (bench
    // included) isn't "having played"; only starting the match counts
    // towards this leaderboard, matching the main app's own 'started' stat.
    // Label goes through tr('most_apps') — this card previously hardcoded
    // the English string here even in PT mode; the recap view below
    // already used tr() for the same stat, so this just closes that gap.
    leaderRow(tr('most_apps'), 'started'),
    leaderRow('Top Scorer', 'goals'),
    leaderRow('Most Assists', 'assists'),
  ].filter(r => r);

  if (!rows.length) return '';

  return `
  <div class="card">
    <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_leaders')}</h2>
    ${rows.join('')}
  </div>`;
}

// ── LANGUAGE ────────────────────────────────────────────────────────────
// Each reader picks their own; the choice is remembered in this browser.
// Portuguese is the default, since most parents read Portuguese.
const LANG_KEY = 'nexteleven_team_lang';
const LANGS = ['pt', 'en'];
function getLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch (e) { /* private mode — fall through to the default */ }
  return 'pt';
}
function setLang(lang) {
  if (!LANGS.includes(lang)) return;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* not fatal */ }
  document.documentElement.lang = lang;
  paintLangSwitch();
  if (_lastGoodData) {
    const el = document.getElementById('content');
    if (el) render(el, _lastGoodData);
  }
}

// Language switcher — shown on every view, in the footer.
// The switcher lives in the top banner, outside the content area, so it
// survives every re-render and is there on the error and empty states too.
function paintLangSwitch() {
  const host = document.getElementById('langSwitch');
  if (host) host.innerHTML = langSwitcherHtml();
}

function langSwitcherHtml() {
  const cur = getLang();
  return `<div class="lang-switch" role="group" aria-label="${tr('lang_label')}">
    ${LANGS.map(l => `<button type="button" class="lang-btn" aria-pressed="${l === cur ? 'true' : 'false'}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}
  </div>`;
}

function tr(key, vars) {
  const lang = getLang();
  let out = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { out = out.split('{' + k + '}').join(vars[k]); });
  return out;
}
const MONTHS_BY_LANG = {
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
  pt: ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],
};
// Positions are stored in English. Rather than a fixed list of ten, this
// translates by structure: the last word is the role, the words before it
// describe it. A position added to the app later — "Attacking Winger",
// "Deep Midfielder" — therefore translates on its own, with no change
// needed here. Known phrases that don't follow the pattern are listed
// first; anything still unrecognised is shown exactly as stored.
const POSITION_PHRASES_PT = {
  'goalkeeper':'Guarda-redes',
  'centre back':'Defesa central',
  'center back':'Defesa central',
  'sweeper':'Líbero',
  'striker':'Avançado',
  'forward':'Avançado',
};
const POSITION_ROLES_PT = {
  'back':'Lateral',
  'midfielder':'Médio',
  'winger':'Extremo',
  'wingback':'Ala',
  'striker':'Avançado',
  'forward':'Avançado',
  'goalkeeper':'Guarda-redes',
  'keeper':'Guarda-redes',
  'defender':'Defesa',
};
const POSITION_MODIFIERS_PT = {
  'left':'esquerdo',
  'right':'direito',
  'centre':'central',
  'center':'central',
  'central':'centro',
  'defensive':'defensivo',
  'attacking':'ofensivo',
  'deep':'recuado',
  'wide':'aberto',
  'false':'falso',
  'second':'segundo',
  'inverted':'invertido',
};
function posName(v) {
  if (!v) return '';
  if (getLang() !== 'pt') return v;
  const key = String(v).trim().toLowerCase();
  if (POSITION_PHRASES_PT[key]) return POSITION_PHRASES_PT[key];
  const words = key.split(/\s+/);
  const role = POSITION_ROLES_PT[words[words.length - 1]];
  if (!role) return v; // unknown role — show it as stored rather than guess
  const mods = words.slice(0, -1).map(w => POSITION_MODIFIERS_PT[w]).filter(Boolean);
  if (mods.length !== words.length - 1) return v; // a word we don't know
  return [role, ...mods].join(' ');
}

function monthName(n) { return (MONTHS_BY_LANG[getLang()] || MONTHS_BY_LANG.en)[n]; }
// Deterministic pick from a pool — same (date, key) always picks the
// same index, so a birthday message stays stable across refreshes
// within the day, while different birthdays/players naturally vary.
function stableHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function pickStable(pool, seed) {
  return pool[stableHash(seed) % pool.length];
}
// "João", "João e Miguel", "João, Miguel e Pedro" — language-aware,
// works for any number of names, via the browser's own Intl.ListFormat
// rather than hand-written joining logic.
function formatNameList(names) {
  const lang = getLang();
  try {
    return new Intl.ListFormat(lang === 'en' ? 'en' : 'pt', {style:'long', type:'conjunction'}).format(names);
  } catch (e) {
    // Fallback for an environment without Intl.ListFormat.
    if (names.length <= 1) return names[0] || '';
    return names.slice(0,-1).join(', ') + (lang === 'en' ? ' and ' : ' e ') + names[names.length-1];
  }
}
// Replaces external teamSeasonStats() for the purpose of this page —
// that function depends on gamePlayers (privacy-gated) to compute
// goals, which silently breaks GF/GA whenever show_player_stats is
// off. This computes the same shape (played/wins/draws/losses/
// goalsFor/goalsAgainst/goalDiff) directly from each finished game's
// authoritative ourScore/opponentScore — no snapshot, no separate
// stored result: called fresh against whatever data is current, so a
// later score correction is reflected automatically on the next
// render, same as everything else on this page.
// W/D/L classification still goes through the existing external
// result() helper (which only needs two numbers, not gamePlayers) —
// the same function Current Form and Recent Results already use, so
// this can never disagree with them about what counts as a win.
function computeTeamStats(games) {
  const s = {
    played: 0, wins: 0, draws: 0, losses: 0,
    goalsFor: 0, goalsAgainst: 0,
    homeW: 0, homeD: 0, homeL: 0, awayW: 0, awayD: 0, awayL: 0,
    cleanSheets: 0, failedToScore: 0,
    biggestWin: null, biggestLoss: null,
    bestStreak: 0, bestUnbeaten: 0,
  };
  // Sorted chronologically so streaks are computed in the order the games
  // were actually played, not whatever order the RPC happened to return —
  // same gameSortKey already used everywhere else on this page that needs
  // chronological order (the summary-card window check, upcoming/finished
  // splits, etc.).
  const sorted = [...(games || [])].sort((a, b) => gameSortKey(a) - gameSortKey(b));
  let streak = 0, unbeaten = 0;
  sorted.forEach(g => {
    const our = parseInt(g.ourScore) || 0;
    const their = parseInt(g.opponentScore) || 0;
    const res = result(our, their, g);
    const gd = our - their;

    s.played++;
    s.goalsFor += our;
    s.goalsAgainst += their;

    if (res === 'W') { s.wins++; streak++; unbeaten++; if (streak > s.bestStreak) s.bestStreak = streak; if (unbeaten > s.bestUnbeaten) s.bestUnbeaten = unbeaten; }
    else if (res === 'D') { s.draws++; streak = 0; unbeaten++; if (unbeaten > s.bestUnbeaten) s.bestUnbeaten = unbeaten; }
    else { s.losses++; streak = 0; unbeaten = 0; }

    if (g.homeAway === 'Home') { if (res === 'W') s.homeW++; else if (res === 'D') s.homeD++; else s.homeL++; }
    else if (g.homeAway === 'Away') { if (res === 'W') s.awayW++; else if (res === 'D') s.awayD++; else s.awayL++; }

    if (their === 0) s.cleanSheets++;
    if (our === 0) s.failedToScore++;

    const haScore = homeAwayScore(g.homeAway, our, their, g.neutralSide);
    const haScoreStr = `${haScore.home}-${haScore.away}`;
    if (res === 'W' && (!s.biggestWin || gd > s.biggestWin.gd)) s.biggestWin = { score: haScoreStr, opp: g.opponent, gd };
    if (res === 'L' && (!s.biggestLoss || gd < s.biggestLoss.gd)) s.biggestLoss = { score: haScoreStr, opp: g.opponent, gd };
  });
  s.goalDiff = s.goalsFor - s.goalsAgainst;
  return s;
}

// One row of the Win/Draw/Loss percentage-bar breakdown — label + count on
// the left, percentage on the right, a proportional colored bar underneath.
// colorVar is one of the existing --green/--amber/--red tokens already used
// for the W/D/L result badges elsewhere on this page, so the bars read with
// the same color meaning a parent already learned from Current Form.
function renderPctBarRow(label, count, total, colorVar) {
  const pct = total > 0 ? Math.round(count / total * 100) : 0;
  return `
    <div class="pct-bar-row">
      <div class="pct-bar-head">
        <span class="pct-bar-label">${esc(label)} ${count}</span>
        <span class="pct-bar-pct">${pct}%</span>
      </div>
      <div class="pct-bar-track"><div class="pct-bar-fill" style="width:${pct}%;background:var(${colorVar})"></div></div>
    </div>`;
}

function fmtBirthday(b) {
  if (!b.birthdayMonth || !b.birthdayDay) return '';
  return b.birthdayDay + ' ' + monthName(b.birthdayMonth - 1);
}

// Pinned above the tabs: only a birthday today (prominent) or one within
// the week (compact). Anything further out lives in the Squad tab.
// ONE consolidated birthday card, used as a single carousel slide —
// replaces the two previous functions (a standalone card plus a
// separate carousel card) that could both render for the same
// birthday at once. There is now exactly one birthday rendering path,
// so the same birthday structurally cannot appear twice.
// A stable per-player short name. esc() applied by the caller where
// used directly in HTML.
function todayLocalDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// The celebration slide — only ever rendered when one or more
// birthdays fall on the actual current day. Single-player and
// shared-birthday cases use separate message pools (shared pools are
// written for multiple people, not just names inserted into a
// single-player template). Selection is deterministic per day, so a
// refresh never changes the message, but different birthdays and
// different players naturally vary.
function renderHappyBirthdaySlide(todayBirthdays) {
  if (!todayBirthdays.length) return '';
  const lang = getLang();
  const T = STRINGS[lang] || STRINGS.en;
  const todayStr = todayLocalDateStr();

  if (todayBirthdays.length === 1) {
    const b = todayBirthdays[0];
    const pool = T.birthday_msg_pool || STRINGS.en.birthday_msg_pool;
    const template = pickStable(pool, `${todayStr}-${b.playerId}`);
    const message = template.split('{name}').join(esc(shortName(b.fullName)));
    return `
    <div class="card" style="background:#fef6e0;border-color:#f0d98a;text-align:center">
      <div style="font-size:28px" aria-hidden="true">🎂</div>
      <div style="font-size:13px;white-space:pre-line;overflow-wrap:anywhere;margin-top:6px;line-height:1.5">${message}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">${tr('turns_today', {n: b.turningAge})}${b.shirtNumber ? ' · #' + esc(b.shirtNumber) : ''}</div>
    </div>`;
  }

  // Multiple players sharing the day — its own pool, its own seed
  // (sorted player IDs, so the group's identity — and its message
  // selection — correctly changes if who's included changes).
  const sortedIds = todayBirthdays.map(b => b.playerId).sort();
  const pool = T.birthday_msg_pool_shared || STRINGS.en.birthday_msg_pool_shared;
  const template = pickStable(pool, `${todayStr}-${sortedIds.join(',')}`);
  const names = formatNameList(todayBirthdays.map(b => shortName(b.fullName)));
  const opener0 = todayBirthdays.length === 2
    ? (T.birthday_msg_pool_shared_opener0_pair || STRINGS.en.birthday_msg_pool_shared_opener0_pair)
    : (T.birthday_msg_pool_shared_opener0_many || STRINGS.en.birthday_msg_pool_shared_opener0_many);
  const message = template.split('{names}').join(esc(names)).split('{opener0}').join(opener0);
  return `
    <div class="card" style="background:#fef6e0;border-color:#f0d98a;text-align:center">
      <div style="font-size:28px" aria-hidden="true">🎂</div>
      <div style="font-size:13px;white-space:pre-line;overflow-wrap:anywhere;margin-top:6px;line-height:1.5">${message}</div>
    </div>`;
}

// This week (not today) or the next upcoming birthday otherwise —
// the plain informational slide, distinct from the celebration slide
// above so a given birthday is only ever in ONE of the two states.
function renderBirthdayInfoSlide(birthdays) {
  const list = (birthdays || []).filter(b => !b.isToday);
  if (!list.length) return '';

  const thisWeekBirthdays = list.filter(b => b.isThisWeek);

  // This week — BIRTHDAY THIS WEEK, listing everyone who qualifies
  // rather than picking just one.
  if (thisWeekBirthdays.length) {
    return `
    <div class="card" style="background:#fef6e0;border-color:#f0d98a">
      <h2 class="card-title" style="color:#7a5f18;margin-top:0;font-size:11px"><span aria-hidden="true">🎂</span> ${thisWeekBirthdays.length>1 ? tr('birthdays_this_week_pl') : tr('birthdays_this_week')}</h2>
      ${thisWeekBirthdays.map(b => `<div class="row">
        <span class="row-name">${esc(shortName(b.fullName))}${b.shirtNumber ? ' · #' + esc(b.shirtNumber) : ''}</span>
        <span class="row-meta">${fmtBirthday(b)} · ${tr('turning', {n: b.turningAge})} · ${b.daysUntil === 1 ? tr('tomorrow_low') : tr('in_days_low', {n: b.daysUntil})}</span>
      </div>`).join('')}
    </div>`;
  }

  // Nothing imminent — fall back to the single soonest birthday,
  // labeled NEXT BIRTHDAY rather than BIRTHDAY THIS WEEK.
  const b = list[0];
  const name = esc(shortName(b.fullName));
  const num = b.shirtNumber ? ' · #' + esc(b.shirtNumber) : '';
  const when = b.daysUntil === 1 ? tr('tomorrow') : tr('in_days', {n: b.daysUntil});
  return `
  <div class="card" style="background:#fef6e0;border-color:#f0d98a">
    <h2 class="card-title" style="color:#7a5f18;margin-top:0;font-size:11px"><span aria-hidden="true">🎂</span> ${tr('next_birthday')}</h2>
    <div style="font-weight:700;font-size:15px">${name}${num}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:3px">${fmtBirthday(b)} · ${tr('turning', {n: b.turningAge})}</div>
    <div class="bday-count">${when}</div>
  </div>`;
}

// Squad tab: the next few birthdays that aren't already pinned above.
function renderUpcomingBirthdays(birthdays) {
  const upcoming = (birthdays || []).filter(b => !b.isToday && !b.isThisWeek).slice(0, 3);
  if (!upcoming.length) return '';
  return `
  <div class="card">
    <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('upcoming_birthdays')}</h2>
    ${upcoming.map(b => `<div class="row">
