    </div>`).join('')}
  </div>`;
}

function renderRecap(el, data) {
  const games = dedupeGames(data.games || []);
  const gamePlayers = data.gamePlayers || [];
  const players = dedupePlayers(data.players || []);
  const tournaments = data.tournaments || [];
  const season = data.season || {};
  _liveGameOnPage = false; // the recap view has no live card
  const finishedGames = games.filter(g => isGameFinished(g, season));
  const split = splitGames(finishedGames);

  const stats = computeTeamStats(split.official);
  const withStats = dedupePlayers(players).map(p => ({ ...p, stats: playerPublicStats(p.playerId, split.official, gamePlayers) }));

  function leader(statKey) {
    const maxVal = Math.max(...withStats.map(p => p.stats[statKey] || 0));
    if (maxVal === 0) return null;
    const names = withStats.filter(p => (p.stats[statKey]||0) === maxVal).map(p => shortName(p.fullName));
    return { names, value: maxVal };
  }
  const topScorer = leader('goals');
  const topAssists = leader('assists');
  // Starts, not call-ups — same rule as renderSeasonLeaders() above.
  const mostApps = leader('started');

  const backUrl = window.location.pathname + window.location.search.replace(/&?view=recap/, '');

  el.innerHTML = `
    <div class="team-header" style="position:relative;overflow:hidden">
      ${renderClubLogo(season)}
      <div style="position:relative;z-index:1">
        <h1 style="margin:0">${esc(season.clubName || 'Team')} ${season.ageGroup ? '· ' + esc(season.ageGroup) : ''}</h1>
        <div class="sub" style="margin-top:2px">${esc(season.seasonName || '')} Season Recap</div>
      </div>
    </div>

    ${data.seasonStory ? `
    <div class="card" style="background:#1a1a2e;color:#fff">
      <p style="font-size:14px;line-height:1.6;margin:0">${esc(data.seasonStory)}</p>
    </div>` : ''}

    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('final_record')}</h2>
      <div class="stat-grid">
        <div><div class="stat-label">${tr('record')}</div><div class="stat-value">${stats.wins}${tr('w_short')}-${stats.draws}${tr('d_short')}-${stats.losses}${tr('l_short')}</div></div>
        <div><div class="stat-label">${tr('goal_diff')}</div><div class="stat-value">${stats.goalDiff>0?'+':''}${stats.goalDiff}</div></div>
        <div><div class="stat-label">${tr('goals_for')}</div><div class="stat-value">${stats.goalsFor}</div></div>
        <div><div class="stat-label">${tr('goals_against')}</div><div class="stat-value">${stats.goalsAgainst}</div></div>
      </div>
    </div>

    ${renderRecordCard(tr('friendlies'), split.friendly, gamePlayers)}
    ${renderRecordCard(tr('tournaments'), split.tournament, gamePlayers)}

    ${(topScorer || topAssists || mostApps) ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_leaders')}</h2>
      ${topScorer ? `<div class="row leader-row"><span class="row-name">${tr('top_scorer')}</span><span class="row-meta">${esc(leaderNames(topScorer.names))} (${topScorer.value})</span></div>` : ''}
      ${topAssists ? `<div class="row leader-row"><span class="row-name">${tr('most_assists')}</span><span class="row-meta">${esc(leaderNames(topAssists.names))} (${topAssists.value})</span></div>` : ''}
      ${mostApps ? `<div class="row leader-row"><span class="row-name">${tr('most_apps')}</span><span class="row-meta">${esc(leaderNames(mostApps.names))} (${mostApps.value})</span></div>` : ''}
    </div>` : ''}

    ${tournaments.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('tournaments')}</h2>
      ${tournaments.map(t => {
        const outcome = getTournamentOutcomePublic(t, games, gamePlayers, getLang().toUpperCase());
        return `<div class="row"><span class="row-name">${esc(t.name)}</span><span class="row-meta">${outcome.emoji?outcome.emoji+' ':''}${esc(outcome.label)}</span></div>`;
      }).join('')}
    </div>` : ''}

    ${(data.seasonHighlights && data.seasonHighlights.length) ? `
    <div class="card" style="background:#faf7f0;border-color:#e2d9c4">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_highlights')}</h2>
      ${data.seasonHighlights.map(a => `<div class="row"><span class="row-name"><span aria-hidden="true">🏆</span> ${esc(a.title)}</span><span class="row-meta">${a.date?fmtDate(a.date):''}</span></div>`).join('')}
    </div>` : ''}

    <div class="card" style="text-align:center">
      <a href="${esc(backUrl)}" style="font-size:13px;font-weight:700;color:var(--red);text-decoration:none">← Back to Team Page</a>
    </div>

    <div class="footer-note">${tr('footer_recap')}</div>
  `;
}

// Applies the app's own real branding logo to the header, per the
// "reuse the central branding resolver, do not build a separate
// mechanism" instruction — this is the public-page equivalent of
// applyDynamicBrandingToDocument() in the main app, fed by the RPC
// since team.html has no IndexedDB/branding-resolver access at all.
// A small, centered club crest above the title — discreet: capped size,
// no border or shadow, simply absent if no logo is set rather than
// showing a placeholder.
function renderClubLogo(season) {
  const logoUrl = season?.clubLogoUrl;
  if (!logoUrl) return '';
  return `<img src="${esc(logoUrl)}" alt="" aria-hidden="true" style="position:absolute;top:50%;right:-10px;transform:translateY(-50%);width:160px;height:160px;object-fit:contain;opacity:0.12;pointer-events:none;z-index:0">`;
}

function applyTeamPageBranding(appBranding) {
  const mark = document.getElementById('brandMark');
  if (!mark) return;
  const logoUrl = appBranding?.mainLogo;
  if (logoUrl) {
    // Same fix as the main app: a real white background behind a likely-
    // transparent logo PNG, 'contain' so the full logo shows without
    // cropping, small padding via content-box so it doesn't touch the
    // rounded corners edge-to-edge.
    mark.style.background = '#fff';
    mark.style.backgroundImage = `url('${logoUrl}')`;
    mark.style.backgroundSize = 'contain';
    mark.style.backgroundRepeat = 'no-repeat';
    mark.style.backgroundPosition = 'center';
    mark.style.padding = '3px';
    mark.style.backgroundOrigin = 'content-box';
    mark.style.backgroundClip = 'content-box';
    mark.textContent = '';
  }
}

const TABS = [
  { id: 'lineup',  key: 'tab_lineup' },
  { id: 'matches', key: 'tab_matches' },
  { id: 'team',    key: 'tab_team' },
  { id: 'squad',   key: 'tab_squad' },
  { id: 'history', key: 'tab_history' },
];

// Which tab is open survives the 15-second refresh and a reload, because
// it lives in the address bar rather than in a variable that render()
// rebuilds. A tab with nothing in it is dropped from the menu.
function currentTabId() {
  const fromHash = (location.hash || '').replace(/^#/, '');
  return TABS.some(t => t.id === fromHash) ? fromHash : 'matches';
}

// Which slide is showing survives a refresh; auto-advance stops for good
// once the reader picks a card themselves.
let _slideIndex = 0;
let _slideTimer = null;
let _slidePaused = false;

function applyCarousel(el) {
  const box = el.querySelector('#pinnedCarousel');
  if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; }
  if (!box) return;
  const track = box.querySelector('.carousel-track');
  const slides = [...box.querySelectorAll('.carousel-slide')];
  const dots = [...el.querySelectorAll('.carousel-dot')];
  if (!slides.length) return;

  // Both cards get the same minimum height — the taller of the two
  // (in practice, usually Next Match) sets the floor, so a short
  // birthday message doesn't look visually smaller than the match
  // card when they share the same carousel.
  const cardEls = slides.map(s => s.querySelector('.card')).filter(Boolean);
  const maxCardHeight = Math.max(0, ...cardEls.map(c => c.scrollHeight));
  cardEls.forEach(c => { c.style.minHeight = maxCardHeight + 'px'; });

  // align-items:flex-start above stops slides from being stretched to
  // match the tallest one (flex's default row behavior) — this syncs
  // the TRACK's own height to just the active slide, which — now that
  // both cards share the same min-height above — ends up the same
  // regardless of which slide is showing.
  const show = i => {
    _slideIndex = (i + slides.length) % slides.length;
    track.style.transform = `translateX(-${_slideIndex * 100}%)`;
    track.style.height = slides[_slideIndex].scrollHeight + 'px';
    dots.forEach((d, n) => d.setAttribute('aria-selected', n === _slideIndex ? 'true' : 'false'));
  };
  show(_slideIndex);

  dots.forEach(d => {
    d.onclick = () => { _slidePaused = true; if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; } show(parseInt(d.dataset.slide)); };
  });

  // Shared by initial setup and by a manual swipe (which restarts
  // auto-advance rather than permanently stopping it, unlike a dot
  // tap) — one place sets up the interval so both stay consistent.
  const startAutoAdvance = () => {
    if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; }
    if (slides.length > 1 && !_slidePaused) {
      _slideTimer = setInterval(() => {
        if (document.visibilityState === 'visible') show(_slideIndex + 1);
      }, 6000);
    }
  };
  startAutoAdvance();

  // Touch swipe — plain touch events, no library. Classification
  // happens once, at touchend, from the total movement: a gesture
  // only changes slides when its horizontal distance clears a minimum
  // threshold AND exceeds its own vertical distance. Listeners are
  // passive (preventDefault is never called), so normal page
  // scrolling is never touched — a vertical or diagonal gesture just
  // scrolls the page as it always would, the swipe check simply
  // declines to act on it afterward.
  if (slides.length > 1) {
    const SWIPE_MIN_PX = 40;
    let tStartX = 0, tStartY = 0, tActive = false;
    box.ontouchstart = e => {
      const t = e.touches[0];
      tStartX = t.clientX; tStartY = t.clientY; tActive = true;
    };
    box.ontouchend = e => {
      if (!tActive) return;
      tActive = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
      if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) <= Math.abs(dy)) return;
      show(_slideIndex + (dx < 0 ? 1 : -1));
      _slidePaused = false;
      startAutoAdvance();
    };
  }
}

function applyTabs(el) {
  const panes = [...el.querySelectorAll('.pane')];
  if (!panes.length) return;
  const hasContent = id => {
    // Squad temporarily disappears during a live match — the roster is
    // still in the DOM, just not offered as a destination right now.
    if (id === 'squad' && _liveGameOnPage) return false;
    return panes.filter(p => p.dataset.tab === id).some(p => p.querySelector('.card'));
  };
  const available = TABS.filter(t => hasContent(t.id)).map(t => t.id);
  // A genuinely fresh open (no tab explicitly chosen via the URL) lands
  // on Lineup when a match is live, per spec — but an already-engaged
  // visitor's own tab choice, preserved in the hash, is never overridden.
  const hasExplicitHash = !!(location.hash || '').replace(/^#/, '');
  let active = (!hasExplicitHash && available.includes('lineup')) ? 'lineup' : currentTabId();
  if (!available.includes(active)) active = available[0] || 'matches';

  panes.forEach(p => { p.hidden = p.dataset.tab !== active; });
  const switchTo = id => {
    // replaceState rather than assigning location.hash: no history entry
    // per tap, and no browser jump-to-anchor.
    history.replaceState(null, '', '#' + id);
    applyTabs(el);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  el.querySelectorAll('[data-tabbtn]').forEach(btn => {
    const id = btn.dataset.tabbtn;
    btn.hidden = !available.includes(id);
    btn.setAttribute('aria-selected', id === active ? 'true' : 'false');
    btn.onclick = () => switchTo(id);
  });

  // Swipe left/right between tabs — same plain-touch technique as the
  // pinned carousel above (applyCarousel): classify once at touchend from
  // the total movement, only acting when the horizontal distance clears a
  // minimum AND exceeds the vertical one, with passive listeners so normal
  // page scrolling is never touched. Unlike the carousel, this does NOT
  // wrap around at the ends — swiping past the last/first tab just stays
  // put, matching how a tab bar (not a looping deck of cards) is expected
  // to behave. Skipped entirely when the gesture starts inside the League
  // Classification table's own horizontal scroller (.cls-scroll), so
  // scrolling that table never also flips the tab underneath it.
  const SWIPE_MIN_PX = 50;
  let tStartX = 0, tStartY = 0, tActive = false;
  panes.forEach(p => {
    p.ontouchstart = e => {
      tActive = !(e.target.closest && e.target.closest('.cls-scroll'));
      if (!tActive) return;
      const t = e.touches[0];
      tStartX = t.clientX; tStartY = t.clientY;
    };
    p.ontouchend = e => {
      if (!tActive) return;
      tActive = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
      if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) <= Math.abs(dy)) return;
      const i = available.indexOf(active);
      if (i < 0) return;
      const nextI = i + (dx < 0 ? 1 : -1);
      if (nextI < 0 || nextI >= available.length) return;
      switchTo(available[nextI]);
    };
  });
}

window.addEventListener('hashchange', () => {
  const el = document.getElementById('content');
  if (el) applyTabs(el);
});

// The bar only earns its place once the live card is off screen — above
// that, the card itself already shows the score.
function updateLiveBarVisibility() {
  const bar = document.getElementById('liveBar');
  if (!bar || bar.hidden) return;
  const card = document.querySelector('.live-card');
  const show = !card || card.getBoundingClientRect().bottom < 0;
  bar.classList.toggle('visible', show);
  document.body.classList.toggle('live-bar-on', show);
}

// League Classification — read-only table for the Team tab (ticket section
// 11). `classification` is the single latest-published snapshot the RPC
// already selected server-side (or null/undefined when none exists yet),
// shaped exactly like an admin classificationSnapshots record: { rows:
// [{position, teamName, points, played, wins, draws, losses, goalsFor,
// goalsAgainst, goalDiff, isOurTeam}], competitionName, phase, series,
// sourceName, publishedAt, ... } plus a `stale` flag computed by the
// caller from this page's own match data. Only dates/sources actually
// present on the snapshot are ever shown — nothing here is claimed to be
// live or official beyond what the snapshot itself records.
function renderClassificationTable(classification) {
  const header = `<h2 class="card-title" style="margin-top:0;font-size:11px">${tr('cls_section_header')}</h2>`;
  if (!classification || !Array.isArray(classification.rows) || !classification.rows.length) {
    return `<div class="card">${header}<p class="split-note">${tr('cls_empty')}</p></div>`;
  }
  const metaParts = [];
  if (classification.publishedAt) metaParts.push(tr('cls_updated_on', { date: fmtDate(String(classification.publishedAt).slice(0, 10)) }));
  if (classification.sourceName) metaParts.push(tr('cls_source_label', { source: esc(classification.sourceName) }));
  const scopeBits = [classification.competitionName, classification.phase, classification.series].filter(Boolean).map(esc);
  const rowsHtml = classification.rows.map(r => `
    <tr class="${r.isOurTeam ? 'cls-own' : ''}">
      <td class="cls-pos">${r.position ?? '—'}</td>
      <td>${esc(cleanTeamName(r.teamName || ''))}</td>
      <td class="cls-pts">${r.points ?? '—'}</td>
      <td>${r.played ?? '—'}</td>
      <td>${r.wins ?? '—'}</td>
      <td>${r.draws ?? '—'}</td>
      <td>${r.losses ?? '—'}</td>
      <td>${r.goalsFor ?? '—'}</td>
      <td>${r.goalsAgainst ?? '—'}</td>
      <td>${r.goalDiff ?? '—'}</td>
    </tr>`).join('');
  return `<div class="card">
    ${header}
    ${scopeBits.length ? `<div class="cls-meta">${scopeBits.join(' · ')}</div>` : ''}
    ${metaParts.length ? `<div class="cls-meta">${metaParts.join(' · ')}</div>` : ''}
    ${classification.stale ? `<div class="cls-warning">${tr('cls_stale_warning')}</div>` : ''}
    <div class="cls-scroll">
      <table class="classification-table">
        <thead><tr>
          <th>${tr('cls_col_pos')}</th><th>${tr('cls_col_team')}</th><th>${tr('cls_col_pts')}</th>
          <th>${tr('cls_col_played')}</th><th>${tr('cls_col_wins')}</th><th>${tr('cls_col_draws')}</th><th>${tr('cls_col_losses')}</th>
          <th>${tr('cls_col_gf')}</th><th>${tr('cls_col_ga')}</th><th>${tr('cls_col_gd')}</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>`;
}

function render(el, data) {
  // Reset so re-renders (language switch, the 15-60s live poll) don't pile
  // up stale entries in this array for the lifetime of the page.
  _dirTargets = [];
  applyTeamPageBranding(data.appBranding);

  const params = new URLSearchParams(window.location.search);
  if (params.get('view') === 'recap') {
    renderRecap(el, data);
    return;
  }

  const games = dedupeGames(data.games || []);
  const gamePlayers = data.gamePlayers || [];
  const players = dedupePlayers(data.players || []);
  const tournaments = data.tournaments || [];
  const season = data.season || {};

  // Only finished games count toward the record — same rule the main
  // app's own isGameResultVisible / Team Summary use: the moment kickoff
  // has passed, a game counts as finished. Games here already exclude
  // deleted rows; visibility just needs "already happened."
  const now = new Date();
  // Same completion rule as the app: kick-off + duration + buffer. The old
  // rule counted a game as finished at kick-off, so a live 0-0 showed as a
  // result. "Next Match" still moves on only once the game has finished.
  const finishedGames = games.filter(g => isGameFinished(g, season));
  const liveGames = games.filter(g => isGameLive(g, season)).sort((a,b) => gameSortKey(a) - gameSortKey(b));
  _liveGameOnPage = liveGames.length > 0;
  // "Just finished" match summary — fixed above the carousel (not one of
  // its rotating slides) for roughly 24h after the match, same always-
  // visible treatment as the live card above. Excludes anything still in
  // liveGames (isMatchSummaryWindowOpen already implies isGameFinished,
  // so there's no actual overlap, but the exclusion is kept explicit here
  // for the same reason upcomingGames excludes them below).
  const summaryGames = games.filter(g => !liveGames.includes(g) && isMatchSummaryWindowOpen(g, season))
    .sort((a,b) => gameSortKey(a) - gameSortKey(b));
  const upcomingGames = games.filter(g => g.date && !finishedGames.includes(g) && !liveGames.includes(g))
    .sort((a,b) => gameSortKey(a) - gameSortKey(b));
  const split = splitGames(finishedGames);
  const officialGames = split.official;

  const stats = computeTeamStats(officialGames);

  // League Classification (ticket section 11) — the RPC already selected
  // the single latest-published snapshot for this season, scoped and
  // validated on the admin side; this page only displays it read-only.
  // Staleness is judged the same way the admin screen judges it: if our
  // own completed League matches for this exact competition already
  // outnumber what the snapshot shows for our row, the snapshot predates
  // at least one result we already have.
  const classification = data.classification || null;
  if (classification) {
    const ourClsRow = (classification.rows || []).find(r => r.isOurTeam);
    const clsCompName = (classification.competitionName || '').trim().toLowerCase();
    const clsScopeGames = finishedGames.filter(g => g.competitionType === 'League' && (g.competitionName || '').trim().toLowerCase() === clsCompName);
    classification.stale = !!(ourClsRow && clsScopeGames.length > (ourClsRow.played || 0));
  }

  // Recent Results lists every finished game (tagged by type); the form
  // strip in Season Summary is League & Cup only.
  const recent = [...finishedGames].sort((a,b) => gameSortKey(b) - gameSortKey(a)).slice(0, 5);
  const recentOfficial = [...officialGames].sort((a,b) => gameSortKey(b) - gameSortKey(a)).slice(0, 5);
  const next = upcomingGames[0];

  // Live Match banner — only shown when today is genuinely match day,
  // per the spec's "do not show it outside match day." Deliberately a
  // simple date check (today's date matches a scheduled game), not a
  // precise live-clock/in-progress detector, since the app has no
  // concept of "match currently in progress" beyond the scheduled date.
  const liveMatchToday = liveGames[0] || null;

  // Next Match and the birthday card sit above the menu when no game is
  // being played; while one is live the live card takes that spot and
  // these move into their tabs.
  const nextMatchHtml = next ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('next_match')}</h2>
      <div style="font-weight:700;font-size:15px">${esc(next.opponent)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">${roundLabel(next) ? esc(roundLabel(next)) + ' · ' : ''}${fmtDate(next.date)}${next.gameTime ? ' · ' + next.gameTime : ''}${next.competitionName ? ' · ' + esc(next.competitionName) : ''}</div>
      ${next.venue ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">📍 ${esc(next.venue)} · ${directionsLinkHtml(next.opponentMapUrl, next.venue || next.opponent, next.opponentMapAddress)}</div>` : ''}
      ${(() => {
        const kickoff = new Date(`${next.date}T${next.gameTime || '00:00'}`);
        const daysLeft = Math.round((kickoff - new Date()) / (1000*60*60*24));
        if (isNaN(kickoff) || daysLeft < 0) return '';
        if (daysLeft === 0) return `<div style="font-size:12px;font-weight:700;color:var(--black);margin-top:6px">${tr('today')}</div>`;
        if (daysLeft === 1) return `<div style="font-size:12px;font-weight:700;color:var(--black);margin-top:6px">${tr('tomorrow')}</div>`;
        return `<div style="font-size:12px;font-weight:700;color:var(--black);margin-top:6px">${tr('days_remaining', {n: daysLeft})}</div>`;
      })()}
    </div>` : '';
  const birthdays = dedupePlayerRows(data.birthdays || []);
  // Pinned carousel: birthday and next match share ONE card area,
  // flipping between them — not two separate stacked cards.
  //
  // Priority: Next Match normally comes first — football has priority
  // on this page. The one exception is a birthday that falls on the
  // actual current day: that becomes slide 1, UNLESS there's also a
  // game today, in which case the game keeps first priority and the
  // birthday celebration is slide 2.
  const todayBirthdays = birthdays.filter(b => b.isToday);
  const gameToday = games.some(g => g.date === todayLocalDateStr());
  const happyBirthdaySlide = renderHappyBirthdaySlide(todayBirthdays);
  const birthdaySlide = happyBirthdaySlide || renderBirthdayInfoSlide(birthdays);
  // Hidden entirely while a match is live — the global live card
  // already has full attention; the carousel returns once the match
  // finishes and liveMatchToday clears on the next render.
  const carouselSlides = liveMatchToday ? [] : (
    (todayBirthdays.length && !gameToday)
      ? [birthdaySlide, nextMatchHtml].filter(Boolean)
      : [nextMatchHtml, birthdaySlide].filter(Boolean)
  );

  const html = `
    <div class="team-header" style="position:relative;overflow:hidden">
      ${renderClubLogo(season)}
      <div style="position:relative;z-index:1">
        <h1 style="margin:0">${esc(season.clubName || 'Team')} ${season.ageGroup ? '· ' + esc(season.ageGroup) : ''}</h1>
        <div class="sub" style="margin-top:2px">${esc(season.seasonName || '')} ${season.status === 'completed' ? '<span class="badge" style="background:#e8f0fe;color:#1a56c4;margin-left:6px">' + tr('completed') + '</span>' : ''}</div>
    </div>

    ${season.status === 'completed' ? `
    <a class="card" href="${esc(window.location.pathname+window.location.search+'&view=recap')}" style="background:#1a1a2e;color:#fff;text-decoration:none;display:block" aria-label="View full ${esc(season.seasonName)} Season Recap">
      <h2 class="card-title" style="color:#aab;margin-top:0;font-size:11px">${tr('season_recap', {season: esc(season.seasonName)})}</h2>
      <div class="stat-grid" style="margin-top:8px">
        <div><div class="stat-value" style="color:#fff">${stats.played}</div><div class="stat-label" style="color:#889">${tr('played')}</div></div>
        <div><div class="stat-value" style="color:#fff">${stats.wins}</div><div class="stat-label" style="color:#889">${tr('wins')}</div></div>
        <div><div class="stat-value" style="color:#fff">${stats.draws}</div><div class="stat-label" style="color:#889">${tr('draws')}</div></div>
        <div><div class="stat-value" style="color:#fff">${stats.losses}</div><div class="stat-label" style="color:#889">${tr('losses')}</div></div>
      </div>
      <div style="margin-top:10px;font-size:12px;font-weight:700;text-decoration:underline">View Recap →</div>
    </a>` : ''}

    ${liveGames.map(g => renderLiveCard(g, season, players, gamePlayers)).join('')}
    ${summaryGames.map(g => renderMatchSummaryCard(g, season, players, gamePlayers, g.guestPlayers)).join('')}

    ${carouselSlides.length ? `
    <div class="carousel" id="pinnedCarousel">
      <div class="carousel-track">
        ${carouselSlides.map(html => `<div class="carousel-slide">${html}</div>`).join('')}
      </div>
    </div>
    ${carouselSlides.length > 1 ? `
    <div class="carousel-dots" role="tablist" aria-label="Pinned cards">
      ${carouselSlides.map((_, i) => `<button type="button" class="carousel-dot" role="tab" data-slide="${i}" aria-selected="false" aria-label="Card ${i+1}"><span></span></button>`).join('')}
    </div>` : '<div style="height:14px"></div>'}
    ` : ''}

    ${renderClubWatermark(season)}
    <nav class="tabs" role="tablist" aria-label="Sections">
      ${TABS.map(tab => `<button type="button" class="tab-btn" role="tab" data-tabbtn="${tab.id}" aria-selected="false">${tr(tab.key)}</button>`).join('')}
    </nav>

    <div class="pane" data-tab="team">
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_summary')}</h2>
      ${officialGames.length ? '' : '<p class="split-note">' + tr('no_official') + '</p>'}
      ${stats.played ? `
      <div style="margin-bottom:14px">
        ${renderPctBarRow(tr('w_short'), stats.wins, stats.played, '--green')}
        ${renderPctBarRow(tr('d_short'), stats.draws, stats.played, '--amber')}
        ${renderPctBarRow(tr('l_short'), stats.losses, stats.played, '--red')}
      </div>` : ''}
      <div class="stat-grid boxed">
        <div><div class="stat-label">${tr('goal_diff')}</div><div class="stat-value">${stats.goalDiff>0?'+':''}${stats.goalDiff}</div></div>
        <div><div class="stat-label">${tr('goals_for')}</div><div class="stat-value">${stats.goalsFor}</div></div>
        <div><div class="stat-label">${tr('goals_against')}</div><div class="stat-value">${stats.goalsAgainst}</div></div>
        <div class="box-green"><div class="stat-label">${tr('clean_sheets')}</div><div class="stat-value">${stats.cleanSheets}</div></div>
        <div class="box-green"><div class="stat-label">${tr('best_win_streak')}</div><div class="stat-value">${stats.bestStreak}</div></div>
        <div class="box-green"><div class="stat-label">${tr('best_unbeaten')}</div><div class="stat-value">${stats.bestUnbeaten}</div></div>
      </div>
      ${(stats.homeW || stats.homeD || stats.homeL || stats.awayW || stats.awayD || stats.awayL) ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="row"><span class="row-name">${tr('home_record')}</span><span class="row-meta">${stats.homeW}${tr('w_short')}-${stats.homeD}${tr('d_short')}-${stats.homeL}${tr('l_short')}</span></div>
        <div class="row"><span class="row-name">${tr('away_record')}</span><span class="row-meta">${stats.awayW}${tr('w_short')}-${stats.awayD}${tr('d_short')}-${stats.awayL}${tr('l_short')}</span></div>
        ${stats.biggestWin ? `<div class="row"><span class="row-name">${tr('biggest_win')}</span><span class="row-meta">${esc(stats.biggestWin.score)} ${tr('vs')} ${esc(stats.biggestWin.opp)}</span></div>` : ''}
        ${stats.biggestLoss ? `<div class="row"><span class="row-name">${tr('biggest_loss')}</span><span class="row-meta">${esc(stats.biggestLoss.score)} ${tr('vs')} ${esc(stats.biggestLoss.opp)}</span></div>` : ''}
      </div>` : ''}
      ${recentOfficial.length ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="stat-label" style="margin-bottom:6px">${tr('current_form')}</div>
        <div style="display:flex;gap:6px">
          ${[...recentOfficial].reverse().map(g => {
            const our = parseInt(g.ourScore) || 0;
            const their = parseInt(g.opponentScore)||0;
            const res = result(our, their, g);
            return `<span class="badge badge-${res}" style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%">${res}</span>`;
          }).join('')}
        </div>
      </div>` : ''}
      ${renderCompetitionBreakdown(split, games, gamePlayers)}
    </div>

    ${renderSeasonLeaders(players, officialGames, gamePlayers)}
    ${renderClassificationTable(classification)}
    </div>

    <div class="pane" data-tab="matches">
    ${recent.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('recent_results')}</h2>
      ${recent.map(g => {
        const our = parseInt(g.ourScore) || 0;
        const their = parseInt(g.opponentScore)||0;
        const res = result(our, their, g);
        const s = homeAwayScore(g.homeAway, our, their, g.neutralSide);
        const hasPens = g.ourPenaltyGoals!=null && g.penaltiesForThem!=null;
        const roundTxt = roundLabel(g);
        return `<div class="row">
          <span class="row-name">${esc(g.opponent)}</span>
          ${roundTxt?`<span class="row-meta">${esc(roundTxt)}</span>`:''}
          <span class="comp-tag">${esc(g.competitionName || compTypeTag(g.competitionType))}</span>
          <span class="score">${s.home}-${s.away}</span>
          ${hasPens?`<span class="row-meta">${g.ourPenaltyGoals}-${g.penaltiesForThem}P</span>`:''}
          <span class="badge badge-${res}">${res}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('upcoming_matches')}</h2>
      ${upcomingGames.length ? `
      <div id="upcoming-matches-list">
        ${upcomingGames.slice(0, 5).map((g, i) => renderUpcomingMatchRow(g, i)).join('')}
      </div>
      ${upcomingGames.length > 5 ? `
      <div id="upcoming-matches-rest" style="display:none">
        ${upcomingGames.slice(5).map((g, i) => renderUpcomingMatchRow(g, i + 5)).join('')}
      </div>
      <button type="button" id="upcoming-matches-toggle" class="link-button"
              style="background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0;display:block"
              onclick="toggleUpcomingMatches()">${tr('view_all_matches')}</button>
      ` : ''}
      ` : `<p class="row-meta" style="padding:4px 0">${tr('no_upcoming_matches')}</p>`}
      <p class="row-meta" style="margin-top:8px;font-size:10px;color:var(--muted)">${tr('upcoming_note')}</p>
    </div>

    ${tournaments.length ? `
    ${tournaments.map(t => {
      const outcome = getTournamentOutcomePublic(t, games, gamePlayers, getLang().toUpperCase());
      const matchesPlayed = games.filter(g => g.tournamentId === t.tournamentId).length;
      return `<div class="card">
        <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('tournament')}</h2>
        <div style="font-weight:700;font-size:15px">${esc(t.name)}</div>
        <div style="font-size:13px;margin-top:4px">${outcome.emoji ? outcome.emoji + ' ' : ''}${esc(outcome.label)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${matchesPlayed === 1 ? tr('match_played') : tr('matches_played', {n: matchesPlayed})}</div>
      </div>`;
    }).join('')}
    ` : ''}
    </div>

    <div class="pane" data-tab="lineup">
    ${liveMatchToday ? (() => {
      // Independent field from gamePlayers — gated by its own show_lineup
      // toggle rather than show_player_stats, so this can be shared
      // without exposing goals/assists/season stats.
      const liveGP = (data.lineup || []).filter(r => r.gameId === liveMatchToday.gameId);
      const starterIds = new Set(liveGP.filter(r => r.calledUp && r.role === 'Starter' && r.playerId).map(r => r.playerId));
      const subIds = new Set(liveGP.filter(r => r.calledUp && r.role !== 'Starter' && r.playerId).map(r => r.playerId));
      // Guest players normalized into the same shape as a regular
      // player (fullName/shirtNumber/primaryPosition) so the existing
      // grouping and row rendering below need no changes at all to
      // handle them — they're just more entries in the same array.
      const starterTempIds = new Set(liveGP.filter(r => r.calledUp && r.role === 'Starter' && r.tempPlayerId).map(r => r.tempPlayerId));
      const subTempIds = new Set(liveGP.filter(r => r.calledUp && r.role !== 'Starter' && r.tempPlayerId).map(r => r.tempPlayerId));
      // Effective position for this game: positionPlayed if the coach
      // set one, else the usual position — same chain as the coach
      // app, same reason: a player moved for today's match should be
      // grouped/shown by where they're actually playing, not their
      // normal spot. New objects via spread, not a mutation of the
      // shared players/guestPlayers arrays.
      const asPlayerShape = g => {
        const gp = liveGP.find(r => r.tempPlayerId === g.tempPlayerId) || {};
        return { fullName: g.name, shirtNumber: g.shirtNumber, primaryPosition: gp.positionPlayed || g.preferredPosition || null };
      };
      const withEffectivePos = p => {
        const gp = liveGP.find(r => r.playerId === p.playerId) || {};
        return { ...p, primaryPosition: gp.positionPlayed || p.primaryPosition };
      };
      const guestStarters = (data.guestPlayers || []).filter(g => starterTempIds.has(g.tempPlayerId)).map(asPlayerShape);
      const guestSubs = (data.guestPlayers || []).filter(g => subTempIds.has(g.tempPlayerId)).map(asPlayerShape);
      const starters = players.filter(p => starterIds.has(p.playerId)).map(withEffectivePos).concat(guestStarters);
      const subs = players.filter(p => subIds.has(p.playerId)).map(withEffectivePos).concat(guestSubs);
      const playerRow = p => `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(p.fullName)}</span>
          <span class="row-meta">${p.primaryPosition?esc(posName(p.primaryPosition)):''}</span>
        </div>`;
      // Live card: deliberately NOT rendered here — the global one
      // above the tab bar already covers it. Starting 11 goes straight
      // into its own content, per the confirmed design.
      return `
      <div class="card">
        <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('tab_lineup')}</h2>
        ${starters.length ? renderPositionGroupedRows(starters, playerRow) : `<p class="row-meta" style="padding:4px 0">${tr('lineup_none')}</p>`}
        ${subs.length ? `
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <div class="stat-label" style="margin-bottom:6px">${tr('lineup_subs')}</div>
          ${renderPositionGroupedRows(subs, playerRow)}
        </div>` : ''}
      </div>`;
    })() : ''}
    </div>

    <div class="pane" data-tab="squad">
    ${(() => {
      const av = data.availability;
      if (!av || (av.available + av.unavailable) <= 0) return '';
      const unavailableList = dedupePlayerRows(av.unavailablePlayers || []);
      // The counts are server-side totals; if duplicate rows inflated them,
      // fall back to the de-duplicated list rather than showing a number
      // that contradicts the names underneath.
      const dupes = (av.unavailablePlayers || []).length - unavailableList.length;
      const unavailableCount = dupes > 0 ? unavailableList.length : av.unavailable;
      const availableCount = dupes > 0 ? Math.max(0, players.length - unavailableCount) : av.available;
      return `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('availability')}</h2>
      <div class="stat-grid">
        <div><div class="stat-label">${tr('available')}</div><div class="stat-value" style="color:var(--green)">${availableCount}</div></div>
        <div><div class="stat-label">${tr('unavailable')}</div><div class="stat-value" style="color:var(--red)">${unavailableCount}</div></div>
      </div>
      ${unavailableList.length ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        ${unavailableList.map(p => `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(shortName(p.fullName))}${p.primaryPosition?' · '+esc(posName(p.primaryPosition)):''}</span>
          <span class="row-meta" style="color:var(--red)">${tr('unavailable')}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>`;
    })()}

    ${players.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('squad')}</h2>
      ${renderPositionGroupedRows(players, p => {
        const s = playerPublicStats(p.playerId, finishedGames, gamePlayers);
        const mostPlayed = s.mostPlayedPosition || p.primaryPosition;
        return `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(p.fullName)}</span>
          <span class="row-meta">${p.primaryPosition?esc(posName(p.primaryPosition)):''}${(mostPlayed && mostPlayed !== p.primaryPosition) ? ' · ' + esc(posName(mostPlayed)) + ' (' + tr('most_played') + ')' : ''}</span>
        </div>`;
      })}
    </div>` : ''}

    ${players.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('player_stats')}</h2>
      ${dedupePlayers(players).map(p => {
        const all = playerPublicStats(p.playerId, finishedGames, gamePlayers);
        if (all.calledUp === 0) return '';
        const s = playerPublicStats(p.playerId, officialGames, gamePlayers);
        const extra = ['friendly', 'tournament'].map(k => {
          if (!split[k].length) return '';
          const x = playerPublicStats(p.playerId, split[k], gamePlayers);
          return x.calledUp ? `${categoryLabel(k)}: ${x.calledUp} GP · ${x.goals} G · ${x.assists} A` : '';
        }).filter(Boolean).join(' &nbsp;|&nbsp; ');
        return `<div class="row"${extra ? ' style="border-bottom:none"' : ''}>
          <span class="row-name">${esc(shortName(p.fullName))}</span>
          <span class="pill">${s.calledUp} GP</span>
          <span class="pill">${s.goals} G</span>
          <span class="pill">${s.assists} A</span>
        </div>${extra ? `<div class="split-line" style="border-bottom:1px solid var(--border)">${extra}</div>` : ''}`;
      }).join('')}
    </div>` : ''}

    </div>

    <div class="pane" data-tab="team">
    ${(data.seasonHighlights && data.seasonHighlights.length) ? `
    <div class="card" style="background:#faf7f0;border-color:#e2d9c4">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('season_highlights')}</h2>
      ${data.seasonHighlights.map(a => `<div class="row">
        <span class="row-name"><span aria-hidden="true">🏆</span> ${esc(a.title)}</span>
        <span class="row-meta">${a.date ? fmtDate(a.date) : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    </div>

    <div class="pane" data-tab="history">
    ${(data.previousAchievements && data.previousAchievements.length) ? `
    <div class="card" style="background:#faf7f0;border-color:#e2d9c4">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('prev_achievements')}</h2>
      ${data.previousAchievements.map(a => `<div class="row">
        <span class="row-name"><span aria-hidden="true">🏆</span> ${esc(a.title)}</span>
        <span class="row-meta">${a.date ? fmtDate(a.date) : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    ${(data.previousSeasons && data.previousSeasons.length) ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('prev_seasons')}</h2>
      ${data.previousSeasons.map(s => `<a class="row" href="team.html?token=${encodeURIComponent(s.shareToken)}" style="text-decoration:none;color:inherit" aria-label="View ${esc(s.seasonName)} season for ${esc(s.clubName||'')}">
        <span class="row-name">${esc(s.seasonName)}</span>
        <span class="row-meta">${esc(s.clubName||'')} ›</span>
      </a>`).join('')}
    </div>` : ''}
    </div>

    <div class="footer-note">
      ${tr('footer')}<br>
      <span id="footerRefreshStatus" role="status" aria-live="polite"></span>
      <button type="button" style="background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11px;margin-left:6px" onclick="handleManualRefresh()">${tr('refresh')}</button>
    </div>
  `;

  el.innerHTML = html;
  applyTabs(el);
  applyCarousel(el);

  // Live score bar, pinned to the top of the page while a game is on —
  // both teams and the running score, tap to jump to the live card. It
  // scrolls with the page rather than floating over the content, which is
  // what the old bottom pill did.
  const liveBar = document.getElementById('liveBar');
  if (liveBar) {
    if (liveMatchToday) {
      const our = parseInt(liveMatchToday.ourScore) || 0;
      const their = parseInt(liveMatchToday.opponentScore)||0;
      const sc = homeAwayScore(liveMatchToday.homeAway, our, their, liveMatchToday.neutralSide);
      // Score only — the card below names the teams.
      liveBar.innerHTML = `<span class="dot" aria-hidden="true"></span>`
        + `<span class="bar-label">${tr('live')}</span>`
        + `<span class="bar-score">${sc.home} - ${sc.away}</span>`;
      liveBar.onclick = () => document.querySelector('.live-card')?.scrollIntoView({behavior:'smooth', block:'center'});
      liveBar.hidden = false;           // present, but only slides in once
      updateLiveBarVisibility();        // the live card has scrolled away
    } else {
      liveBar.hidden = true;
      liveBar.innerHTML = '';
      liveBar.classList.remove('visible');
      document.body.classList.remove('live-bar-on');
    }
  }

  // Sticky compact header — populated here, shown/hidden via scroll
  // listener attached once (not re-attached on every render, since
  // loadTeamPage only calls render once per real data load anyway).
  const stickyNameEl = document.getElementById('stickyName');
  const stickySeasonEl = document.getElementById('stickySeason');
  if (stickyNameEl) stickyNameEl.textContent = season.clubName || 'Team';
  if (stickySeasonEl) stickySeasonEl.textContent = season.seasonName || '';

  if (!window._stickyScrollBound) {
    window._stickyScrollBound = true;
    window.addEventListener('scroll', () => {
      const stickyEl = document.getElementById('stickyHeader');
      const heroEl = document.querySelector('.team-header');
      if (stickyEl && heroEl) {
        const show = heroEl.getBoundingClientRect().bottom < 0;
        stickyEl.classList.toggle('visible', show);
        document.body.classList.toggle('sticky-on', show);
      }
      updateLiveBarVisibility();
    }, { passive: true });
  }
}

loadTeamPage();
</script>
</body>
</html>
