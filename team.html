    ${renderRecordCard(tr('friendlies'), split.friendly, gamePlayers)}

      ${topAssists ? `<div class="row leader-row"><span class="row-name">${tr('most_assists')}</span><span class="row-meta">${esc(leaderNames(topAssists.names))} (${topAssists.value})</span></div>` : ''}

// A small, centered club crest above the title — discreet: capped size,
// no border or shadow, simply absent if no logo is set rather than

function renderClubLogo(season) {

function applyTeamPageBranding(appBranding) {
  const mark = document.getElementById('brandMark');
  if (!mark) return;
  const logoUrl = appBranding?.mainLogo;

const TABS = [
  { id: 'lineup',  key: 'tab_lineup' },
  { id: 'matches', key: 'tab_matches' },
  { id: 'team',    key: 'tab_team' },
  { id: 'squad',   key: 'tab_squad' },
  { id: 'history', key: 'tab_history' },
];

// Which tab is open survives the 15-second refresh and a reload, because
// it lives in the address bar rather than in a variable that render()
// rebuilds. A tab with nothing in it is dropped from the menu.
function currentTabId() {
  const fromHash = (location.hash || '').replace(/^#/, '');
  return TABS.some(t => t.id === fromHash) ? fromHash : 'matches';
}

// Which slide is showing survives a refresh; auto-advance stops for good
// once the reader picks a card themselves.
let _slideIndex = 0;
let _slideTimer = null;
let _slidePaused = false;

function applyCarousel(el) {
  const box = el.querySelector('#pinnedCarousel');
  if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; }
  if (!box) return;
  const track = box.querySelector('.carousel-track');
  // render() prepends a clone of the last slide and appends a clone of
  // the first whenever there's more than one real slide (so swiping past
  // an end has a slide to animate TO), so this array is N+2 long in that
  // case and just N when there's only one. Dots are only rendered for
  // N>1, so dots.length doubles as "how many real slides" without having
  // to infer it from the clone-padded DOM count.
  const slideEls = [...box.querySelectorAll('.carousel-slide')];
  const dots = [...el.querySelectorAll('.carousel-dot')];
  if (!slideEls.length) return;
  const N = dots.length > 0 ? dots.length : 1;
  const looped = N > 1;
  const domOffset = looped ? 1 : 0; // shift from logical index to DOM index (clone sits at 0)

  _slideIndex = N > 0 ? (((_slideIndex % N) + N) % N) : 0; // clamp across re-renders with a different slide count

  // Deliberately NO forced equal-height here — each card (classification
  // preview, latest result, next match, birthday) sizes to its own
  // content. align-items:flex-start stops flexbox's default cross-axis
  // stretch, and the TRACK's own height is synced to just the active
  // slide below, so a short card never inherits a tall neighbour's
  // height; the CSS transition on that height (same duration as the
  // slide transform) animates the change smoothly when slides of
  // different heights swap in.
  const goToDom = (domIdx, animate) => {
    if (!animate) track.style.transition = 'none';
    track.style.transform = `translateX(-${domIdx * 100}%)`;
    track.style.height = slideEls[domIdx].scrollHeight + 'px';
    if (!animate) {
      void track.offsetWidth; // force a reflow before re-enabling the transition
      track.style.transition = '';
    }
  };
  const setDots = () => dots.forEach((d, n) => d.setAttribute('aria-selected', n === _slideIndex ? 'true' : 'false'));
  goToDom(domOffset + _slideIndex, false); // initial position: no animation on page load/re-render
  setDots();

  // One step forward/backward, with a seamless wrap at either end: a
  // swipe/auto-advance past the last slide animates onto the cloned
  // first slide (not back across every real slide to reach it), then —
  // once that short animation finishes — snaps instantly (no transition)
  // onto the REAL first slide, which looks identical to the clone it was
  // just sitting on, so the reset is invisible. Same trick in reverse at
  // the start. Non-wrapping steps are a plain one-slide animation.
  let _wrapPending = false;
  const step = dir => {
    if (_wrapPending) return; // ignore a rapid re-trigger mid-wrap-snap
    const atLast = _slideIndex === N - 1;
    const atFirst = _slideIndex === 0;
    const wrapForward = looped && dir === 1 && atLast;
    const wrapBackward = looped && dir === -1 && atFirst;
    _slideIndex = ((_slideIndex + dir) % N + N) % N;
    setDots();
    if (wrapForward || wrapBackward) {
      _wrapPending = true;
      goToDom(wrapForward ? N + 1 : 0, true); // animate onto the clone just past the edge
      let done = false;
      const settle = () => {
        if (done) return;
        done = true;
        track.removeEventListener('transitionend', settle);
        goToDom(domOffset + _slideIndex, false); // instant snap onto the real slide (visually identical to the clone)
        _wrapPending = false;
      };
      track.addEventListener('transitionend', settle);
      setTimeout(settle, 350); // fallback for reduced-motion / no-transition environments
    } else {
      goToDom(domOffset + _slideIndex, true);
    }
  };
  const jumpTo = logical => {
    _slideIndex = ((logical % N) + N) % N;
    setDots();
    goToDom(domOffset + _slideIndex, true);
  };

  dots.forEach(d => {
    d.onclick = () => { _slidePaused = true; if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; } jumpTo(parseInt(d.dataset.slide)); };
  });

  // Shared by initial setup and by a manual swipe (which restarts
  // auto-advance rather than permanently stopping it, unlike a dot
  // tap) — one place sets up the interval so both stay consistent.
  // Loops continuously, same as a swipe, via step()'s own wrap handling.
  const startAutoAdvance = () => {
    if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; }
    if (N > 1 && !_slidePaused) {
      _slideTimer = setInterval(() => {
        if (document.visibilityState === 'visible') step(1);
      }, 6000);
    }
  };
  startAutoAdvance();

  // Touch swipe — plain touch events, no library. Classification
  // happens once, at touchend, from the total movement: a gesture
  // only changes slides when its horizontal distance clears a minimum
  // threshold AND exceeds its own vertical distance. Listeners are
  // passive (preventDefault is never called), so normal page
  // scrolling is never touched — a vertical or diagonal gesture just
  // scrolls the page as it always would, the swipe check simply
  // declines to act on it afterward.
  if (N > 1) {
    const SWIPE_MIN_PX = 40;
    let tStartX = 0, tStartY = 0, tActive = false;
    box.ontouchstart = e => {
      const t = e.touches[0];
      tStartX = t.clientX; tStartY = t.clientY; tActive = true;
    };
    box.ontouchend = e => {
      if (!tActive) return;
      tActive = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
      if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) <= Math.abs(dy)) return;
      step(dx < 0 ? 1 : -1);
      _slidePaused = false;
      startAutoAdvance();
    };
  }
}

function applyTabs(el) {
  const panes = [...el.querySelectorAll('.pane')];
  if (!panes.length) return;
  const hasContent = id => {
    // Squad temporarily disappears during a live match — the roster is
    // still in the DOM, just not offered as a destination right now.
    if (id === 'squad' && _liveGameOnPage) return false;
    return panes.filter(p => p.dataset.tab === id).some(p => p.querySelector('.card'));
  };
  const available = TABS.filter(t => hasContent(t.id)).map(t => t.id);
  // A genuinely fresh open (no tab explicitly chosen via the URL) lands
  // on Lineup when a match is live, per spec — but an already-engaged
  // visitor's own tab choice, preserved in the hash, is never overridden.
  const hasExplicitHash = !!(location.hash || '').replace(/^#/, '');
  let active = (!hasExplicitHash && available.includes('lineup')) ? 'lineup' : currentTabId();
  if (!available.includes(active)) active = available[0] || 'matches';

  panes.forEach(p => { p.hidden = p.dataset.tab !== active; });
  const switchTo = id => {
    // replaceState rather than assigning location.hash: no history entry
    // per tap, and no browser jump-to-anchor.
    history.replaceState(null, '', '#' + id);
    applyTabs(el);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  el.querySelectorAll('[data-tabbtn]').forEach(btn => {
    const id = btn.dataset.tabbtn;
    btn.hidden = !available.includes(id);
    btn.setAttribute('aria-selected', id === active ? 'true' : 'false');
    btn.onclick = () => switchTo(id);
  });

  // Swipe left/right between tabs — same plain-touch technique as the
  // pinned carousel above (applyCarousel): classify once at touchend from
  // the total movement, only acting when the horizontal distance clears a
  // minimum AND exceeds the vertical one, with passive listeners so normal
  // page scrolling is never touched. Unlike the carousel, this does NOT
  // wrap around at the ends — swiping past the last/first tab just stays
  // put, matching how a tab bar (not a looping deck of cards) is expected
  // to behave. Skipped entirely when the gesture starts inside the League
  // Classification table's own horizontal scroller (.cls-scroll), so
  // scrolling that table never also flips the tab underneath it.
  const SWIPE_MIN_PX = 50;
  let tStartX = 0, tStartY = 0, tActive = false;
  panes.forEach(p => {
    p.ontouchstart = e => {
      tActive = !(e.target.closest && e.target.closest('.cls-scroll'));
      if (!tActive) return;
      const t = e.touches[0];
      tStartX = t.clientX; tStartY = t.clientY;
    };
    p.ontouchend = e => {
      if (!tActive) return;
      tActive = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
      if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) <= Math.abs(dy)) return;
      const i = available.indexOf(active);
      if (i < 0) return;
      const nextI = i + (dx < 0 ? 1 : -1);
      if (nextI < 0 || nextI >= available.length) return;
      switchTo(available[nextI]);
    };
  });
}

window.addEventListener('hashchange', () => {
  const el = document.getElementById('content');
  if (el) applyTabs(el);
});

// Word pair for a count that needs a singular/plural form — e.g.
// plWord(1,'word_game','word_games') -> "game"/"jogo",
// plWord(4,'word_game','word_games') -> "games"/"jogos".
function plWord(n, singularKey, pluralKey) {
  return tr(Math.abs(n) === 1 ? singularKey : pluralKey);
}
// "{n} point(s)" / "{n} ponto(s)", correctly pluralized either way.
function ptsPhrase(n) {
  return `${n} ${plWord(n, 'word_point', 'word_points')}`;
}
// English ordinal suffix (1st, 2nd, 3rd, 4th … 11th, 12th, 13th …);
// Portuguese always uses the simple "{n}.º" form the ticket's own
// examples use, regardless of gender. Split into {num, suffix} so the
// rank display can style the suffix smaller/raised, the way "1.º"/"1st"
// is normally typeset; ordinalLabel is the plain-text join of the two,
// for inline use inside a sentence (e.g. the context messages below).
function ordinalParts(n) {
  if (getLang() === 'pt') return { num: n, suffix: '.º' };
  const v = n % 100;
  if (v >= 11 && v <= 13) return { num: n, suffix: 'th' };
  switch (n % 10) {
    case 1: return { num: n, suffix: 'st' };
    case 2: return { num: n, suffix: 'nd' };
    case 3: return { num: n, suffix: 'rd' };
    default: return { num: n, suffix: 'th' };
  }
}
function ordinalLabel(n) {
  const p = ordinalParts(n);
  return p.num + p.suffix;
}

// League Leader Spotlight — compact carousel teaser for the League
// Classification (standings-placement ticket, then its visual redesign).
// Shown only when the full table would show real rows — the same gate as
// its own empty state in renderClassificationTable above, so "no
// league", "league not started" and "no snapshot published yet" are all
// covered the one existing way: no preview slide, and the full table in
// Facts still explains why if a parent goes looking.
//
// Position is always taken from the data's own `position`/row order
// (never recomputed from points — ties are the data source's call, not
// ours), and "2nd place"/"the leader" for the competitive-context line
// are always the official rows[0]/rows[1], so a tie on points never
// produces a contradictory message.
function renderClassificationPreviewSlide(classification) {
  if (!classification || !Array.isArray(classification.rows) || !classification.rows.length) return null;
  const rows = classification.rows;
  const ourRow = rows.find(r => r.isOurTeam);
  if (!ourRow || ourRow.position == null || ourRow.points == null) return null;
  const total = rows.length;
  const isLeader = rows[0] && rows[0].isOurTeam;

  // Competitive-context line — always present except for a single-team
  // classification (nothing to compare against). Leader compares to
  // 2nd place; everyone else compares to the leader. A tie gets its own
  // wording so it never reads "0 points behind".
  let contextMsg = null;
  if (total > 1) {
    if (isLeader) {
      const second = rows[1];
      if (second && second.points != null) {
        const diff = ourRow.points - second.points;
        contextMsg = diff === 0
          ? tr('cls_ctx_leader_tied', { rank: ordinalLabel(2) })
          : tr('cls_ctx_leader_ahead', { pts: ptsPhrase(diff), rank: ordinalLabel(2) });
      }
    } else {
      const leader = rows[0];
      if (leader && leader.points != null) {
        const diff = leader.points - ourRow.points;
        contextMsg = diff === 0
          ? tr('cls_ctx_trail_tied')
          : tr('cls_ctx_trail_behind', { pts: ptsPhrase(diff) });
      }
    }
  }

  // Season-record line — omitted entirely rather than showing dashes
  // when any part of it is missing, per "handle missing stats gracefully".
  const hasStatsRow = [ourRow.played, ourRow.wins, ourRow.draws, ourRow.losses].every(v => v != null);
  const statItems = hasStatsRow ? [
    { value: ourRow.played, label: plWord(ourRow.played, 'word_game', 'word_games') },
    { value: ourRow.wins, label: plWord(ourRow.wins, 'word_win', 'word_wins') },
    { value: ourRow.draws, label: plWord(ourRow.draws, 'word_draw', 'word_draws') },
    { value: ourRow.losses, label: plWord(ourRow.losses, 'word_loss', 'word_losses') },
  ] : null;

  const scopeBits = [classification.competitionName, classification.phase, classification.series].filter(Boolean).map(esc);
  const rank = ordinalParts(ourRow.position);

  return `
    <div class="card cls-preview-card" onclick="goToClassification()" onkeydown="if(event.key==='Enter'){goToClassification()}" role="button" tabindex="0">
      <div class="cls-preview-header">
        <span aria-hidden="true">🏆</span>
        <span>${tr('cls_section_header')}</span>
        ${scopeBits.length ? `<span class="cls-preview-header-scope">${scopeBits.join(' · ')}</span>` : ''}
      </div>
      <div class="cls-preview-main">
        <div class="cls-preview-rank${isLeader ? ' cls-preview-rank-gold' : ''}">
          ${isLeader ? trophyLaurelIconSvg() : ''}
          <div class="cls-preview-rank-num">${rank.num}<span class="cls-preview-rank-suffix">${rank.suffix}</span></div>
          <div class="cls-preview-rank-total">${tr('cls_preview_of')} ${total} ${plWord(total, 'word_team', 'word_teams')}</div>
        </div>
        <div class="cls-preview-info">
          <div class="cls-preview-team">${esc(cleanTeamName(ourRow.teamName || ''))}</div>
          <div class="cls-preview-points"><b>${ourRow.points}</b> ${plWord(ourRow.points, 'word_point', 'word_points')}</div>
          ${isLeader ? `<div class="cls-preview-status"><span aria-hidden="true">🏆</span> ${tr('cls_leader_status')}</div>` : ''}
        </div>
      </div>
      ${(statItems || contextMsg) ? `
      <div class="cls-preview-bottom">
        ${statItems ? `<div class="cls-preview-stats">${statItems.map(s => `<div class="cls-preview-stat"><b>${s.value}</b><span>${esc(s.label)}</span></div>`).join('')}</div>` : ''}
        ${contextMsg ? `<div class="cls-preview-context">${esc(contextMsg)}</div>` : ''}
      </div>` : ''}
      ${classification.stale ? `<div class="cls-warning" style="margin:8px 0 0">${tr('cls_stale_warning')}</div>` : ''}
      <div class="cls-preview-cta">
        ${barChartIconSvg()}
        <span class="cls-preview-cta-text">${tr('cls_preview_cta')}</span>
        ${chevronIconSvg()}
      </div>
    </div>`;
}

// Tap target for the classification preview slide — jumps to the Facts
// tab and scrolls straight to the table (vs. the normal tab-click/swipe
// path, which scrolls to the top of the page). Reuses the same two
// primitives applyTabs itself is driven by (the URL hash + a re-render),
// so Facts' own "which tab is active" logic doesn't need to know this
// entry point exists.
function goToClassification() {
  history.replaceState(null, '', '#team');
  const el = document.getElementById('content');
  if (el) applyTabs(el);
  const target = document.getElementById('cls-section');
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render(el, data) {
  // Reset so re-renders (language switch, the 15-60s live poll) don't pile
  // up stale entries in this array for the lifetime of the page.
  _dirTargets = [];
  applyTeamPageBranding(data.appBranding);

  const params = new URLSearchParams(window.location.search);
  if (params.get('view') === 'recap') {
    renderRecap(el, data);
    return;
  }

  const games = dedupeGames(data.games || []);
  const gamePlayers = data.gamePlayers || [];
  const players = dedupePlayers(data.players || []);
  const tournaments = data.tournaments || [];
  const season = data.season || {};
  // Season-wide guest/trial-player registry, deduped by tempPlayerId across
  // every game's own g.guestPlayers array (the RPC has no top-level
  // guestPlayers field — each game carries its own). Built once here so both
  // the season leaderboards (Marcadores/Assistências/Mais Titularidades) and
  // the live-match-today lineup card can look guests up by tempPlayerId,
  // same as the admin app's own guest registry.
  const guestPlayers = (() => {
    const seen = new Map();
    games.forEach(g => (g.guestPlayers || []).forEach(gp => {
      if (gp.tempPlayerId != null && !seen.has(gp.tempPlayerId)) seen.set(gp.tempPlayerId, gp);
    }));
    return [...seen.values()];
  })();

  // Only finished games count toward the record — same rule the main
  // app's own isGameResultVisible / Team Summary use: the moment kickoff
  // has passed, a game counts as finished. Games here already exclude
  // deleted rows; visibility just needs "already happened."
  const now = new Date();
  // Same completion rule as the app: kick-off + duration + buffer. The old
  // rule counted a game as finished at kick-off, so a live 0-0 showed as a
  // result. "Next Match" still moves on only once the game has finished.
  const finishedGames = games.filter(g => isGameFinished(g, season));
  const liveGames = games.filter(g => isGameLive(g, season)).sort((a,b) => gameSortKey(a) - gameSortKey(b));
  _liveGameOnPage = liveGames.length > 0;
  // Latest completed result — the single most recently-finished game, no
  // time window attached. It moves from the pinned area into the carousel
  // the instant isGameLive flips false (isGameLive/isGameFinished are
  // mutually exclusive, so a game is never both live and "latest result"
  // at once), and stays there until a newer finished game replaces it —
  // "latest" is simply recomputed on every render, nothing to expire.
  const latestCompletedGame = finishedGames.length
    ? [...finishedGames].sort((a,b) => gameSortKey(b) - gameSortKey(a))[0]
    : null;
  const upcomingGames = games.filter(g => g.date && !finishedGames.includes(g) && !liveGames.includes(g))
    .sort((a,b) => gameSortKey(a) - gameSortKey(b));
  const split = splitGames(finishedGames);
  const officialGames = split.official;

  const stats = computeTeamStats(officialGames);

  // Team-season disciplinary total (card-tracking feature, 2026-10-26) —
  // summed from the SAME per-game-player cardYellowCount/cardRedCount the
  // RPC computes from card_events, scoped to official games only (same
  // scoping as the rest of this Season Summary card's tiles). Naturally
  // comes out {0,0} when gamePlayers is '[]' (show_player_stats off), so
  // the tile below is gated on gamePlayers.length instead of a separate
  // privacy check — same implicit convention the Player Stats card already
  // uses (calledUp===0 for every player when the toggle is off).
  const officialGameIds = new Set(officialGames.map(g => g.gameId));
  const teamCardTotals = gamePlayers.filter(gp => officialGameIds.has(gp.gameId)).reduce((acc, gp) => {
    acc.yellow += parseInt(gp.cardYellowCount) || 0;
    acc.red += parseInt(gp.cardRedCount) || 0;
    return acc;
  }, { yellow: 0, red: 0 });

  // League Classification (ticket section 11) — the RPC already selected
  // the single latest-published snapshot for this season, scoped and
  // validated on the admin side; this page only displays it read-only.
  // Staleness is judged the same way the admin screen judges it: if our
  // own completed League matches for this exact competition already
  // outnumber what the snapshot shows for our row, the snapshot predates
  // at least one result we already have.
  const classification = data.classification || null;
  if (classification) {
    const ourClsRow = (classification.rows || []).find(r => r.isOurTeam);
    const clsCompName = (classification.competitionName || '').trim().toLowerCase();
    const clsScopeGames = finishedGames.filter(g => g.competitionType === 'League' && (g.competitionName || '').trim().toLowerCase() === clsCompName);
    classification.stale = !!(ourClsRow && clsScopeGames.length > (ourClsRow.played || 0));
  }

  // Recent Results lists every finished game (tagged by type); the form
  // strip in Season Summary is League & Cup only. Newest-first throughout —
  // the first 5 show by default, anything older folds behind "View all
  // results" (spec: Jogos tab UX improvements, §2).
  const finishedNewestFirst = [...finishedGames].sort((a,b) => gameSortKey(b) - gameSortKey(a));
  const recent = finishedNewestFirst.slice(0, 5);
  const olderResults = finishedNewestFirst.slice(5);
  const recentOfficial = [...officialGames].sort((a,b) => gameSortKey(b) - gameSortKey(a)).slice(0, 5);
  const next = upcomingGames[0];

  // Live Match banner — only shown when today is genuinely match day,
  // per the spec's "do not show it outside match day." Deliberately a
  // simple date check (today's date matches a scheduled game), not a
  // precise live-clock/in-progress detector, since the app has no
  // concept of "match currently in progress" beyond the scheduled date.
  const liveMatchToday = liveGames[0] || null;

  // Next Match and the birthday card sit above the menu when no game is
  // being played; while one is live the live card takes that spot and
  // these move into their tabs.
  const nextMatchHtml = next ? `
    <div class="card">

      ${(() => {
        const kickoff = new Date(`${next.date}T${next.gameTime || '00:00'}`);
        const daysLeft = Math.round((kickoff - new Date()) / (1000*60*60*24));

        return `<div style="font-size:12px;font-weight:700;color:var(--black-accent);margin-top:6px">${tr('days_remaining', {n: daysLeft})}</div>`;
      })()}

  const birthdays = dedupePlayerRows(data.birthdays || []);
  // Pinned carousel content. A birthday that falls on the actual current
  // day always takes the top slide (unchanged); otherwise a non-today
  // birthday note (this week / next one) takes the lowest slot.
  //
  // Between those two, up to three rotating cards — next match, standing,
  // latest result — swap their LEAD position dynamically, game-relative:
  //  - 0-1 days after the last completed game: that result is still the
  //    freshest news, so it leads.
  //  - 0-3 days before the next game: anticipation builds, so the next
  //    match leads.
  //  - Otherwise (the mid-week gap): the standing leads.
  // Whichever one doesn't lead keeps its place in the base order
  // (next match, standing, result) behind the leader. Confirmed with
  // Victor 2026-10-26 in place of the earlier fixed weekday idea, so this
  // keeps working whatever day a given week's match actually falls on.
  //
  // The result slide itself only EXISTS for that same 0-1 day window —
  // Victor 2026-10-26: beyond the day after the game it's just repeating
  // what the Matches tab already shows, so it drops out of the carousel
  // entirely rather than just losing the lead (a deliberate reversal of
  // the earlier "persists until the next result, no time window" design).
  const todayBirthdays = birthdays.filter(b => b.isToday);
  const happyBirthdaySlide = renderHappyBirthdaySlide(todayBirthdays);
  const birthdaySlide = happyBirthdaySlide || renderBirthdayInfoSlide(birthdays);
  const classificationPreviewSlide = renderClassificationPreviewSlide(classification);

  const todayStr = todayLocalDateStr();
  const daysSinceLastResult = latestCompletedGame ? calendarDaysDiff(latestCompletedGame.date, todayStr) : null;
  const daysUntilNextGame = next ? calendarDaysDiff(todayStr, next.date) : null;
  // Result slide only exists in the carousel for its day and the day
  // after (Victor: beyond that it's just repeating what the Matches tab
  // already shows). Same window also decides the lead below, so once the
  // slide has expired it can never be picked as leadKey either.
  const resultWithinCarouselWindow = daysSinceLastResult !== null && daysSinceLastResult >= 0 && daysSinceLastResult <= 1;
  const latestResultSlide = (!liveMatchToday && resultWithinCarouselWindow)
    ? renderMatchSummaryCard(latestCompletedGame, season, players, gamePlayers, latestCompletedGame.guestPlayers)
    : null;
  const leadWithResult = resultWithinCarouselWindow;
  const leadWithNextGame = !leadWithResult && daysUntilNextGame !== null && daysUntilNextGame >= 0 && daysUntilNextGame <= 3;
  let leadKey = 'classification';
  if (leadWithResult) leadKey = 'result';
  else if (leadWithNextGame) leadKey = 'next';

  const rotatingSlides = [
    { key: 'next', html: nextMatchHtml || null },
    { key: 'classification', html: classificationPreviewSlide },
    { key: 'result', html: latestResultSlide },
  ].filter(s => s.html);
  rotatingSlides.sort((a, b) => (a.key === leadKey ? -1 : b.key === leadKey ? 1 : 0));

  // Hidden entirely while a match is live — the global live card already
  // has full attention; the carousel returns with the latest result the
  // moment the match finishes and liveMatchToday clears on the next render.
  const carouselSlides = liveMatchToday ? [] : [
    todayBirthdays.length ? birthdaySlide : null,
    ...rotatingSlides.map(s => s.html),
    !todayBirthdays.length ? birthdaySlide : null,

  const html = `
    <div class="team-header" style="position:relative;overflow:hidden">

    </div>

    ${season.status === 'completed' ? `
    <a class="card" href="${esc(window.location.pathname+window.location.search+'&view=recap')}" style="background:#1a1a2e;color:#fff;text-decoration:none;display:block" aria-label="View full ${esc(season.seasonName)} Season Recap">

    <div class="pane" data-tab="team">
    ${renderClassificationTable(classification)}
    <div class="card">

      ${officialGames.length ? '' : '<p class="split-note">' + tr('no_official') + '</p>'}
      ${stats.played ? `
      <div style="margin-bottom:14px">

      </div>` : ''}

      ${olderResults.length ? `

    ${tournaments.length ? `

    <div class="pane" data-tab="lineup">
    ${liveMatchToday ? (() => {
      // Independent field from gamePlayers — gated by its own show_lineup
      // toggle rather than show_player_stats, so this can be shared
      // without exposing goals/assists/season stats.
      const liveGP = (data.lineup || []).filter(r => r.gameId === liveMatchToday.gameId);
      const starterIds = new Set(liveGP.filter(r => r.calledUp && r.role === 'Starter' && r.playerId).map(r => r.playerId));
      const subIds = new Set(liveGP.filter(r => r.calledUp && r.role !== 'Starter' && r.playerId).map(r => r.playerId));
      // Guest players normalized into the same shape as a regular
      // player (fullName/shirtNumber/primaryPosition) so the existing
      // grouping and row rendering below need no changes at all to
      // handle them — they're just more entries in the same array.
      const starterTempIds = new Set(liveGP.filter(r => r.calledUp && r.role === 'Starter' && r.tempPlayerId).map(r => r.tempPlayerId));
      const subTempIds = new Set(liveGP.filter(r => r.calledUp && r.role !== 'Starter' && r.tempPlayerId).map(r => r.tempPlayerId));
      // Effective position for this game: positionPlayed if the coach
      // set one, else the usual position — same chain as the coach
      // app, same reason: a player moved for today's match should be
      // grouped/shown by where they're actually playing, not their
      // normal spot. New objects via spread, not a mutation of the
      // shared players/guestPlayers arrays.
      const asPlayerShape = g => {
        const gp = liveGP.find(r => r.tempPlayerId === g.tempPlayerId) || {};
        return { fullName: g.name, shirtNumber: g.shirtNumber, primaryPosition: gp.positionPlayed || g.preferredPosition || null };
      };
      const withEffectivePos = p => {
        const gp = liveGP.find(r => r.playerId === p.playerId) || {};
        return { ...p, primaryPosition: gp.positionPlayed || p.primaryPosition };
      };
      // guestPlayers here is the season-wide registry built in render()
      // (deduped from each game's own g.guestPlayers) — data.guestPlayers
      // is not a field the RPC provides at the top level and was always
      // empty, silently hiding guest starters/subs on this card.
      const guestStarters = guestPlayers.filter(g => starterTempIds.has(g.tempPlayerId)).map(asPlayerShape);
      const guestSubs = guestPlayers.filter(g => subTempIds.has(g.tempPlayerId)).map(asPlayerShape);
      const starters = players.filter(p => starterIds.has(p.playerId)).map(withEffectivePos).concat(guestStarters);
      const subs = players.filter(p => subIds.has(p.playerId)).map(withEffectivePos).concat(guestSubs);
      const playerRow = p => `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(p.fullName)}</span>
          <span class="row-meta">${p.primaryPosition?esc(posName(p.primaryPosition)):''}</span>
        </div>`;
      // Live card: deliberately NOT rendered here — the global one
      // above the tab bar already covers it. Starting 11 goes straight
      // into its own content, per the confirmed design.
      return `
      <div class="card">
        <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('tab_lineup')}</h2>
        ${starters.length ? renderPositionGroupedRows(starters, playerRow) : `<p class="row-meta" style="padding:4px 0">${tr('lineup_none')}</p>`}
        ${subs.length ? `
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <div class="stat-label" style="margin-bottom:6px">${tr('lineup_subs')}</div>
          ${renderPositionGroupedRows(subs, playerRow)}
        </div>` : ''}
      </div>`;
    })() : ''}
    </div>

    <div class="pane" data-tab="squad">
    ${(() => {
      const av = data.availability;
      if (!av || (av.available + av.unavailable) <= 0) return '';
      const unavailableList = dedupePlayerRows(av.unavailablePlayers || []);
      // The counts are server-side totals; if duplicate rows inflated them,
      // fall back to the de-duplicated list rather than showing a number
      // that contradicts the names underneath.
      const dupes = (av.unavailablePlayers || []).length - unavailableList.length;
      const unavailableCount = dupes > 0 ? unavailableList.length : av.unavailable;
      const availableCount = dupes > 0 ? Math.max(0, players.length - unavailableCount) : av.available;
      return `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('availability')}</h2>
      <div class="stat-grid">
        <div><div class="stat-label">${tr('available')}</div><div class="stat-value" style="color:var(--green-accent)">${availableCount}</div></div>
        <div><div class="stat-label">${tr('unavailable')}</div><div class="stat-value" style="color:var(--red-accent)">${unavailableCount}</div></div>
      </div>
      ${unavailableList.length ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        ${unavailableList.map(p => `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(shortName(p.fullName))}${p.primaryPosition?' · '+esc(posName(p.primaryPosition)):''}</span>
          <span class="row-meta" style="color:var(--red-accent)">${tr('unavailable')}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>`;
    })()}

    ${players.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('squad')}</h2>
      ${renderPositionGroupedRows(players, p => {
        const s = playerPublicStats(p.playerId, finishedGames, gamePlayers);
        const mostPlayed = s.mostPlayedPosition || p.primaryPosition;
        return `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(p.fullName)}</span>
          <span class="row-meta">${p.primaryPosition?esc(posName(p.primaryPosition)):''}${(mostPlayed && mostPlayed !== p.primaryPosition) ? ' · ' + esc(posName(mostPlayed)) + ' (' + tr('most_played') + ')' : ''}</span>
        </div>`;

    ${players.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">${tr('player_stats')}</h2>

        const s = playerPublicStats(p.playerId, officialGames, gamePlayers);

    <div class="pane" data-tab="team">
    ${(data.seasonHighlights && data.seasonHighlights.length) ? `
    <div class="card highlight-card">

      // Score only — the card below names the teams.
      liveBar.innerHTML = `<span class="dot" aria-hidden="true"></span>`
        + `<span class="bar-label">${tr('live')}</span>`
        + `<span class="bar-score">${sc.home} - ${sc.away}</span>`;
      liveBar.onclick = () => document.querySelector('.live-card')?.scrollIntoView({behavior:'smooth', block:'center'});
      liveBar.hidden = false;           // present, but only slides in once
      updateLiveBarVisibility();        // the live card has scrolled away
    } else {
      liveBar.hidden = true;
      liveBar.innerHTML = '';
      liveBar.classList.remove('visible');
      document.body.classList.remove('live-bar-on');
    }
  }

  // Sticky compact header — populated here, shown/hidden via scroll
  // listener attached once (not re-attached on every render, since
  // loadTeamPage only calls render once per real data load anyway).
  const stickyNameEl = document.getElementById('stickyName');
  const stickySeasonEl = document.getElementById('stickySeason');
  if (stickyNameEl) stickyNameEl.textContent = season.clubName || 'Team';
  if (stickySeasonEl) stickySeasonEl.textContent = season.seasonName || '';

  if (!window._stickyScrollBound) {
    window._stickyScrollBound = true;
    window.addEventListener('scroll', () => {
      const stickyEl = document.getElementById('stickyHeader');
      const heroEl = document.querySelector('.team-header');
      if (stickyEl && heroEl) {
        const show = heroEl.getBoundingClientRect().bottom < 0;
        stickyEl.classList.toggle('visible', show);
        document.body.classList.toggle('sticky-on', show);
      }
      updateLiveBarVisibility();
    }, { passive: true });
  }
}

loadTeamPage();
</script>
</body>
</html>
