<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Team Season</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --black:#B23333;
    --dark:#333333;
    --muted:#6f6f6f;
    --border:#dddddd;
    --bg:#F2F4F7;
    --surface:#ffffff;
    --radius:3px;
    --green:#2a7a4e;
    --green-bg:#e6f4ea;
    --amber:#7a5f18;
    --amber-bg:#fbf3d9;
    --red:#b03030;
    --red-bg:#fbe9e9;
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;font-family:'Montserrat',Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--dark);margin:0;overscroll-behavior-x:none}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  .app-header{background:#0F1E2E;display:flex;align-items:center;gap:10px;padding:12px 16px}
  .app-header .brand-mark{width:32px;height:32px;border:1.5px solid var(--black);border-radius:6px;background:linear-gradient(135deg,#0F1E2E,#1a2f45);display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;color:#fff;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
  .app-header .brand-name{font-weight:800;font-size:16px;color:#fff}
  .app-header .brand-name b{color:var(--black)}
  .team-header{margin-bottom:16px}
  .team-header h1{font-size:22px;margin:0 0 2px;font-weight:800}
  .team-header .sub{font-size:13px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
  .card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .stat-value{font-size:20px;font-weight:800;margin-top:2px}
  .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .row-meta{font-size:11px;color:var(--muted);flex-shrink:0}
  .pill{background:#eee;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;flex-shrink:0}
  .badge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;flex-shrink:0}
  .badge-W{background:var(--green-bg);color:var(--green)}
  .badge-D{background:var(--amber-bg);color:var(--amber)}
  .badge-L{background:var(--red-bg);color:var(--red)}
  .score{font-size:13px;font-weight:700;flex-shrink:0}
  .leader-row{align-items:flex-start}
  .leader-row .row-name{flex:0 0 auto;white-space:normal}
  .leader-row .row-meta{flex:1;min-width:0;text-align:right;white-space:normal;overflow-wrap:anywhere}
  .comp-tag{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0}
  .live-card{border-color:var(--black);border-width:2px;padding:22px 18px 20px;text-align:center;box-shadow:0 2px 10px rgba(178,51,51,.18)}
  .live-flag{display:inline-flex;align-items:center;gap:7px;color:#fff;background:var(--black);border-radius:20px;padding:5px 14px;font-weight:800;font-size:12px;letter-spacing:1px}
  .live-flag .dot{width:9px;height:9px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
  .live-fixture{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .live-team{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
  .live-score{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px;flex-shrink:0}
  .live-meta{font-size:12px;color:var(--muted);margin-top:6px}
  .live-scorers{font-size:15px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);line-height:1.8;text-align:left}
  .live-scorers .who{font-weight:700}
  .live-note{font-size:11px;color:var(--muted);margin-top:12px}
  .split-note{font-size:12px;color:var(--muted);margin:0 0 8px}
  .split-line{font-size:11px;color:var(--muted);padding:0 0 9px;margin-top:-4px}
  .outcome-banner{text-align:center;padding:18px 16px}
  .outcome-banner .name{font-weight:700;font-size:14px}
  .outcome-banner .label{font-size:19px;font-weight:800;margin-top:4px}
  .squad-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#eee;font-size:11px;font-weight:700;flex-shrink:0}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty .icon{font-size:32px;margin-bottom:10px}
  .loading{text-align:center;padding:60px 16px;color:var(--muted)}
  .footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:skeleton-shimmer 1.4s ease-in-out infinite;border-radius:4px}
  @keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skeleton-line{height:14px;margin-bottom:8px}
  .skeleton-title{height:22px;width:60%;margin-bottom:4px}
  @media (prefers-reduced-motion: reduce){.skeleton{animation:none;background:#eee}}
  .sticky-header{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;transform:translateY(-100%);transition:transform .2s ease;z-index:100}
  .sticky-header.visible{transform:translateY(0)}
  .sticky-header .name{font-weight:800;font-size:14px}
  .sticky-header .season{font-size:11px;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){.sticky-header{transition:none}}
  .tabs{display:flex;gap:4px;position:sticky;top:0;z-index:900;background:var(--bg,#f2f4f7);padding:8px 0 10px;margin-bottom:4px}
  body.live-bar-on .tabs{top:39px}
  body.sticky-on .tabs{top:44px}
  body.sticky-on.live-bar-on .tabs{top:83px}
  .tab-btn{flex:1;min-width:0;padding:9px 4px;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .tab-btn[aria-selected="true"]{background:var(--black);border-color:var(--black);color:#fff}
  .pane[hidden]{display:none}
  .carousel{position:relative;overflow:hidden}
  .carousel-track{display:flex;transition:transform .3s ease}
  .carousel-slide{flex:0 0 100%;min-width:100%;box-sizing:border-box}
  .carousel-slide .card{margin-bottom:0}
  .carousel-dots{display:flex;justify-content:center;gap:6px;margin:8px 0 14px}
  .carousel-dot{width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;line-height:0}
  .carousel-dot span{display:block;width:7px;height:7px;margin:0 auto;border-radius:50%;background:var(--border)}
  .carousel-dot[aria-selected="true"] span{background:var(--black)}
  @media (prefers-reduced-motion: reduce){.carousel-track{transition:none}}
  .bday-count{font-size:12px;font-weight:700;color:#7a5f18;margin-top:6px}
  .comp-table{width:100%;border-collapse:collapse;font-size:12px}
  .comp-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:right;padding:3px 0}
  .comp-table th:first-child,.comp-table .comp-name{text-align:left}
  .comp-table td{padding:5px 0;text-align:right;border-top:1px solid var(--border)}
  .comp-table .comp-name{font-weight:700}
  .pane[data-tab="history"] .card{padding:12px 14px}
  .pane[data-tab="history"] .row{padding:6px 0;font-size:12px}
  .live-bar{position:fixed;top:0;left:0;right:0;transform:translateY(-100%);transition:transform .2s ease;z-index:1200;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;border:none;width:100%;font-family:inherit;text-align:center}
  .live-bar .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite;flex-shrink:0}
  .live-bar .bar-label{letter-spacing:1px;font-size:12px}
  .live-bar .bar-score{font-size:16px;font-weight:800;flex-shrink:0}
  .live-bar.visible{transform:translateY(0)}
  body.live-bar-on .sticky-header{top:39px}
  @media (prefers-reduced-motion: reduce){.live-bar{transition:none}}
  @media (prefers-reduced-motion: reduce){.live-bar .dot{animation:none}}
  .live-banner{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;font-weight:700;font-family:inherit;border:none;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;display:flex;align-items:center;gap:8px;cursor:pointer}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .skip-link{position:absolute;top:-40px;left:8px;background:var(--dark);color:#fff;padding:8px 14px;border-radius:4px;z-index:1000;text-decoration:none;font-size:13px;font-weight:700}
  .skip-link:focus{top:8px}
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, [role="button"]:focus-visible {
    outline:3px solid #1a56c4; outline-offset:2px;
  }
  /* No focus outline is ever removed without this visible replacement —
     every interactive element in this file relies on the browser's
     default focus behavior plus this enhanced visible ring, never
     outline:none on its own. */
  .live-banner .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:live-pulse 1.5s ease-in-out infinite}
  @keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){.live-banner .dot{animation:none}}
</style>
</head>
<body>
<a href="#content" class="skip-link">Skip to main content</a>
<button type="button" id="liveBar" class="live-bar" hidden aria-live="polite"></button>
<div id="stickyHeader" class="sticky-header" aria-hidden="true">
  <span class="name" id="stickyName"></span>
  <span class="season" id="stickySeason"></span>
</div>
<div class="app-header">
  <div class="brand-mark" id="brandMark" aria-hidden="true">11</div>
  <div class="brand-name" translate="no">Next<b>Eleven</b></div>
</div>
<div class="wrap">
  <main id="content">
    <div class="team-header">
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-line" style="width:30%"></div>
    </div>
    <div class="card">
      <div class="skeleton skeleton-line" style="width:40%"></div>
      <div class="skeleton skeleton-line" style="width:70%"></div>
    </div>
    <div class="card">
      <div class="skeleton skeleton-line" style="width:40%"></div>
      <div class="stat-grid">
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
      </div>
    </div>
  </main>
</div>

<script src="public-stats-core.js"></script>
<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
// Pre-configured so this page works with zero setup for whoever opens the
// link — same reasoning as the main app's own DEFAULTS: these values are
// meant to be public-facing (Supabase's anon key carries no special
// privileges by itself), and the actual security boundary is entirely
// inside the get_public_team_data RPC and this feature's RLS policy, not
// secrecy of the project URL.
const SUPABASE_URL = 'https://wicydcvdakqopodbxtrl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpY3lkY3ZkYWtxb3BvZGJ4dHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDA5NTUsImV4cCI6MjA5NzE3Njk1NX0._sIaztNAGi9ffuL8qz84G-q_h5TIKTYbyjcnD9VwbE0';

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  const parts = String(d).split('-');
  if (parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}
function shortName(fullName) {
  if (!fullName) return '';
  const parts = String(fullName).trim().split(/\s+/);
  if (parts.length <= 2) return fullName;
  return parts[0] + ' ' + parts[parts.length - 1];
}

// ── SAME RULES AS THE MAIN APP ─────────────────────────────────────────
// Completion: kick-off + match duration + 15 min buffer (the app's
// isGameResultVisible). No kick-off time: counts once the day has ended.
function isGameFinished(g, season) {
  if (!g || !g.date) return false;
  const now = new Date();
  if (!g.gameTime) return now > new Date(`${g.date}T23:59:59`);
  const kickoff = new Date(`${g.date}T${g.gameTime}`);
  if (isNaN(kickoff)) return false;
  const mins = (parseInt(g.matchDurationMins) || parseInt(season && season.defaultMatchDurationMins) || 90) + 15;
  return now >= new Date(kickoff.getTime() + mins * 60000);
}
// Kicked off but not finished yet — shown live, never counted in any record.
function isGameLive(g, season) {
  if (!g || !g.date || !g.gameTime) return false;
  const kickoff = new Date(`${g.date}T${g.gameTime}`);
  if (isNaN(kickoff)) return false;
  return new Date() >= kickoff && !isGameFinished(g, season);
}
// Competition split: official = League/Cup (and untyped), friendly =
// Friendly/Trial, tournament = linked to a tournament or typed Tournament.
function gameCategory(g) {
  if (!g) return 'official';
  if (g.tournamentId || g.competitionType === 'Tournament') return 'tournament';
  if (g.competitionType === 'Friendly' || g.competitionType === 'Trial') return 'friendly';
  return 'official';
}
function splitGames(games) {
  const out = { official: [], friendly: [], tournament: [] };
  (games || []).forEach(g => out[gameCategory(g)].push(g));
  return out;
}
const CATEGORY_LABEL = { official: 'League & Cup', friendly: 'Friendlies', tournament: 'Tournaments' };
const COMP_TYPE_TAG = { Friendly: 'Friendly', Trial: 'Trial', Tournament: 'Tournament', Cup: 'Cup', League: 'League' };

// One row per game. The same game can arrive more than once (a device
// that re-created a row instead of updating it), and the copies can hold
// different scores, which showed the same match as two live cards. Keep
// the most recently updated copy of each gameUuid, falling back to gameId.
function dedupeGames(games) {
  const best = new Map();
  (games || []).forEach(g => {
    const key = g.gameUuid || ('gid:' + g.gameId);
    const prev = best.get(key);
    if (!prev || new Date(g.updatedAt || 0) > new Date(prev.updatedAt || 0)) best.set(key, g);
  });
  return [...best.values()];
}
// One row per person: the public data can carry more than one row for
// the same player, which listed Lorenzo twice in Season Leaders.
function dedupePlayers(players) {
  const seen = new Set();
  return (players || []).filter(p => {
    const key = p.careerPlayerId || ('pid:' + p.playerId);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
// Leader names: list up to 3, otherwise say how many are tied.
function leaderNames(names) {
  return names.length > 3 ? `${names.length} players tied` : names.join(', ');
}

// Compact breakdown by competition, shown inside Season Summary so
// friendlies and tournaments no longer need cards of their own. A row
// appears only for a competition that has actually been played.
function renderCompetitionBreakdown(split, gamePlayers) {
  const rows = [
    ['League & Cup', split.official],
    ['Friendlies', split.friendly],
    ['Tournaments', split.tournament],
  ].filter(([, list]) => list.length);
  if (!rows.length) return '';
  return `
  <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
    <div class="stat-label" style="margin-bottom:6px">By Competition</div>
    <table class="comp-table">
      <thead><tr><th>&nbsp;</th><th>P</th><th>W-D-L</th><th>GF-GA</th></tr></thead>
      <tbody>
        ${rows.map(([label, list]) => {
          const t = teamSeasonStats(list, gamePlayers);
          return `<tr>
            <td class="comp-name">${label}</td>
            <td>${t.played}</td>
            <td>${t.wins}-${t.draws}-${t.losses}</td>
            <td>${t.goalsFor}-${t.goalsAgainst}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

// Record card for Friendlies / Tournaments; nothing if none played.
function renderRecordCard(title, list, gamePlayers) {
  if (!list.length) return '';
  const t = teamSeasonStats(list, gamePlayers);
  return `
  <div class="card">
    <h2 class="card-title" style="margin-top:0;font-size:11px">${title}</h2>
    <div class="stat-grid">
      <div><div class="stat-label">Record</div><div class="stat-value">${t.wins}-${t.draws}-${t.losses}</div></div>
      <div><div class="stat-label">Goal Diff</div><div class="stat-value">${t.goalDiff>0?'+':''}${t.goalDiff}</div></div>
      <div><div class="stat-label">Goals For</div><div class="stat-value">${t.goalsFor}</div></div>
      <div><div class="stat-label">Goals Against</div><div class="stat-value">${t.goalsAgainst}</div></div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════
// PHASE 3 — LIVE REFRESH ENGINE
// ══════════════════════════════════════════════════════════════════════════
let _teamPageToken = null;
let _lastGoodData = null;
let _refreshInFlight = false;
let _pollTimer = null;
let _lastSuccessfulRefresh = null;
// While a game is being played the page refreshes every 15s instead of
// every 60s, so parents watching the live card see goals within seconds of
// them being recorded. render() sets this each time it runs.
let _liveGameOnPage = false;
const POLL_LIVE_MS = 15000;
const POLL_IDLE_MS = 60000;

async function loadTeamPage() {
  const contentEl = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  _teamPageToken = params.get('token');

  if (!_teamPageToken) {
    contentEl.innerHTML = `<div class="empty"><div class="icon">🔗</div><strong>No link provided</strong><p>This page needs a share link from a parent or guardian.</p></div>`;
    return;
  }

  await refreshTeamData(true); // true = this is the initial load, allowed to replace the skeleton with an error state if it fails
  startPolling();
  bindVisibilityAndReconnectRefresh();
}

// The actual fetch + render step, reused by initial load, the 60s poll,
// visibility-change, reconnect, and the manual Refresh button — all of
// them funnel through this one function, which guarantees at most one
// request in flight at a time (per the approved spec) and never wipes a
// previously-successful render just because a later background refresh
// failed.
async function refreshTeamData(isInitialLoad) {
  if (_refreshInFlight) return; // never overlap two refreshes
  _refreshInFlight = true;
  const contentEl = document.getElementById('content');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_public_team_data`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ p_token: _teamPageToken }),
    });
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    if (!data) {
      // A genuinely revoked/disabled token — this is a real, permanent
      // state, not a transient failure, so it's correct to replace the
      // page even on a background refresh (per spec: disabled/revoked
      // tokens must show nothing).
      contentEl.innerHTML = `<div class="empty"><div class="icon">🔒</div><strong>This link isn't available</strong><p>It may have been disabled or replaced with a new one. Ask the team parent for the current link.</p></div>`;
      stopPolling();
      return;
    }

    _lastGoodData = data;
    _lastSuccessfulRefresh = new Date();
    // A background refresh rebuilds the page, which would otherwise throw
    // the reader back to the top mid-scroll — especially noticeable at the
    // 15-second live cadence. Put them back where they were.
    const keepScroll = isInitialLoad ? null : window.scrollY;
    render(contentEl, data);
    if (keepScroll != null) window.scrollTo(0, keepScroll);
    updateFooterRefreshStatus(null);
  } catch (err) {
    if (isInitialLoad && !_lastGoodData) {
      // Only the very first load, with nothing successful yet to fall
      // back on, shows the scary full-page error — every later failure
      // (a background poll, a flaky reconnect) keeps whatever was last
      // successfully shown, per "keep last successful data visible if
      // refresh fails."
      contentEl.innerHTML = `<div class="empty"><div class="icon">⚠️</div><strong>Couldn't load this page</strong><p>Please check your connection and try again.</p></div>`;
    } else {
      updateFooterRefreshStatus('Refresh failed — showing last update.');
    }
  } finally {
    _refreshInFlight = false;
  }
}

// Self-rescheduling rather than a fixed interval, so the gap can change
// between passes when a game kicks off or ends.
function startPolling() {
  if (_pollTimer) return; // never start twice
  const tick = async () => {
    if (document.visibilityState === 'visible' && navigator.onLine) {
      await refreshTeamData(false);
    }
    if (_pollTimer !== null) {
      _pollTimer = setTimeout(tick, _liveGameOnPage ? POLL_LIVE_MS : POLL_IDLE_MS);
    }
  };
  _pollTimer = setTimeout(tick, _liveGameOnPage ? POLL_LIVE_MS : POLL_IDLE_MS);
}

function stopPolling() {
  if (_pollTimer) { clearTimeout(_pollTimer); _pollTimer = null; }
}

function bindVisibilityAndReconnectRefresh() {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshTeamData(false);
  });
  window.addEventListener('online', () => refreshTeamData(false));
}

// Manual Refresh button handler — always allowed regardless of the
// in-flight guard's timing, since a real user tap should never feel
// ignored; refreshTeamData's own guard still prevents a true overlap if

function updateFooterRefreshStatus(errorMessage) {
  const el = document.getElementById('footerRefreshStatus');

  if (errorMessage) {

function renderSeasonLeaders(players, finishedGames, gamePlayers) {
  // finishedGames here = official (League & Cup) games only
  players = dedupePlayers(players);
  if (!players.length || !finishedGames.length) return '';

  const withStats = players.map(p => ({
    ...p,
    stats: playerPublicStats(p.playerId, finishedGames, gamePlayers)
  }));

  function leaderRow(label, statKey) {
    const maxVal = Math.max(...withStats.map(p => p.stats[statKey] || 0));
    if (maxVal === 0) return ''; // hide categories with no meaningful data
    const leaders = withStats.filter(p => (p.stats[statKey] || 0) === maxVal);
    const names = leaderNames(leaders.map(p => shortName(p.fullName)));
    return `<div class="row leader-row">
      <span class="row-name">${label}</span>
      <span class="row-meta">${esc(names)} (${maxVal})</span>
    </div>`;
  }

  const rows = [
    leaderRow('Most Appearances', 'calledUp'),
    leaderRow('Top Scorer', 'goals'),
    leaderRow('Most Assists', 'assists'),
  ].filter(r => r);

  if (!rows.length) return '';

  return `
  <div class="card">
    <h2 class="card-title" style="margin-top:0;font-size:11px">Season Leaders · League &amp; Cup</h2>
    ${rows.join('')}
  </div>`;
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtBirthday(b) {
  if (!b.birthdayMonth || !b.birthdayDay) return '';
  return b.birthdayDay + ' ' + MONTH_NAMES[b.birthdayMonth - 1];
}

// Pinned above the tabs: only a birthday today (prominent) or one within
// the week (compact). Anything further out lives in the Squad tab.
function renderBirthdaySection(birthdays) {
  if (!birthdays.length) return '';

  const todayBirthdays = birthdays.filter(b => b.isToday);
  const thisWeekBirthdays = birthdays.filter(b => b.isThisWeek && !b.isToday);

  // Today takes priority — a genuine, prominent celebration card, one
  // per player if multiple share a birthday (rare, but handled).
  if (todayBirthdays.length) {
    return `
    <div class="card" style="background:#fef6e0;border-color:#f0d98a;text-align:center">
      ${todayBirthdays.map(b => `
        <div style="padding:6px 0">
          <div style="font-size:28px" aria-hidden="true">🎂</div>
          <div style="font-weight:800;font-size:16px;margin-top:4px">Happy Birthday, ${esc(shortName(b.fullName))}!</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${fmtBirthday(b)} · Turning ${b.turningAge} today${b.shirtNumber ? ' · #' + esc(b.shirtNumber) : ''}</div>
        </div>
      `).join('<hr style="border:none;border-top:1px solid #f0d98a;margin:10px 0">')}
    </div>`;
  }

  // Within the coming week — a lighter mention, not a full celebration
  // card, since the day itself hasn't arrived yet.
  if (thisWeekBirthdays.length) {
    return `
    <div class="card" style="background:#fef6e0;border-color:#f0d98a">
      <h2 class="card-title" style="color:#7a5f18;margin-top:0;font-size:11px"><span aria-hidden="true">🎂</span> Birthday${thisWeekBirthdays.length>1?'s':''} This Week</h2>
      ${thisWeekBirthdays.map(b => `<div class="row">
        <span class="row-name">${esc(shortName(b.fullName))}${b.shirtNumber ? ' · #' + esc(b.shirtNumber) : ''}</span>
        <span class="row-meta">${fmtBirthday(b)} · Turning ${b.turningAge} · ${b.daysUntil === 1 ? 'tomorrow' : 'in ' + b.daysUntil + ' days'}</span>
      </div>`).join('')}
    </div>`;
  }

  return '';
}

// One card for the single next birthday, with a countdown. Used in the
// pinned carousel so a birthday is always visible on the main page.
function renderNextBirthdayCard(birthdays) {
  const list = birthdays || [];
  const b = list.find(x => x.isToday) || list[0];
  if (!b) return '';
  const name = esc(shortName(b.fullName));
  const num = b.shirtNumber ? ' · #' + esc(b.shirtNumber) : '';
  const when = b.isToday ? 'Today'
    : b.daysUntil === 1 ? 'Tomorrow'
    : `In ${b.daysUntil} days`;
  return `
  <div class="card" style="background:#fef6e0;border-color:#f0d98a">
    <h2 class="card-title" style="color:#7a5f18;margin-top:0;font-size:11px"><span aria-hidden="true">🎂</span> Next Birthday</h2>
    <div style="font-weight:700;font-size:15px">${name}${num}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:3px">${fmtBirthday(b)} · Turning ${b.turningAge}</div>

// Squad tab: the next few birthdays that aren't already pinned above.
function renderUpcomingBirthdays(birthdays) {
  const upcoming = (birthdays || []).filter(b => !b.isToday && !b.isThisWeek).slice(0, 3);

// Applies the app's own real branding logo to the header, per the
// "reuse the central branding resolver, do not build a separate
// mechanism" instruction — this is the public-page equivalent of
// applyDynamicBrandingToDocument() in the main app, fed by the RPC
// since team.html has no IndexedDB/branding-resolver access at all.
function applyTeamPageBranding(appBranding) {
  const mark = document.getElementById('brandMark');
  if (!mark) return;
  const logoUrl = appBranding?.mainLogo;
  if (logoUrl) {
    // Same fix as the main app: a real white background behind a likely-
    // transparent logo PNG, 'contain' so the full logo shows without
    // cropping, small padding via content-box so it doesn't touch the
    // rounded corners edge-to-edge.
    mark.style.background = '#fff';
    mark.style.backgroundImage = `url('${logoUrl}')`;
    mark.style.backgroundSize = 'contain';
    mark.style.backgroundRepeat = 'no-repeat';
    mark.style.backgroundPosition = 'center';
    mark.style.padding = '3px';
    mark.style.backgroundOrigin = 'content-box';
    mark.style.backgroundClip = 'content-box';
    mark.textContent = '';
  }
}

const TABS = [
  { id: 'matches', label: 'Matches' },
  { id: 'team',    label: 'Team' },
  { id: 'squad',   label: 'Squad' },
  { id: 'history', label: 'History' },
];

// Which tab is open survives the 15-second refresh and a reload, because
// it lives in the address bar rather than in a variable that render()
// rebuilds. A tab with nothing in it is dropped from the menu.
function currentTabId() {
  const fromHash = (location.hash || '').replace(/^#/, '');
  return TABS.some(t => t.id === fromHash) ? fromHash : 'matches';
}

// Which slide is showing survives a refresh; auto-advance stops for good
// once the reader picks a card themselves.
let _slideIndex = 0;
let _slideTimer = null;
let _slidePaused = false;

function applyCarousel(el) {
  const box = el.querySelector('#pinnedCarousel');
  if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; }
  if (!box) return;
  const track = box.querySelector('.carousel-track');
  const slides = [...box.querySelectorAll('.carousel-slide')];
  const dots = [...el.querySelectorAll('.carousel-dot')];
  if (!slides.length) return;

  const show = i => {
    _slideIndex = (i + slides.length) % slides.length;
    track.style.transform = `translateX(-${_slideIndex * 100}%)`;
    dots.forEach((d, n) => d.setAttribute('aria-selected', n === _slideIndex ? 'true' : 'false'));
  };
  show(_slideIndex);

  dots.forEach(d => {
    d.onclick = () => { _slidePaused = true; if (_slideTimer) { clearInterval(_slideTimer); _slideTimer = null; } show(parseInt(d.dataset.slide)); };
  });

  if (slides.length > 1 && !_slidePaused) {
    _slideTimer = setInterval(() => {
      if (document.visibilityState === 'visible') show(_slideIndex + 1);
    }, 6000);
  }
}

function applyTabs(el) {
  const panes = [...el.querySelectorAll('.pane')];
  if (!panes.length) return;
  const hasContent = id => panes.filter(p => p.dataset.tab === id)
    .some(p => p.querySelector('.card'));
  const available = TABS.filter(t => hasContent(t.id)).map(t => t.id);
  let active = currentTabId();
  if (!available.includes(active)) active = available[0] || 'matches';

  panes.forEach(p => { p.hidden = p.dataset.tab !== active; });
  el.querySelectorAll('[data-tabbtn]').forEach(btn => {
    const id = btn.dataset.tabbtn;
    btn.hidden = !available.includes(id);
    btn.setAttribute('aria-selected', id === active ? 'true' : 'false');
    btn.onclick = () => {
      // replaceState rather than assigning location.hash: no history entry
      // per tap, and no browser jump-to-anchor.
      history.replaceState(null, '', '#' + id);
      applyTabs(el);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
}

window.addEventListener('hashchange', () => {
  const el = document.getElementById('content');
  if (el) applyTabs(el);
});

// The bar only earns its place once the live card is off screen — above
// that, the card itself already shows the score.
function updateLiveBarVisibility() {
  const bar = document.getElementById('liveBar');
  if (!bar || bar.hidden) return;
  const card = document.querySelector('.live-card');
  const show = !card || card.getBoundingClientRect().bottom < 0;
  bar.classList.toggle('visible', show);
  document.body.classList.toggle('live-bar-on', show);
}

function render(el, data) {
  applyTeamPageBranding(data.appBranding);

  const params = new URLSearchParams(window.location.search);
  if (params.get('view') === 'recap') {
    renderRecap(el, data);
    return;
  }

  const games = dedupeGames(data.games || []);
  const gamePlayers = data.gamePlayers || [];
  const players = dedupePlayers(data.players || []);
  const tournaments = data.tournaments || [];
  const season = data.season || {};

  // Only finished games count toward the record — same rule the main
  // app's own isGameResultVisible / Team Summary use: the moment kickoff
  // has passed, a game counts as finished. Games here already exclude
  // deleted rows; visibility just needs "already happened."
  const now = new Date();
  // Same completion rule as the app: kick-off + duration + buffer. The old
  // rule counted a game as finished at kick-off, so a live 0-0 showed as a
  // result. "Next Match" still moves on only once the game has finished.
  const finishedGames = games.filter(g => isGameFinished(g, season));
  const liveGames = games.filter(g => isGameLive(g, season)).sort((a,b) => gameSortKey(a) - gameSortKey(b));
  _liveGameOnPage = liveGames.length > 0;
  const upcomingGames = games.filter(g => g.date && !finishedGames.includes(g) && !liveGames.includes(g))
    .sort((a,b) => gameSortKey(a) - gameSortKey(b));

  const officialGames = split.official;

  const stats = teamSeasonStats(officialGames, gamePlayers);

  // strip in Season Summary is League & Cup only.
  const recent = [...finishedGames].sort((a,b) => gameSortKey(b) - gameSortKey(a)).slice(0, 5);
  const recentOfficial = [...officialGames].sort((a,b) => gameSortKey(b) - gameSortKey(a)).slice(0, 5);
  const next = upcomingGames[0];

  // Live Match banner — only shown when today is genuinely match day,
  // per the spec's "do not show it outside match day." Deliberately a
  // simple date check (today's date matches a scheduled game), not a
  // precise live-clock/in-progress detector, since the app has no
  // concept of "match currently in progress" beyond the scheduled date.
  const liveMatchToday = liveGames[0] || null;

  // Next Match and the birthday card sit above the menu when no game is

      <h2 class="card-title" style="margin-top:0;font-size:11px">Season Summary · League &amp; Cup</h2>
      ${officialGames.length ? '' : '<p class="split-note">No League or Cup games played yet.</p>'}
      <div class="stat-grid">
        <div><div class="stat-label">Record</div><div class="stat-value">${stats.wins}-${stats.draws}-${stats.losses}</div></div>
        <div><div class="stat-label">Goal Diff</div><div class="stat-value">${stats.goalDiff>0?'+':''}${stats.goalDiff}</div></div>
        <div><div class="stat-label">Goals For</div><div class="stat-value">${stats.goalsFor}</div></div>
        <div><div class="stat-label">Goals Against</div><div class="stat-value">${stats.goalsAgainst}</div></div>
      </div>
      ${recentOfficial.length ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="stat-label" style="margin-bottom:6px">Current Form</div>
        <div style="display:flex;gap:6px">
          ${[...recentOfficial].reverse().map(g => {
            const gps = gamePlayers.filter(r => r.gameId === g.gameId);
            const our = teamGoals(gps, g);
            const their = parseInt(g.opponentScore)||0;
            const res = result(our, their, g);
            return `<span class="badge badge-${res}" style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%">${res}</span>`;
          }).join('')}
        </div>
      </div>` : ''}
      ${renderCompetitionBreakdown(split, gamePlayers)}
    </div>

    ${renderSeasonLeaders(players, officialGames, gamePlayers)}
    </div>

    <div class="pane" data-tab="matches">
    ${recent.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Recent Results</h2>
      ${recent.map(g => {
        const gps = gamePlayers.filter(r => r.gameId === g.gameId);
        const our = teamGoals(gps, g);
        const their = parseInt(g.opponentScore)||0;
        const res = result(our, their, g);
        const s = homeAwayScore(g.homeAway, our, their, g.neutralSide);
        const hasPens = g.ourPenaltyGoals!=null && g.penaltiesForThem!=null;
        return `<div class="row">
          <span class="row-name">${esc(g.opponent)}</span>
          <span class="comp-tag">${esc(g.competitionName || COMP_TYPE_TAG[g.competitionType] || '')}</span>
          <span class="score">${s.home}-${s.away}</span>
          ${hasPens?`<span class="row-meta">${g.ourPenaltyGoals}-${g.penaltiesForThem}P</span>`:''}
          <span class="badge badge-${res}">${res}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${tournaments.length ? `
    ${tournaments.map(t => {
      const outcome = getTournamentOutcomePublic(t, games, gamePlayers, 'EN');
      const matchesPlayed = games.filter(g => g.tournamentId === t.tournamentId).length;
      return `<div class="card">
        <h2 class="card-title" style="margin-top:0;font-size:11px">Tournament</h2>
        <div style="font-weight:700;font-size:15px">${esc(t.name)}</div>
        <div style="font-size:13px;margin-top:4px">${outcome.emoji ? outcome.emoji + ' ' : ''}${esc(outcome.label)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${matchesPlayed} match${matchesPlayed===1?'':'es'} played</div>
      </div>`;
    }).join('')}
    ` : ''}
    </div>

    <div class="pane" data-tab="squad">
    ${renderUpcomingBirthdays(data.birthdays || [])}
    ${(data.availability && (data.availability.available + data.availability.unavailable) > 0) ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Player Availability</h2>
      <div class="stat-grid">
        <div><div class="stat-label">Available</div><div class="stat-value" style="color:var(--green)">${data.availability.available}</div></div>
        <div><div class="stat-label">Unavailable</div><div class="stat-value" style="color:var(--red)">${data.availability.unavailable}</div></div>
      </div>
      ${data.availability.unavailablePlayers && data.availability.unavailablePlayers.length ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        ${data.availability.unavailablePlayers.map(p => `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(shortName(p.fullName))}${p.primaryPosition?' · '+esc(p.primaryPosition):''}</span>
          <span class="row-meta" style="color:var(--red)">Unavailable</span>
        </div>`).join('')}
      </div>` : ''}
    </div>` : ''}

    ${players.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Squad</h2>
      ${players.map(p => {
        const s = playerPublicStats(p.playerId, finishedGames, gamePlayers);
        const mostPlayed = s.mostPlayedPosition || p.primaryPosition;
        return `<div class="row">
          <span class="squad-num">${p.shirtNumber||'—'}</span>
          <span class="row-name">${esc(p.fullName)}</span>
          <span class="row-meta">${p.primaryPosition?esc(p.primaryPosition):''}${(mostPlayed && mostPlayed !== p.primaryPosition) ? ' · ' + esc(mostPlayed) + ' (most played)' : ''}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${players.length ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Player Statistics · League &amp; Cup</h2>
      ${dedupePlayers(players).map(p => {
        const all = playerPublicStats(p.playerId, finishedGames, gamePlayers);
        if (all.calledUp === 0) return '';
        const s = playerPublicStats(p.playerId, officialGames, gamePlayers);
        const extra = ['friendly', 'tournament'].map(k => {
          if (!split[k].length) return '';
          const x = playerPublicStats(p.playerId, split[k], gamePlayers);
          return x.calledUp ? `${CATEGORY_LABEL[k]}: ${x.calledUp} GP · ${x.goals} G · ${x.assists} A` : '';
        }).filter(Boolean).join(' &nbsp;|&nbsp; ');
        return `<div class="row"${extra ? ' style="border-bottom:none"' : ''}>
          <span class="row-name">${esc(shortName(p.fullName))}</span>
          <span class="pill">${s.calledUp} GP</span>
          <span class="pill">${s.goals} G</span>
          <span class="pill">${s.assists} A</span>
        </div>${extra ? `<div class="split-line" style="border-bottom:1px solid var(--border)">${extra}</div>` : ''}`;
      }).join('')}
    </div>` : ''}

    </div>

    <div class="pane" data-tab="team">
    ${(data.seasonHighlights && data.seasonHighlights.length) ? `
    <div class="card" style="background:#faf7f0;border-color:#e2d9c4">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Season Highlights</h2>
      ${data.seasonHighlights.map(a => `<div class="row">
        <span class="row-name"><span aria-hidden="true">🏆</span> ${esc(a.title)}</span>
        <span class="row-meta">${a.date ? fmtDate(a.date) : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    </div>

    <div class="pane" data-tab="history">
    ${(data.previousAchievements && data.previousAchievements.length) ? `
    <div class="card" style="background:#faf7f0;border-color:#e2d9c4">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Previous Achievements</h2>
      ${data.previousAchievements.map(a => `<div class="row">
        <span class="row-name"><span aria-hidden="true">🏆</span> ${esc(a.title)}</span>
        <span class="row-meta">${a.date ? fmtDate(a.date) : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    ${(data.previousSeasons && data.previousSeasons.length) ? `
    <div class="card">
      <h2 class="card-title" style="margin-top:0;font-size:11px">Previous Seasons</h2>
      ${data.previousSeasons.map(s => `<a class="row" href="team.html?token=${encodeURIComponent(s.shareToken)}" style="text-decoration:none;color:inherit" aria-label="View ${esc(s.seasonName)} season for ${esc(s.clubName||'')}">
        <span class="row-name">${esc(s.seasonName)}</span>
        <span class="row-meta">${esc(s.clubName||'')} ›</span>
      </a>`).join('')}
    </div>` : ''}
    </div>

    <div class="footer-note">
      Shared read-only via NextEleven · Live team data<br>
      <span id="footerRefreshStatus" role="status" aria-live="polite"></span>
      <button type="button" style="background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11px;margin-left:6px" onclick="handleManualRefresh()">Refresh</button>
    </div>
  `;

  el.innerHTML = html;
  applyTabs(el);
  applyCarousel(el);

  // Live score bar, pinned to the top of the page while a game is on —
  // both teams and the running score, tap to jump to the live card. It
  // scrolls with the page rather than floating over the content, which is
  // what the old bottom pill did.
  const liveBar = document.getElementById('liveBar');
  if (liveBar) {
    if (liveMatchToday) {
      const gps = gamePlayers.filter(r => r.gameId === liveMatchToday.gameId);
      const our = teamGoals(gps, liveMatchToday);
      const their = parseInt(liveMatchToday.opponentScore)||0;
      const sc = homeAwayScore(liveMatchToday.homeAway, our, their, liveMatchToday.neutralSide);
      // Score only — the card below names the teams.
      liveBar.innerHTML = `<span class="dot" aria-hidden="true"></span>`
        + `<span class="bar-label">LIVE</span>`
        + `<span class="bar-score">${sc.home} - ${sc.away}</span>`;
      liveBar.onclick = () => document.querySelector('.live-card')?.scrollIntoView({behavior:'smooth', block:'center'});
      liveBar.hidden = false;           // present, but only slides in once
      updateLiveBarVisibility();        // the live card has scrolled away
    } else {
      liveBar.hidden = true;
      liveBar.innerHTML = '';
      liveBar.classList.remove('visible');
      document.body.classList.remove('live-bar-on');
    }
  }

  // Sticky compact header — populated here, shown/hidden via scroll
  // listener attached once (not re-attached on every render, since
  // loadTeamPage only calls render once per real data load anyway).
  const stickyNameEl = document.getElementById('stickyName');
  const stickySeasonEl = document.getElementById('stickySeason');
  if (stickyNameEl) stickyNameEl.textContent = season.clubName || 'Team';
  if (stickySeasonEl) stickySeasonEl.textContent = season.seasonName || '';

  if (!window._stickyScrollBound) {
    window._stickyScrollBound = true;
    window.addEventListener('scroll', () => {
      const stickyEl = document.getElementById('stickyHeader');
      const heroEl = document.querySelector('.team-header');
      if (stickyEl && heroEl) {
        const show = heroEl.getBoundingClientRect().bottom < 0;
        stickyEl.classList.toggle('visible', show);
        document.body.classList.toggle('sticky-on', show);
      }
      updateLiveBarVisibility();
    }, { passive: true });
  }
}

loadTeamPage();
</script>
</body>
</html>
